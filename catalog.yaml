      upstream:
        name: Paperless-ngx
        url: https://github.com/paperless-ngx/paperless-ngx
        license: GPL-3.0
      description:
        en: Scan, organize and search your documents with automatic text recognition
        zh-TW: 透過自動文字辨識掃描、整理與搜尋你的文件
        zh-CN: 通过自动文字辨识扫描、整理与搜索你的文档
        de: Dokumente scannen, ordnen und mit automatischer Texterkennung durchsuchen
        fr: Numérisez, classez et recherchez vos documents grâce à la reconnaissance de texte
        ja: 文書をスキャンし、自動文字認識で整理・検索
        ko: 문서를 스캔하고 자동 문자 인식으로 정리하고 검색
        es: Digitaliza, organiza y busca documentos con reconocimiento automático de texto
        it: Digitalizza, organizza e cerca documenti con riconoscimento automatico del testo
      long_description:
        en: Turn paper documents into a searchable digital archive. Import scans, recognize their text with
          OCR, and organize documents with tags, correspondents and document types. Search document
          contents and control sharing with Paperless permissions. Imported files are removed from
          the inbox, so keep backups; the selected inbox needs package-account Read/Write
          permission. App data remains in Container Manager volumes after uninstall; DSM sign-in and
          Container Manager are required
        zh-TW: 將紙本文件變成可搜尋的數位檔案庫。匯入掃描檔，以 OCR 辨識文字，並用標籤、往來對象及文件類型整理資料。搜尋文件內容，依 Paperless
          權限管理分享。匯入後會移除收件資料夾中的檔案，請保留備份；所選收件資料夾須授予套件帳號讀寫權限。卸載後 App 資料仍保留於 Container Manager 儲存空間；需
          DSM 登入及 Container Manager
        zh-CN: 将纸本文档变成可搜索的数字文件库。导入扫描档，以 OCR 辨识文字，并用标签、往来对象及文档类型整理数据。搜索文档内容，依 Paperless
          权限管理分享。导入后会移除收件文件夹中的文件，请保留备份；所选收件文件夹须授予套件帐号读写权限。卸载后 App 数据仍保留于 Container Manager 存储空间；需
          DSM 登录及 Container Manager
        de: Mach aus Papierdokumenten ein durchsuchbares digitales Archiv. Importiere Scans, erkenne ihren
          Text per OCR und ordne Dokumente mit Tags, Korrespondenten und Dokumenttypen. Durchsuche
          Dokumentinhalte und steuere das Teilen mit den Berechtigungen von Paperless. Importierte
          Dateien werden aus dem Eingang entfernt, also behalte Sicherungen; der gewählte
          Eingangsordner braucht Lese- und Schreibzugriff für das Paketkonto. App-Daten bleiben nach
          der Deinstallation in Volumes von Container Manager; DSM-Anmeldung und Container Manager
          sind erforderlich
        fr: Transformez vos documents papier en archive numérique consultable. Importez des numérisations,
          reconnaissez leur texte par OCR et classez les documents par étiquettes, correspondants et
          types de documents. Recherchez dans leur contenu et contrôlez le partage avec les
          autorisations de Paperless. Les fichiers importés sont retirés de la boîte de réception,
          gardez donc des sauvegardes ; la boîte de réception choisie doit accorder la lecture et
          l'écriture au compte du paquet. Les données de l'App restent dans les volumes de Container
          Manager après la désinstallation ; connexion DSM et Container Manager requis
        ja: 紙の文書を検索できるデジタル アーカイブにします。スキャンを取り込み、OCR で文字を認識し、タグ、差出人、文書タイプで整理できます。文書の内容を検索し、共有は Paperless
          の権限で管理します。取り込んだファイルは受信フォルダーから削除されるので、バックアップを残してください。選択した受信フォルダーにはパッケージ
          アカウントの読み取り/書き込み権限が必要です。アプリのデータはアンインストール後も Container Manager のボリュームに残ります。DSM サインインと
          Container Manager が必要です
        ko: 종이 문서를 검색할 수 있는 디지털 보관함으로 바꿔요. 스캔을 가져오고, OCR로 글자를 인식하고, 태그, 거래처, 문서 유형으로 정리해요. 문서 내용을 검색하고 공유는
          Paperless 권한으로 관리해요. 가져온 파일은 받은 편지함 폴더에서 지워지니 백업을 꼭 남겨 두세요. 선택한 받은 편지함 폴더에는 패키지 계정의 읽기/쓰기
          권한이 필요해요. 앱 데이터는 제거 후에도 Container Manager 볼륨에 남아요. DSM 로그인과 Container Manager가 필요해요
        es: "Convierte documentos en papel en un archivo digital con búsqueda. Importa escaneos, reconoce su
          texto con OCR y organiza los documentos con etiquetas, corresponsales y tipos de
          documento. Busca en el contenido y controla el acceso con los permisos de Paperless. Los
          archivos importados se eliminan de la bandeja de entrada: conserva copias de seguridad. La
          cuenta del paquete necesita permiso de lectura y escritura en la carpeta de entrada
          seleccionada. Los datos de la aplicación se conservan en los volúmenes de Container
          Manager tras desinstalarla; requiere iniciar sesión en DSM y disponer de Container
          Manager"
        it: "Trasforma i documenti cartacei in un archivio digitale ricercabile. Importa scansioni,
          riconosci il testo con OCR e organizza i documenti con etichette, corrispondenti e tipi di
          documento. Cerca nei contenuti e controlla la condivisione con i permessi di Paperless. I
          file importati vengono rimossi dalla cartella di ingresso: conserva copie di backup.
          L'account del pacchetto deve avere i permessi di lettura e scrittura sulla cartella di
          ingresso selezionata. I dati dell'app restano nei volumi di Container Manager dopo la
          disinstallazione; richiede l'accesso a DSM e Container Manager"
