  - recommended: true
    category: utilities
    order: 20
    publisher: synopackageland
    source:
      kind: github-release
      repo: synopackageland/syno-pkg-connect
      release: v0.1.0-0073
      access: private
    metadata:
      contact_email: support@synopkgland.com
      support_email: support@synopkgland.com
      homepage: https://synopkgland.com/
      internet: required
      license: MIT. Bundled Go and npm dependencies keep their own licenses; the full
        notices ship in the package's LICENSES/ folder. The cloudflared,
        Tailscale and NetBird clients are downloaded from their vendors under
        their own licenses. Source code is not public at this time.
      description:
        en: Reach your NAS remotely without opening router ports. Turn Cloudflare
          Tunnel, Tailscale, NetBird or IPv6 direct access on or off from one
          page
        zh-TW: 不必在路由器開放連接埠，也能從外部連回 NAS。在同一頁啟用或停用 Cloudflare Tunnel、Tailscale、NetBird 與
          IPv6 直連
        zh-CN: 无需在路由器开放端口，也能从外部连回 NAS。在同一页启用或停用 Cloudflare Tunnel、Tailscale、NetBird 与
          IPv6 直连
        ja: ルーターのポートを開放せずに外部から NAS へ接続できます。Cloudflare Tunnel、Tailscale、NetBird、IPv6
          直接接続を 1 つの画面で有効化・無効化できます
        ko: 라우터 포트를 열지 않고도 외부에서 NAS에 접속해요. Cloudflare Tunnel, Tailscale, NetBird, IPv6
          직접 연결을 한 화면에서 켜고 끌 수 있어요
        de: Greifen Sie aus der Ferne auf Ihr NAS zu, ohne Router-Ports zu öffnen.
          Cloudflare Tunnel, Tailscale, NetBird und IPv6-Direktzugriff lassen
          sich auf einer Seite ein- und ausschalten
        fr: Accédez à votre NAS à distance sans ouvrir de ports sur le routeur. Activez
          ou désactivez Cloudflare Tunnel, Tailscale, NetBird et l’accès direct
          IPv6 depuis une seule page
        es: Acceda a su NAS de forma remota sin abrir puertos en el router. Active o
          desactive Cloudflare Tunnel, Tailscale, NetBird y el acceso directo
          por IPv6 desde una sola página
        it: Raggiungi il NAS da remoto senza aprire porte sul router. Attiva o disattiva
          Cloudflare Tunnel, Tailscale, NetBird e l’accesso diretto IPv6 da
          un’unica pagina
      long_description:
        en: >-
          Reach your NAS remotely without opening router ports


          - Let the setup guide help you choose Cloudflare Tunnel, Tailscale or
          workers.dev

          - Give approved Apps private Tailscale URLs or public Cloudflare URLs,
          with your own domain or workers.dev

          - Open approved App URLs from the DSM menu, keeping links to pages
          inside an App

          - Use Tailscale or NetBird for private Drive and SMB access, subject
          to access rules and management-server policy

          - Keep connections waiting through slow NAS responses and restore them
          in the background; unused connection features stop their background
          loops


          Sign in with a DSM administrator account
        zh-TW: |-
          不必在路由器開放連接埠，也能從外部連回 NAS

          - 透過設定指引選擇 Cloudflare Tunnel、Tailscale 或 workers.dev
          - 為核准的 App 設定 Tailscale 私人網址，或使用自有網域／workers.dev 的 Cloudflare 公開網址
          - 從 DSM 主選單開啟核准的 App 網址，並保留 App 內頁的深層連結
          - 使用 Tailscale 或 NetBird 私人存取 Drive 與 SMB，依存取規則與管理伺服器政策授權
          - NAS 回應緩慢時持續等待並在背景恢復連線；未使用的連線功能會停止背景迴圈

          需使用 DSM 管理員帳號登入
      changelog:
        en: >-
          0.1.0-0073


          - Choose a connection method with a short setup guide, then continue
          on its setup page

          - Give approved Apps private URLs or public Cloudflare addresses,
          including workers.dev without a domain of your own

          - Open approved App URLs from the DSM menu and keep deep links; fix
          opening Connect from the DSM menu over a public address

          - Keep NetBird, Tailscale and cloudflared waiting through slow NAS
          responses and restore them in the background; unused connection
          features stop their background loops

          - Keep the App list readable while connections restore, and let
          administrators reset unreadable App URL records with a backup

          - Explain invalid Cloudflare tokens and request only Workers Scripts
          Edit when setting up workers.dev
        zh-TW: >-
          0.1.0-0073


          - 透過簡短指引選擇連線方式，接著直接在對應頁面繼續設定

          - 為核准的 App 設定私人網址或 Cloudflare 公開網址，也能使用 workers.dev，不必自備網域

          - 從 DSM 主選單開啟核准的 App 網址並保留深層連結；修正經公開網址從 DSM 主選單開啟 Connect 的問題

          - NAS 回應緩慢時，NetBird、Tailscale 與 cloudflared
          會持續等待並在背景恢復；未使用的連線功能會停止背景迴圈

          - 恢復連線時仍可讀取 App 清單；管理員可備份並重設無法讀取的 App 網址紀錄

          - 清楚提示 Cloudflare token 無效，設定 workers.dev 時只要求 Workers Scripts Edit 權限
