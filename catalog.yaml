      long_description:
        en: |-
          Secure access from anywhere

          - Reach the NAS and its Apps from anywhere without opening router ports, with DSM sign-in required by default
          - Pick one way or combine them: a free workers.dev link, your own Cloudflare domain, Tailscale, NetBird, a self-hosted NetBird server or IPv6 direct access
          - Choose which Apps are reachable and manage each App and its links in one dialog, for Syno Package Land Apps and native DSM apps
          - Add custom web Apps by URL or from detected NAS services, with DSM sign-in on by default
          - On your own domain, limit the DSM and App web addresses to an email allow-list with one-time codes using Cloudflare Access (Zero Trust Free); own domain only, and native clients such as Photos or Drive cannot pass the browser email check
          - Follow a four-step wizard to choose a way, connect it, select Apps and open their links
          - See connections and items needing attention in the home topology

          Sign in with a DSM administrator account
        zh-TW: |-
          從任何地方安全連回 NAS

          - 不必在路由器開放連接埠，就能從任何地方連回 NAS 與其 App，預設需 DSM 登入
          - 任選一種或併用：免費 workers.dev 連結、自有 Cloudflare 網域、Tailscale、NetBird、自架 NetBird 伺服器或 IPv6 直連
          - 選擇哪些 App 可被存取，並在單一對話框管理每個 App 與其連結，Syno Package Land App 與 DSM 原生 App 皆適用
          - 以 URL 或 NAS 偵測到的服務新增自訂網頁 App，預設開啟 DSM 登入
          - 在自有網域上，可用 Cloudflare Access（Zero Trust Free）把 DSM 與 App 網址限制在需一次性驗證碼的電子郵件允許清單；僅限自有網域，且 Photos、Drive 等原生用戶端無法通過瀏覽器郵件驗證
          - 四步驟精靈引導選擇方式、連線、選擇 App 並開啟連結
          - 首頁拓樸呈現連線狀態與待處理項目

          需使用 DSM 管理員帳號登入
        zh-CN: |-
          从任何地方安全连回 NAS

          - 无需在路由器开放端口，就能从任何地方连回 NAS 与其 App，默认需 DSM 登录
          - 任选一种或混用：免费 workers.dev 链接、自有 Cloudflare 域名、Tailscale、NetBird、自建 NetBird 服务器或 IPv6 直连
          - 选择哪些 App 可被访问，并在单一对话框中管理每个 App 及其链接，Syno Package Land App 与 DSM 原生 App 均适用
          - 通过 URL 或检测到的 NAS 服务添加自定义网页 App，默认开启 DSM 登录
          - 在自有域名上，可用 Cloudflare Access（Zero Trust Free）把 DSM 与 App 网址限制在需一次性验证码的电子邮件允许列表；仅限自有域名，且 Photos、Drive 等原生客户端无法通过浏览器邮件验证
          - 四步骤向导引导选择方式、连接、选择 App 并打开链接
          - 首页拓扑呈现连接状态与待处理项目

          需使用 DSM 管理员帐号登录
        ja: |-
          どこからでも安全に接続

          - ルーターのポートを開けずに、どこからでも NAS とそのアプリに接続でき、DSM サインインは既定で必要です
          - 方法は 1 つでも組み合わせてもかまいません：無料の workers.dev リンク、独自の Cloudflare ドメイン、Tailscale、NetBird、セルフホストの NetBird サーバー、IPv6 直接接続
          - 公開するアプリを選び、アプリごとのリンクを 1 つのダイアログで管理できます。Syno Package Land のアプリと DSM ネイティブアプリの両方に対応
          - URL または検出された NAS サービスからカスタム Web アプリを追加でき、DSM サインインは既定でオンです
          - 独自ドメインでは Cloudflare Access（Zero Trust Free）を使い、DSM とアプリの Web アドレスをワンタイムコード付きのメール許可リストに限定できます。独自ドメインのみが対象で、Photos や Drive などのネイティブクライアントはブラウザーのメール確認を通れません
          - 4 ステップのウィザードで、方法を選んで接続し、アプリを選んでリンクを開けます
          - ホームのトポロジーで接続状況と対応が必要な項目を確認できます

          DSM 管理者アカウントでサインインしてください
        ko: |-
          어디서든 안전하게 접속

          - 라우터 포트를 열지 않고 어디서든 NAS와 그 앱에 접속하며, DSM 로그인은 기본으로 필요해요
          - 방식을 하나 고르거나 조합할 수 있어요: 무료 workers.dev 링크, 내 Cloudflare 도메인, Tailscale, NetBird, 직접 호스팅한 NetBird 서버, IPv6 직접 연결
          - 접근할 앱을 고르고 앱마다 링크를 대화 상자 하나에서 관리해요. Syno Package Land 앱과 DSM 네이티브 앱 모두 지원해요
          - URL이나 감지된 NAS 서비스로 사용자 지정 웹 앱을 추가하며, DSM 로그인은 기본으로 켜져 있어요
          - 내 도메인에서는 Cloudflare Access(Zero Trust Free)로 DSM과 앱 웹 주소를 일회용 코드를 쓰는 이메일 허용 목록으로 제한해요. 내 도메인만 해당하며 Photos나 Drive 같은 네이티브 클라이언트는 브라우저 이메일 확인을 통과하지 못해요
          - 4단계 마법사로 방식을 고르고, 연결하고, 앱을 선택해 링크를 열어요
          - 홈 토폴로지에서 연결 상태와 확인이 필요한 항목을 봐요

          DSM 관리자 계정으로 로그인하세요
        de: |-
          Sicherer Zugriff von überall

          - Erreiche dein NAS und seine Apps von überall, ohne Ports am Router zu öffnen; die DSM-Anmeldung ist standardmäßig erforderlich
          - Wähle einen Weg oder kombiniere sie: ein kostenloser workers.dev-Link, deine eigene Cloudflare-Domain, Tailscale, NetBird, ein selbst gehosteter NetBird-Server oder IPv6-Direktzugriff
          - Lege fest, welche Apps erreichbar sind, und verwalte jede App samt ihren Links in einem Dialog, für Syno Package Land Apps und native DSM-Apps
          - Füge eigene Web-Apps per URL oder aus erkannten NAS-Diensten hinzu, mit DSM-Anmeldung standardmäßig an
          - Beschränke auf deiner eigenen Domain die Web-Adressen von DSM und Apps mit Cloudflare Access (Zero Trust Free) auf eine E-Mail-Allowlist mit Einmalcodes; nur eigene Domain, und native Clients wie Photos oder Drive kommen nicht durch die Browser-E-Mail-Prüfung
          - Ein Assistent in vier Schritten: Weg wählen, verbinden, Apps auswählen und ihre Links öffnen
          - Sieh Verbindungen und offene Punkte in der Übersichtstopologie

          Melde dich mit einem DSM-Administratorkonto an
        fr: |-
          Accès sécurisé depuis n’importe où

          - Accédez à votre NAS et à ses Apps depuis n’importe où sans ouvrir de ports sur le routeur, avec la connexion DSM exigée par défaut
          - Choisissez une méthode ou combinez-les — un lien workers.dev gratuit, votre propre domaine Cloudflare, Tailscale, NetBird, un serveur NetBird auto-hébergé ou l’accès direct IPv6
          - Choisissez les Apps accessibles et gérez chaque App et ses liens dans une seule fenêtre, pour les Apps Syno Package Land comme pour les apps DSM natives
          - Ajoutez des Apps web par URL ou depuis les services NAS détectés, avec la connexion DSM activée par défaut
          - Sur votre propre domaine, limitez les adresses web du DSM et des Apps à une liste d’e-mails autorisés avec codes à usage unique via Cloudflare Access (Zero Trust Free) ; domaine personnel uniquement, et les clients natifs comme Photos ou Drive ne passent pas la vérification par e-mail du navigateur
          - Un assistant en quatre étapes : choisir une méthode, la connecter, sélectionner les Apps et ouvrir leurs liens
          - Voyez les connexions et les points à traiter dans la topologie d’accueil

          Connectez-vous avec un compte administrateur DSM
        es: |-
          Acceso seguro desde cualquier lugar

          - Acceda a su NAS y a sus Apps desde cualquier lugar sin abrir puertos en el router, con el inicio de sesión de DSM exigido de forma predeterminada
          - Elija una forma o combínelas: un enlace workers.dev gratuito, su propio dominio de Cloudflare, Tailscale, NetBird, un servidor NetBird autoalojado o el acceso directo por IPv6
          - Elija qué Apps son accesibles y gestione cada App y sus enlaces en un solo cuadro de diálogo, tanto para Apps de Syno Package Land como para apps nativas de DSM
          - Añada Apps web personalizadas por URL o desde los servicios de NAS detectados, con el inicio de sesión de DSM activado de forma predeterminada
          - En su propio dominio, limite las direcciones web de DSM y de las Apps a una lista de correos permitidos con códigos de un solo uso mediante Cloudflare Access (Zero Trust Free); solo dominio propio, y los clientes nativos como Photos o Drive no superan la comprobación de correo del navegador
          - Un asistente de cuatro pasos para elegir una forma, conectarla, seleccionar Apps y abrir sus enlaces
          - Vea las conexiones y los puntos que requieren atención en la topología de inicio

          Inicie sesión con una cuenta de administrador de DSM
        it: |-
          Accesso sicuro da qualsiasi luogo

          - Raggiungi il NAS e le sue App da qualsiasi luogo senza aprire porte sul router, con l’accesso DSM richiesto per impostazione predefinita
          - Scegli un modo o combinane più: un link workers.dev gratuito, il tuo dominio Cloudflare, Tailscale, NetBird, un server NetBird self-hosted o l’accesso diretto IPv6
          - Scegli quali App sono raggiungibili e gestisci ogni App e i suoi link in un’unica finestra, sia per le App di Syno Package Land sia per le app native DSM
          - Aggiungi App web personalizzate per URL o dai servizi NAS rilevati, con l’accesso DSM attivo per impostazione predefinita
          - Sul tuo dominio, limita gli indirizzi web di DSM e delle App a una lista di email consentite con codici monouso tramite Cloudflare Access (Zero Trust Free); solo dominio proprio, e i client nativi come Photos o Drive non superano il controllo email del browser
          - Una procedura guidata in quattro passi per scegliere un modo, collegarlo, selezionare le App e aprire i link
          - Vedi connessioni e voci da controllare nella topologia della home

          Accedi con un account amministratore DSM
      changelog:
        en: "0.1.0-0142\n\n- Fixed phone pages freezing when scrolling back up after the header hides; improved the phone top bar and Settings action footer\n\n0.1.0-0141\n\n- Update the build toolchain\n- Fix extra page space, sideways panning and sticky offsets on phones\n\n0.1.0-0140\n\n- Update the build toolchain and shrink public UI bundles with minification\n- Remove empty action space on phone pages and fix drawer button focus after touch\n\n0.1.0-0139\n\n- Register Syno Connect Center in the Syno Package Land mobile app with a direct phone layout, without enabling DSM Application Portal. Keep administrator-only API access and update CLI, SDK and UI dependencies\n- Keep phone page actions in one SDK overflow menu\n\n0.1.0-0138\n\n- Show the old and new DSM HTTPS ports after named-tunnel route withdrawal or restart; offer Review and reconnect instead of a certificate-change warning. Keep explicit administrator trust before forwarding to the changed endpoint\n\n0.1.0-0137\n\n- Keep the two newest NetBird corrupt-state backups and remove stale temporary files\n- Limit Tailscale certificate and DNS caches; check private temporary storage every 15 seconds and stop providers that exceed its budget\n- If temporary files still exceed the budget after safe cache cleanup, explain the cause and offer Restart with the saved sign-in\n\n0.1.0-0136\n\n- Keep temporary Cloudflare access working when DSM redirects HTTP to HTTPS by using the existing pinned HTTPS proxy\n- Report DSM HTTPS port changes with the old and new ports and an inline review/reconnect action\n- Bound Tailscale/NetBird files to 1 MiB, disable Taildrop and network-map disk caching, and clear transient provider data on stop\n\n0.1.0-0135\n\n- Add this NAS to the Syno Package Land mobile app by scanning the new Connect your phone QR code on the Home, or copy the same link\n- LAN addresses come first, followed by connected external addresses; untrusted HTTPS LAN addresses include certificate fingerprints, while temporary Cloudflare addresses and credentials are omitted"
        zh-TW: "0.1.0-0142\n\n- 修正手機頁面在頂部列隱藏後往上捲動會凍結的問題，改善手機頂部列與設定頁的操作列\n\n0.1.0-0141\n\n- 更新建置工具鏈\n- 修正手機頁面多餘留白、橫向滑動與固定元素偏移\n\n0.1.0-0140\n\n- 更新建置工具鏈，壓縮公開 UI 檔案以縮小體積\n- 移除手機頁面的操作區留白，修正觸控關閉導覽選單後的按鈕焦點框\n\n0.1.0-0139\n\n- 將 Syno Connect Center 註冊至 Syno Package Land 行動 App，可直接開啟手機版介面，無須啟用 DSM 應用程式入口。保留僅限管理員的 API 存取，並更新 CLI、SDK 與 UI 相依套件\n- 手機頁面操作集中於 SDK 的單一更多選單\n\n0.1.0-0138\n\n- 自訂網域通道撤回路由或重新啟動後，仍顯示 DSM HTTPS 的新舊連接埠，提供檢查並重新連線，不再誤報憑證變更。轉送至變更後的端點前，仍須管理員明確信任\n\n0.1.0-0137\n\n- NetBird 僅保留最新兩份損毀狀態備份，並清除過期暫存檔\n- 限制 Tailscale 憑證與 DNS 快取；每 15 秒檢查私有暫存空間，超過預算時停止連線服務\n- 先淘汰可清理的快取，暫存檔仍超額時說明原因，並提供使用已儲存登入身分的重新啟動操作\n\n0.1.0-0136\n\n- 臨時 Cloudflare 網址改用既有 HTTPS 憑證釘選代理，支援 DSM 的 HTTP 轉 HTTPS 設定\n- DSM HTTPS 改埠時顯示原埠、新埠及確認後重新連接的操作\n- 限制 Tailscale／NetBird 單檔為 1 MiB，停用 Taildrop 與網路對應磁碟快取，停止時清除暫存資料\n\n0.1.0-0135\n\n- 在首頁開啟新的「連接手機」，使用 Syno Package Land 行動應用程式掃描 QR code，即可加入這台 NAS，也可複製相同連結\n- 優先列出區域網路位址，再列出已連線的外部位址；不受信任的 HTTPS 區域網路位址附帶憑證指紋，並排除 Cloudflare 臨時位址與登入憑證"
        zh-CN: "0.1.0-0142\n\n- 修复手机页面在顶部栏隐藏后向上滚动会冻结的问题，改善手机顶部栏与设置页的操作栏\n\n0.1.0-0141\n\n- 更新构建工具链\n- 修正手机页面多余留白、横向滑动与固定元素偏移\n\n0.1.0-0140\n\n- 更新构建工具链，压缩公开 UI 文件以缩小体积\n- 移除手机页面的操作区留白，修正触控关闭导航菜单后的按钮焦点框\n\n0.1.0-0139\n\n- 将 Syno Connect Center 注册到 Syno Package Land 移动 App，可直接打开手机版界面，无需启用 DSM 应用程序门户。保留仅限管理员的 API 访问，并更新 CLI、SDK 和 UI 依赖\n- 手机页面操作集中于 SDK 的单一更多菜单\n\n0.1.0-0138\n\n- 自定义域名通道撤回路由或重新启动后，仍显示 DSM HTTPS 的新旧端口，提供检查并重新连接，不再误报证书变更。转发至变更后的端点前，仍须管理员明确信任\n\n0.1.0-0137\n\n- NetBird 仅保留最新两份损坏状态备份，并清除过期临时文件\n- 限制 Tailscale 证书与 DNS 缓存；每 15 秒检查私有临时空间，超出预算时停止连接服务\n- 先淘汰可清理的缓存，临时文件仍超额时说明原因，并提供使用已保存登录身份的重新启动操作\n\n0.1.0-0136\n\n- 临时 Cloudflare 地址改用现有 HTTPS 证书固定代理，支持 DSM 的 HTTP 转 HTTPS 设置\n- DSM HTTPS 端口更改时显示原端口、新端口及确认后重新连接的操作\n- 将 Tailscale／NetBird 单个文件限制为 1 MiB，禁用 Taildrop 和网络映射磁盘缓存，停止时清除临时数据\n\n0.1.0-0135\n\n- 在首页打开新的“连接手机”，使用 Syno Package Land 移动应用扫描二维码，即可添加这台 NAS，也可复制相同链接\n- 优先列出局域网地址，再列出已连接的外部地址；不受信任的 HTTPS 局域网地址附带证书指纹，并排除 Cloudflare 临时地址与登录凭据"
        ja: "0.1.0-0142\n\n- ヘッダーが隠れた後に上へスクロールするとスマートフォンの画面が固まる問題を修正し、上部バーと設定画面の操作フッターを改善\n\n0.1.0-0141\n\n- ビルドツールチェーンを更新\n- スマートフォン画面の余白、横方向のずれ、固定要素の位置ずれを修正\n\n0.1.0-0140\n\n- ビルドツールチェーンを更新し、公開 UI ファイルを圧縮して小型化\n- スマートフォン画面の操作用余白を削除し、タッチでメニューを閉じた後のボタンのフォーカス枠を修正\n\n0.1.0-0139\n\n- Syno Connect Center を Syno Package Land モバイルアプリに登録し、DSM アプリケーションポータルを有効にせずにスマートフォン用画面を直接開けるようにしました。管理者専用 API アクセスを維持し、CLI、SDK、UI を更新\n- スマートフォンのページ操作を SDK の単一メニューにまとめる\n\n0.1.0-0138\n\n- 独自ドメインのトンネルの経路撤回や再起動後も DSM HTTPS の変更前後のポートを表示し、証明書変更の警告ではなく確認と再接続を案内。変更後の接続先への転送には引き続き管理者による明示的な信頼が必要\n\n0.1.0-0137\n\n- NetBird の破損した状態のバックアップを最新 2 件に制限し、古い一時ファイルを削除\n- Tailscale の証明書と DNS キャッシュを制限。専用の一時領域を 15 秒ごとに確認し、上限を超えたサービスを停止\n- 安全に削除できるキャッシュを先に整理し、上限を超える場合は理由と保存済み認証情報での再起動を表示\n\n0.1.0-0136\n\n- 一時的な Cloudflare 接続で既存の証明書固定 HTTPS プロキシを使用し、DSM の HTTPS リダイレクトに対応\n- DSM HTTPS ポートの変更前後を表示し、確認して再接続する操作を追加\n- Tailscale/NetBird のファイルを各 1 MiB に制限し、Taildrop とネットワークマップのディスクキャッシュを無効化。停止時に一時データを削除\n\n0.1.0-0135\n\n- ホームの新しい「スマートフォンを接続」で QR コードを表示し、Syno Package Land モバイルアプリでスキャンしてこの NAS を追加できます。同じリンクのコピーも可能です\n- LAN アドレスを先に、その後に接続中の外部アドレスを表示します。信頼されていない HTTPS LAN アドレスには証明書のフィンガープリントを含め、一時的な Cloudflare アドレスと認証情報は除外します"
        ko: "0.1.0-0142\n\n- 헤더가 숨겨진 뒤 위로 스크롤할 때 휴대폰 화면이 멈추는 문제를 수정하고 상단 표시줄과 설정 화면의 작업 표시줄을 개선\n\n0.1.0-0141\n\n- 빌드 도구 업데이트\n- 휴대폰 페이지의 불필요한 여백, 가로 이동 및 고정 요소 위치 수정\n\n0.1.0-0140\n\n- 빌드 도구를 업데이트하고 공개 UI 파일을 압축하여 크기 축소\n- 휴대폰 페이지의 빈 작업 공간을 제거하고 터치로 메뉴를 닫은 뒤 버튼에 남는 포커스 테두리 수정\n\n0.1.0-0139\n\n- Syno Connect Center를 Syno Package Land 모바일 앱에 등록하여 DSM 응용 프로그램 포털을 활성화하지 않고 휴대폰 화면을 직접 엽니다. 관리자 전용 API 접근을 유지하고 CLI, SDK, UI 의존성을 업데이트\n- 휴대폰 페이지 작업을 SDK의 단일 더보기 메뉴에 모으기\n\n0.1.0-0138\n\n- 자체 도메인 터널의 경로 철회나 재시작 후에도 DSM HTTPS의 이전 포트와 새 포트를 표시하고 인증서 변경 경고 대신 검토 및 재연결을 제공합니다. 변경된 엔드포인트로 전달하기 전에 관리자의 명시적 신뢰가 필요합니다\n\n0.1.0-0137\n\n- NetBird의 손상된 상태 백업을 최신 2개만 유지하고 오래된 임시 파일 삭제\n- Tailscale 인증서 및 DNS 캐시 제한. 전용 임시 저장소를 15초마다 확인하고 한도를 초과하면 서비스 중지\n- 안전한 캐시 정리 후에도 한도를 초과하면 원인을 설명하고 저장된 로그인으로 다시 시작 제공\n\n0.1.0-0136\n\n- 임시 Cloudflare 연결에 기존 인증서 고정 HTTPS 프록시를 사용하여 DSM HTTPS 리디렉션 지원\n- DSM HTTPS 포트 변경 시 이전 및 새 포트와 확인 후 재연결 작업 표시\n- Tailscale/NetBird 파일을 각각 1 MiB로 제한하고 Taildrop 및 네트워크 맵 디스크 캐시 비활성화, 중지 시 임시 데이터 삭제\n\n0.1.0-0135\n\n- 홈의 새로운 휴대폰 연결에서 QR 코드를 표시하고 Syno Package Land 모바일 앱으로 스캔하여 이 NAS를 추가하거나 같은 링크를 복사할 수 있습니다\n- LAN 주소를 먼저 표시한 다음 연결된 외부 주소를 표시합니다. 신뢰되지 않는 HTTPS LAN 주소에는 인증서 지문을 포함하며 임시 Cloudflare 주소와 로그인 자격 증명은 제외합니다"
        de: "0.1.0-0142\n\n- Einfrieren der Mobilansicht beim Zurückscrollen nach dem Ausblenden der Kopfzeile behoben; obere Leiste und Aktionsleiste der Einstellungen verbessert\n\n0.1.0-0141\n\n- Build-Toolchain aktualisieren\n- Zusätzlichen Seitenabstand, seitliches Verschieben und versetzte fixierte Elemente auf dem Smartphone korrigieren\n\n0.1.0-0140\n\n- Build-Toolchain aktualisieren und öffentliche UI-Dateien durch Minifizierung verkleinern\n- Leeren Aktionsbereich auf Telefonseiten entfernen und Button-Fokus nach Schließen des Menüs per Touch korrigieren\n\n0.1.0-0139\n\n- Syno Connect Center in der mobilen Syno Package Land App registrieren und die Telefonansicht direkt ohne DSM Anwendungsportal öffnen. API-Zugriff bleibt auf Administratoren beschränkt; CLI, SDK und UI aktualisieren\n- Seitenaktionen auf dem Telefon in einem SDK-Menü bündeln\n\n0.1.0-0138\n\n- Nach Rücknahme oder Neustart einer Tunnelroute mit eigener Domain die alten und neuen DSM-HTTPS-Ports mit Prüfung und Wiederverbindung statt einer Zertifikatswarnung anzeigen. Weiterleitung weiterhin erst nach ausdrücklicher Bestätigung durch den Administrator\n\n0.1.0-0137\n\n- Nur die zwei neuesten NetBird-Sicherungen beschädigter Zustände behalten und veraltete temporäre Dateien löschen\n- Tailscale-Zertifikat- und DNS-Caches begrenzen; privaten temporären Speicher alle 15 Sekunden prüfen und Dienste bei Überschreitung stoppen\n- Zuerst entbehrliche Caches löschen; bei verbleibender Überschreitung Ursache und Neustart mit gespeicherter Anmeldung anbieten\n\n0.1.0-0136\n\n- Temporäre Cloudflare-Verbindungen verwenden den vorhandenen HTTPS-Proxy mit Zertifikatsbindung und unterstützen die HTTPS-Weiterleitung von DSM\n- Änderungen am DSM-HTTPS-Port zeigen alten und neuen Port sowie eine Aktion zum Prüfen und erneuten Verbinden\n- Tailscale/NetBird-Dateien auf jeweils 1 MiB begrenzen, Taildrop und Netzwerkplan-Disk-Cache deaktivieren und temporäre Daten beim Stoppen entfernen\n\n0.1.0-0135\n\n- Fügen Sie dieses NAS zur mobilen Syno Package Land App hinzu: Scannen Sie den neuen QR-Code unter Telefon verbinden auf der Startseite oder kopieren Sie denselben Link\n- LAN-Adressen stehen zuerst, danach folgen verbundene externe Adressen; nicht vertrauenswürdige HTTPS-LAN-Adressen enthalten Zertifikat-Fingerabdrücke, temporäre Cloudflare-Adressen und Zugangsdaten werden ausgelassen"
        fr: "0.1.0-0142\n\n- Correction du blocage sur mobile lors du défilement vers le haut après le masquage de l’en-tête ; amélioration de la barre supérieure et des actions des paramètres\n\n0.1.0-0141\n\n- Mettre à jour les outils de compilation\n- Corriger l’espace superflu, le défilement latéral et le décalage des éléments fixes sur téléphone\n\n0.1.0-0140\n\n- Mettre à jour les outils de compilation et réduire les fichiers UI publics par minification\n- Supprimer l’espace vide des actions sur téléphone et corriger le focus du bouton après fermeture tactile du menu\n\n0.1.0-0139\n\n- Enregistrer Syno Connect Center dans l’app mobile Syno Package Land pour ouvrir directement la vue téléphone sans activer le portail des applications DSM. Conserver les API réservées aux administrateurs et mettre à jour CLI, SDK et UI\n- Regrouper les actions de page du téléphone dans un seul menu du SDK\n\n0.1.0-0138\n\n- Afficher les anciens et nouveaux ports HTTPS de DSM après le retrait ou le redémarrage du tunnel avec domaine personnel, avec vérification et reconnexion au lieu d’une alerte de certificat. Conserver la validation explicite de l’administrateur avant le transfert\n\n0.1.0-0137\n\n- Conserver les deux sauvegardes NetBird les plus récentes des états corrompus et supprimer les fichiers temporaires anciens\n- Limiter les caches de certificats et DNS Tailscale ; vérifier le stockage temporaire privé toutes les 15 secondes et arrêter les services dépassant le budget\n- Nettoyer d’abord les caches supprimables ; si la limite reste dépassée, expliquer la cause et proposer un redémarrage avec les identifiants enregistrés\n\n0.1.0-0136\n\n- Utiliser le proxy HTTPS existant avec épinglage du certificat pour les adresses Cloudflare temporaires et la redirection HTTPS de DSM\n- Afficher les anciens et nouveaux ports HTTPS de DSM avec une action de vérification et de reconnexion\n- Limiter chaque fichier Tailscale/NetBird à 1 MiB, désactiver Taildrop et le cache disque de la carte réseau, et supprimer les données temporaires à l’arrêt\n\n0.1.0-0135\n\n- Ajoutez ce NAS à l’application mobile Syno Package Land en scannant le nouveau code QR de Connecter votre téléphone sur l’accueil, ou copiez le même lien\n- Les adresses LAN précèdent les adresses externes connectées ; les adresses HTTPS LAN non approuvées incluent les empreintes des certificats, tandis que les adresses Cloudflare temporaires et les identifiants sont exclus"
        es: "0.1.0-0142\n\n- Corregido el bloqueo de la vista móvil al desplazarse hacia arriba tras ocultarse la cabecera; mejoradas la barra superior y las acciones de configuración\n\n0.1.0-0141\n\n- Actualizar las herramientas de compilación\n- Corregir el espacio sobrante, el desplazamiento lateral y la posición de los elementos fijos en el teléfono\n\n0.1.0-0140\n\n- Actualizar las herramientas de compilación y reducir los archivos públicos de la interfaz mediante minificación\n- Eliminar el espacio vacío de acciones en el teléfono y corregir el foco del botón al cerrar el menú con un toque\n\n0.1.0-0139\n\n- Registrar Syno Connect Center en la app móvil Syno Package Land para abrir directamente la vista de teléfono sin activar el portal de aplicaciones de DSM. Mantener las API solo para administradores y actualizar CLI, SDK y UI\n- Agrupar las acciones de página del teléfono en un único menú del SDK\n\n0.1.0-0138\n\n- Mostrar los puertos HTTPS de DSM anteriores y nuevos tras retirar la ruta o reiniciar el túnel con dominio propio, con revisión y reconexión en lugar de un aviso de certificado. Mantener la confianza explícita del administrador antes de reenviar\n\n0.1.0-0137\n\n- Conservar las dos copias más recientes del estado dañado de NetBird y eliminar archivos temporales antiguos\n- Limitar las cachés de certificados y DNS de Tailscale; comprobar el almacenamiento temporal privado cada 15 segundos y detener servicios que superen el límite\n- Limpiar primero las cachés prescindibles; si se sigue superando el límite, explicar la causa y ofrecer reinicio con la sesión guardada\n\n0.1.0-0136\n\n- Usar el proxy HTTPS existente con certificado fijado para las direcciones temporales de Cloudflare y la redirección HTTPS de DSM\n- Mostrar los puertos HTTPS anterior y nuevo de DSM con una acción para revisar y reconectar\n- Limitar cada archivo de Tailscale/NetBird a 1 MiB, desactivar Taildrop y la caché de disco del mapa de red y borrar los datos temporales al detener\n\n0.1.0-0135\n\n- Añada este NAS a la aplicación móvil Syno Package Land escaneando el nuevo código QR de Conectar el teléfono en el inicio, o copie el mismo enlace\n- Las direcciones LAN aparecen primero, seguidas de las direcciones externas conectadas; las direcciones HTTPS LAN no fiables incluyen las huellas de sus certificados, y se omiten las direcciones temporales de Cloudflare y las credenciales"
        it: "0.1.0-0142\n\n- Risolto il blocco della vista mobile scorrendo verso l’alto dopo la scomparsa dell’intestazione; migliorate la barra superiore e le azioni delle impostazioni\n\n0.1.0-0141\n\n- Aggiornare gli strumenti di compilazione\n- Correggere lo spazio in eccesso, lo scorrimento laterale e la posizione degli elementi fissi sul telefono\n\n0.1.0-0140\n\n- Aggiornare gli strumenti di compilazione e ridurre i file UI pubblici tramite minificazione\n- Rimuovere lo spazio vuoto delle azioni sul telefono e correggere il focus del pulsante dopo la chiusura del menu tramite tocco\n\n0.1.0-0139\n\n- Registrare Syno Connect Center nell’app mobile Syno Package Land per aprire direttamente la vista telefono senza attivare il portale applicazioni DSM. Mantenere le API riservate agli amministratori e aggiornare CLI, SDK e UI\n- Riunire le azioni della pagina sul telefono in un unico menu SDK\n\n0.1.0-0138\n\n- Mostrare le porte HTTPS di DSM precedenti e nuove dopo il ritiro della rotta o il riavvio del tunnel con dominio proprio, con verifica e riconnessione invece di un avviso sul certificato. Richiedere ancora la fiducia esplicita dell’amministratore prima di inoltrare\n\n0.1.0-0137\n\n- Conservare solo i due backup NetBird più recenti degli stati danneggiati ed eliminare i file temporanei obsoleti\n- Limitare le cache di certificati e DNS di Tailscale; controllare lo spazio temporaneo privato ogni 15 secondi e arrestare i servizi che superano il limite\n- Eliminare prima le cache ricreabili; se il limite resta superato, spiegare il motivo e offrire il riavvio con le credenziali salvate\n\n0.1.0-0136\n\n- Usare il proxy HTTPS esistente con certificato fissato per gli indirizzi Cloudflare temporanei e il reindirizzamento HTTPS di DSM\n- Mostrare la vecchia e la nuova porta HTTPS di DSM con un’azione di verifica e riconnessione\n- Limitare ogni file di Tailscale/NetBird a 1 MiB, disabilitare Taildrop e la cache su disco della mappa di rete e rimuovere i dati temporanei all’arresto\n\n0.1.0-0135\n\n- Aggiungi questo NAS all’app mobile Syno Package Land scansionando il nuovo codice QR di Collega il telefono nella home, oppure copia lo stesso link\n- Gli indirizzi LAN precedono quelli esterni connessi; gli indirizzi HTTPS LAN non attendibili includono le impronte dei certificati, mentre gli indirizzi temporanei Cloudflare e le credenziali sono esclusi"
