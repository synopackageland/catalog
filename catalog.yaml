        unrecorded:
          - en:
              - Add this NAS to the Syno Package Land mobile app by scanning the new Connect your
                phone QR code on the Home, or copy the same link
              - LAN addresses come first, followed by connected external addresses; untrusted HTTPS
                LAN addresses include certificate fingerprints, while temporary Cloudflare addresses
                and credentials are omitted
            zh-TW:
              - 在首頁開啟新的「連接手機」，使用 Syno Package Land 行動應用程式掃描 QR code，即可加入這台 NAS，也可複製相同連結
              - 優先列出區域網路位址，再列出已連線的外部位址；不受信任的 HTTPS 區域網路位址附帶憑證指紋，並排除 Cloudflare 臨時位址與登入憑證
            zh-CN:
              - 在首页打开新的“连接手机”，使用 Syno Package Land 移动应用扫描二维码，即可添加这台 NAS，也可复制相同链接
              - 优先列出局域网地址，再列出已连接的外部地址；不受信任的 HTTPS 局域网地址附带证书指纹，并排除 Cloudflare 临时地址与登录凭据
            de:
              - "Fügen Sie dieses NAS zur mobilen Syno Package Land App hinzu: Scannen Sie den neuen
                QR-Code unter Telefon verbinden auf der Startseite oder kopieren Sie denselben Link"
              - LAN-Adressen stehen zuerst, danach folgen verbundene externe Adressen; nicht
                vertrauenswürdige HTTPS-LAN-Adressen enthalten Zertifikat-Fingerabdrücke, temporäre
                Cloudflare-Adressen und Zugangsdaten werden ausgelassen
            fr:
              - Ajoutez ce NAS à l’application mobile Syno Package Land en scannant le nouveau code
                QR de Connecter votre téléphone sur l’accueil, ou copiez le même lien
              - Les adresses LAN précèdent les adresses externes connectées ; les adresses HTTPS LAN
                non approuvées incluent les empreintes des certificats, tandis que les adresses
                Cloudflare temporaires et les identifiants sont exclus
            ja:
              - ホームの新しい「スマートフォンを接続」で QR コードを表示し、Syno Package Land モバイルアプリでスキャンしてこの NAS
                を追加できます。同じリンクのコピーも可能です
              - LAN アドレスを先に、その後に接続中の外部アドレスを表示します。信頼されていない HTTPS LAN アドレスには証明書のフィンガープリントを含め、一時的な
                Cloudflare アドレスと認証情報は除外します
            ko:
              - 홈의 새로운 휴대폰 연결에서 QR 코드를 표시하고 Syno Package Land 모바일 앱으로 스캔하여 이 NAS를 추가하거나 같은 링크를 복사할 수
                있습니다
              - LAN 주소를 먼저 표시한 다음 연결된 외부 주소를 표시합니다. 신뢰되지 않는 HTTPS LAN 주소에는 인증서 지문을 포함하며 임시
                Cloudflare 주소와 로그인 자격 증명은 제외합니다
            es:
              - Añada este NAS a la aplicación móvil Syno Package Land escaneando el nuevo código QR
                de Conectar el teléfono en el inicio, o copie el mismo enlace
              - Las direcciones LAN aparecen primero, seguidas de las direcciones externas
                conectadas; las direcciones HTTPS LAN no fiables incluyen las huellas de sus
                certificados, y se omiten las direcciones temporales de Cloudflare y las
                credenciales
            it:
              - Aggiungi questo NAS all’app mobile Syno Package Land scansionando il nuovo codice QR
                di Collega il telefono nella home, oppure copia lo stesso link
              - Gli indirizzi LAN precedono quelli esterni connessi; gli indirizzi HTTPS LAN non
                attendibili includono le impronte dei certificati, mentre gli indirizzi temporanei
                Cloudflare e le credenziali sono esclusi
