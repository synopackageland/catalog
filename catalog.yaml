    metadata:
      guides:
        - url: https://community.synopkgland.com/d/41
          title:
            en: Find what is eating your NAS space and free it safely
            zh-TW: 找出 NAS 空間被誰吃掉，安全地清出來
          summary:
            en: Real Btrfs numbers, duplicates, Recycle Bin and snapshots in a few steps
            zh-TW: Btrfs 真實可回收空間、重複內容、回收筒與快照，幾步搞定
          image: https://github.com/user-attachments/assets/09555c0d-3314-4c35-a333-655961933ec3
      maintainer: Syno Package Land
      maintainer_url: https://synopkgland.com/
      contact_email: support@synopkgland.com
      support_email: support@synopkgland.com
      homepage: https://synopkgland.com/
      internet: none
      telemetry: none
      description:
        en: "See what is filling your Synology NAS, find duplicates and safely free up space"
        zh-TW: "看清 Synology NAS 的空間被什麼佔用，找出重複內容，安全清出空間"
        zh-CN: "看清 Synology NAS 的空间被什么占用，找出重复内容，安全清出空间"
        ja: "Synology NAS の容量を何が使っているかを把握し、重複を見つけて、安全に空き容量を確保"
        ko: "Synology NAS 공간을 무엇이 차지하는지 확인하고 중복 항목을 찾아 안전하게 공간 확보"
        de: "Sieh, was den Speicher deiner Synology NAS belegt, finde Duplikate und gib sicher Platz frei"
        fr: "Voyez ce qui remplit votre NAS Synology, trouvez les doublons et libérez de l'espace en toute sécurité"
        es: "Descubre qué ocupa el espacio de tu NAS Synology, encuentra duplicados y libéralo de forma segura"
        it: "Scopri cosa occupa lo spazio del tuo NAS Synology, trova i duplicati e liberalo in sicurezza"
      long_description:
        en: "Space cleanup for Synology NAS, for Btrfs and ext4 volumes. Scan a volume or chosen folders to see what really uses space: shared folders, package data, recycle bins, snapshots and the system partition. Reclaim shows how much deleting something would actually free, including space still held by snapshots or shared copies, and tracks how usage changes over time. On Btrfs volumes, the Duplicates page finds identical folders and big duplicate files, keeps one copy of each, explains which copy stays and shows how much space removing the rest frees. Cleanup uses a reviewed plan that is checked again right before it runs, and moves items to the shared folder's Recycle Bin so they can be restored. DSM administrator sign-in is required; approve the system tasks before using features that need them"
        zh-TW: "Synology NAS 的空間整理工具，支援 Btrfs 與 ext4 儲存空間。掃描整個儲存空間或指定資料夾，看清共用資料夾、套件資料、資源回收筒、快照與系統分割區實際佔用多少空間。Reclaim 會算出刪除後真正能釋放的空間，包含仍被快照或共用副本佔住的部分，並追蹤用量變化。在 Btrfs 儲存空間上，「重複內容」頁會找出相同的資料夾與重複的大檔案，每組保留一份並說明保留哪一份，同時算出移除其餘副本可釋放的空間。清理前會先列出計畫供確認，執行前再重新檢查一次，並把項目移到共用資料夾的資源回收筒，需要時可以還原。需以 DSM 管理員登入；使用需要系統工作的功能前，須先核准系統工作"
        zh-CN: "Synology NAS 的空间整理工具，支持 Btrfs 与 ext4 存储空间。扫描整个存储空间或指定文件夹，看清共享文件夹、套件数据、回收站、快照与系统分区实际占用多少空间。Reclaim 会算出删除后真正能释放的空间，包含仍被快照或共享副本占用的部分，并追踪用量变化。在 Btrfs 存储空间上，“重复内容”页会找出相同的文件夹与重复的大文件，每组保留一份并说明保留哪一份，同时算出移除其余副本可释放的空间。清理前会先列出计划供确认，执行前再重新检查一次，并把项目移到共享文件夹的回收站，需要时可以还原。需以 DSM 管理员登录；使用需要系统任务的功能前，须先批准系统任务"
        ja: "Synology NAS の容量整理ツール。Btrfs と ext4 のボリュームに対応。ボリューム全体または指定したフォルダーをスキャンし、共有フォルダー、パッケージデータ、ごみ箱、スナップショット、システムパーティションが実際に使っている容量を確認できます。削除で本当に解放される容量を、スナップショットや共有コピーが保持している分も含めて算出し、使用量の変化も追跡します。Btrfs ボリュームでは「重複」ページが同じフォルダーと重複した大きなファイルを見つけ、それぞれ 1 つのコピーを残してどれを残すかを示し、残りを削除すると解放される容量を表示します。クリーンアップは確認済みの計画に沿って行い、実行直前にもう一度検証したうえで、項目を共有フォルダーのごみ箱へ移動するので復元もできます。DSM 管理者としてのサインインが必要です。システムタスクを必要とする機能を使う前に、タスクを承認してください"
        ko: "Synology NAS용 공간 정리 도구로 Btrfs와 ext4 볼륨을 지원합니다. 볼륨 전체 또는 선택한 폴더를 스캔해 공유 폴더, 패키지 데이터, 휴지통, 스냅샷, 시스템 파티션이 실제로 차지하는 공간을 확인합니다. 스냅샷이나 공유 사본이 아직 붙잡고 있는 공간까지 포함해 삭제 시 실제로 확보되는 공간을 계산하고 사용량 변화도 추적합니다. Btrfs 볼륨에서는 중복 항목 페이지가 동일한 폴더와 중복된 큰 파일을 찾아 각각 사본 하나를 남기고, 어떤 사본을 남기는지 설명하며, 나머지를 제거하면 확보되는 공간을 보여 줍니다. 정리는 검토한 계획대로 진행하며 실행 직전에 다시 확인하고, 항목을 공유 폴더의 휴지통으로 옮기므로 복원할 수 있습니다. DSM 관리자 로그인이 필요하며 시스템 작업이 필요한 기능을 사용하기 전에 해당 작업을 승인해야 해요"
        de: "Speicherbereinigung für Synology NAS mit Btrfs- und ext4-Volumes. Scanne ein Volume oder ausgewählte Ordner und sieh, was wirklich Platz belegt: freigegebene Ordner, Paketdaten, Papierkörbe, Snapshots und die Systempartition. Reclaim zeigt, wie viel das Löschen tatsächlich freigibt, auch Platz, den Snapshots oder geteilte Kopien noch halten, und verfolgt die Belegung über die Zeit. Auf Btrfs-Volumes findet die Seite „Duplikate“ gleiche Ordner und große doppelte Dateien, behält jeweils eine Kopie, erklärt, welche bleibt, und zeigt, wie viel Platz das Entfernen der übrigen freigibt. Bereinigt wird nach einem geprüften Plan, der direkt vor der Ausführung erneut kontrolliert wird; die Elemente werden in den Papierkorb des freigegebenen Ordners verschoben und lassen sich wiederherstellen. Die Anmeldung als DSM-Administrator ist erforderlich; Systemaufgaben müssen vor der Nutzung entsprechender Funktionen freigegeben werden"
        fr: "Nettoyage de l'espace pour NAS Synology, avec volumes Btrfs et ext4. Analysez un volume ou des dossiers choisis pour voir ce qui occupe vraiment l'espace : dossiers partagés, données des paquets, corbeilles, instantanés et partition système. Reclaim indique combien une suppression libérerait réellement, y compris l'espace encore retenu par des instantanés ou des copies partagées, et suit l'évolution de l'utilisation. Sur les volumes Btrfs, la page Doublons trouve les dossiers identiques et les gros fichiers en double, garde une copie de chacun, explique laquelle est gardée et montre l'espace libéré en supprimant les autres. Le nettoyage suit un plan validé, vérifié de nouveau juste avant son exécution, et déplace les éléments dans la corbeille du dossier partagé pour pouvoir les restaurer. Une connexion administrateur DSM est requise ; approuvez les tâches système avant d’utiliser les fonctions qui en dépendent"
        es: "Limpieza de espacio para NAS Synology con volúmenes Btrfs y ext4. Analiza un volumen o carpetas elegidas para ver qué ocupa realmente el espacio: carpetas compartidas, datos de paquetes, papeleras, instantáneas y la partición del sistema. Reclaim muestra cuánto liberaría de verdad una eliminación, incluido el espacio que aún retienen instantáneas o copias compartidas, y sigue la evolución del uso. En volúmenes Btrfs, la página Duplicados encuentra carpetas idénticas y archivos grandes duplicados, conserva una copia de cada uno, explica cuál se queda y muestra cuánto espacio libera quitar el resto. La limpieza sigue un plan revisado que se vuelve a comprobar justo antes de ejecutarse y mueve los elementos a la papelera de reciclaje de la carpeta compartida para poder restaurarlos. Se requiere iniciar sesión como administrador de DSM y aprobar las tareas del sistema antes de usar las funciones que dependen de ellas"
        it: "Pulizia dello spazio per NAS Synology con volumi Btrfs ed ext4. Analizza un volume o le cartelle scelte per vedere cosa occupa davvero spazio: cartelle condivise, dati dei pacchetti, cestini, snapshot e partizione di sistema. Reclaim mostra quanto libererebbe davvero un'eliminazione, compreso lo spazio ancora trattenuto da snapshot o copie condivise, e segue l'andamento dell'utilizzo. Sui volumi Btrfs, la pagina Duplicati trova cartelle identiche e file grandi duplicati, conserva una copia di ciascuno, spiega quale resta e mostra quanto spazio libera rimuovere il resto. La pulizia segue un piano verificato, controllato di nuovo subito prima dell'esecuzione, e sposta gli elementi nel Cestino della cartella condivisa così da poterli ripristinare. È richiesto l’accesso come amministratore DSM; approva le attività di sistema prima di usare le funzioni che ne dipendono"
