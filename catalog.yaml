      description:
        en: Store and manage passwords and secure notes in an encrypted vault
        zh-TW: 在加密保險庫中儲存與管理密碼和安全筆記
      long_description:
        en: Keep passwords, login details and secure notes in an encrypted vault hosted on your
          own server. Vaultwarden is a server compatible with Bitwarden, with a web vault for
          managing your entries. A separate master password unlocks the vault and cannot be
          recovered through DSM. Bitwarden clients need a trusted HTTPS certificate; client
          sign-in is unverified. App sessions are managed separately and data remains in
          Container Manager volumes after uninstall; DSM administrator sign-in and Container
          Manager are required
        zh-TW: 在自己的伺服器上，以加密保險庫保管密碼、登入資料與安全筆記。Vaultwarden 是相容於 Bitwarden
          的伺服器，可透過網頁保險庫管理項目。須以另一組主密碼解鎖保險庫，DSM 無法復原主密碼。Bitwarden 用戶端需要可信的 HTTPS 憑證，用戶端登入尚未驗證。App
          登入狀態另行管理，卸載後資料仍保留於 Container Manager 儲存空間；需 DSM 管理員登入及 Container Manager
      changelog:
        en: >-
          1.37.4-0005


          Rebuild 1.37.4-0005 with published SDK/App/CLI/templates 0.28.0 (executor/v0.27.0), UI 0.14.4 and Go
          1.26.10. User-visible changes come from the SDK: slow NAS devices get a longer startup budget (900
          s) and more tolerant health checks; while the App starts, the gateway shows a self-refreshing
          starting page and DSM status stays running instead of stopping the App; registry checks are skipped
          for images this package already ran, so offline NAS devices no longer show COMPOSE_IMAGE_UNREACHABLE
          on Start or same-image upgrades; `/_spl/ping` answers for external-access diagnostics. Maintainer:
          Syno Package Land. Official images and application sources are unchanged. No NAS tests were
          performed for this release.
        zh-TW: >-
          1.37.4-0005


          1.37.4-0005 使用已發佈 SDK/App/CLI/templates 0.28.0（executor/v0.27.0）、UI 0.14.4 與 Go 1.26.10
          重建。使用者可見的變更來自 SDK：慢速 NAS 有較長的啟動時間預算（900 秒）與較寬鬆的健康檢查；App 啟動期間閘道顯示會自動重新整理的啟動中頁面，DSM 狀態維持執行中，不再停止
          App；本套件曾執行過的映像不再做倉庫檢查，離線 NAS 啟動或同映像升級時不再出現 COMPOSE_IMAGE_UNREACHABLE；新增 `/_spl/ping` 供外部存取診斷。維護者顯示為
