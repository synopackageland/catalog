      description:
        en: Stream your music collection through a web player or compatible apps
        zh-TW: 透過網頁播放器或相容 App 串流播放你的音樂收藏
        zh-CN: 通过网页播放器或兼容 App 串流播放你的音乐收藏
        de: Deine Musiksammlung im Web-Player oder in kompatiblen Apps streamen
        fr: Écoutez votre musique dans un lecteur web ou des Apps compatibles
        ja: 音楽コレクションを Web プレーヤーや対応アプリでストリーミング
        ko: 음악 컬렉션을 웹 플레이어나 호환 앱으로 스트리밍
      long_description:
        en: Browse your music by artist and album, build playlists and listen through
          the web player or compatible Subsonic apps. Authorized users share the
          selected read-only music library, which needs package-account read
          permission. Subsonic clients use a separate Navidrome password; public
          share links remain accessible until removed. App data remains in
          Container Manager volumes after uninstall; DSM sign-in and Container
          Manager are required
        zh-TW: 依演出者與專輯瀏覽音樂、建立播放清單，並透過網頁播放器或相容的 Subsonic App
          收聽。獲授權使用者共用所選唯讀音樂庫，須授予套件帳號讀取權限。Subsonic 用戶端使用另一組 Navidrome
          密碼；公開分享連結在移除前仍可存取。卸載後 App 資料仍保留於 Container Manager 儲存空間；需 DSM 登入及
          Container Manager
        zh-CN: 依演出者与专辑浏览音乐、创建播放清单，并通过网页播放器或兼容的 Subsonic App 收听。获授权用户共用所选唯读音乐库，须授予套件帐号读取权限。Subsonic 用户端使用另一组 Navidrome 密码；公开分享链接在移除前仍可访问。卸载后 App 数据仍保留于 Container Manager 存储空间；需 DSM 登录及 Container Manager
        de: Stöbere in deiner Musik nach Künstler und Album, stell Playlists zusammen und hör über den Web-Player oder kompatible Subsonic-Apps. Berechtigte Nutzer teilen sich die gewählte schreibgeschützte Musikbibliothek, die Lesezugriff für das Paketkonto braucht. Subsonic-Clients nutzen ein eigenes Navidrome-Passwort; öffentliche Freigabelinks bleiben erreichbar, bis sie entfernt werden. App-Daten bleiben nach der Deinstallation in Volumes von Container Manager; DSM-Anmeldung und Container Manager sind erforderlich
        fr: Parcourez votre musique par artiste et par album, créez des playlists et écoutez-la avec le lecteur web ou des Apps Subsonic compatibles. Les utilisateurs autorisés partagent la bibliothèque musicale choisie, en lecture seule, qui doit accorder la lecture au compte du paquet. Les clients Subsonic utilisent un mot de passe Navidrome distinct ; les liens de partage publics restent accessibles jusqu'à leur suppression. Les données de l'App restent dans les volumes de Container Manager après la désinstallation ; connexion DSM et Container Manager requis
        ja: アーティストやアルバムで音楽を探し、プレイリストを作り、Web プレーヤーや対応する Subsonic アプリで聴けます。許可されたユーザーは選択した読み取り専用の音楽ライブラリを共有し、そのライブラリにはパッケージ アカウントの読み取り権限が必要です。Subsonic クライアントは別の Navidrome パスワードを使います。公開共有リンクは削除するまでアクセスできます。アプリのデータはアンインストール後も Container Manager のボリュームに残ります。DSM サインインと Container Manager が必要です
        ko: 아티스트와 앨범별로 음악을 둘러보고, 재생 목록을 만들고, 웹 플레이어나 호환되는 Subsonic 앱으로 들어요. 권한이 있는 사용자는 선택한 읽기 전용 음악 라이브러리를 함께 쓰고, 이 라이브러리에는 패키지 계정의 읽기 권한이 필요해요. Subsonic 클라이언트는 별도의 Navidrome 비밀번호를 쓰고, 공개 공유 링크는 지울 때까지 열려 있어요. 앱 데이터는 제거 후에도 Container Manager 볼륨에 남아요. DSM 로그인과 Container Manager가 필요해요
