      description:
        en: Store and manage passwords and secure notes in an encrypted vault
        zh-TW: 在加密保險庫中儲存與管理密碼和安全筆記
        zh-CN: 在加密保险库中保存与管理密码和安全笔记
        de: Passwörter und sichere Notizen in einem verschlüsselten Tresor speichern und verwalten
        fr: Stockez et gérez mots de passe et notes sécurisées dans un coffre chiffré
        ja: パスワードとセキュア メモを暗号化された保管庫で管理
        ko: 비밀번호와 보안 메모를 암호화된 보관함에 저장하고 관리
        es: Guarda y gestiona contraseñas y notas seguras en una bóveda cifrada
        it: Conserva e gestisci password e note sicure in una cassaforte cifrata
      long_description:
        en: Keep passwords, login details and secure notes in an encrypted vault hosted on your own server.
          Vaultwarden is a server compatible with Bitwarden, with a web vault for managing your
          entries. A separate master password unlocks the vault and cannot be recovered through DSM.
          Bitwarden clients need a trusted HTTPS certificate; client sign-in is unverified. App
          sessions are managed separately and data remains in Container Manager volumes after
          uninstall; DSM administrator sign-in and Container Manager are required
        zh-TW: 在自己的伺服器上，以加密保險庫保管密碼、登入資料與安全筆記。Vaultwarden 是相容於 Bitwarden 的伺服器，可透過網頁保險庫管理項目。須以另一組主密碼解鎖保險庫，DSM
          無法復原主密碼。Bitwarden 用戶端需要可信的 HTTPS 憑證，用戶端登入尚未驗證。App 登入狀態另行管理，卸載後資料仍保留於 Container Manager
          儲存空間；需 DSM 管理員登入及 Container Manager
        zh-CN: 在自己的服务器上，以加密保险库保管密码、登录数据与安全笔记。Vaultwarden 是兼容于 Bitwarden 的服务器，可通过网页保险库管理项目。须以另一组主密码解锁保险库，DSM
          无法复原主密码。Bitwarden 用户端需要可信的 HTTPS 凭证，用户端登录尚未验证。App 登录状态另行管理，卸载后数据仍保留于 Container Manager
          存储空间；需 DSM 管理员登录及 Container Manager
        de: Bewahre Passwörter, Anmeldedaten und sichere Notizen in einem verschlüsselten Tresor auf deinem
          eigenen Server auf. Vaultwarden ist ein mit Bitwarden kompatibler Server mit einem
          Web-Tresor zum Verwalten deiner Einträge. Ein eigenes Master-Passwort entsperrt den Tresor
          und lässt sich nicht über DSM wiederherstellen. Bitwarden-Clients brauchen ein
          vertrauenswürdiges HTTPS-Zertifikat; die Anmeldung in Clients ist ungeprüft. App-Sitzungen
          werden separat verwaltet, und Daten bleiben nach der Deinstallation in Volumes von
          Container Manager; DSM-Anmeldung als Administrator und Container Manager sind erforderlich
        fr: Conservez mots de passe, identifiants et notes sécurisées dans un coffre chiffré hébergé sur
          votre propre serveur. Vaultwarden est un serveur compatible avec Bitwarden, avec un coffre
          web pour gérer vos entrées. Un mot de passe maître distinct déverrouille le coffre et ne
          peut pas être récupéré via DSM. Les clients Bitwarden ont besoin d'un certificat HTTPS de
          confiance ; la connexion des clients n'est pas vérifiée. Les sessions de l'App sont gérées
          séparément et les données restent dans les volumes de Container Manager après la
          désinstallation ; connexion DSM en tant qu'administrateur et Container Manager requis
        ja: パスワード、ログイン情報、セキュア メモを、自分のサーバー上の暗号化された保管庫に保存できます。Vaultwarden は Bitwarden 互換のサーバーで、項目を管理する Web
          保管庫を備えています。保管庫は別のマスター パスワードで解除し、DSM からは復元できません。Bitwarden クライアントには信頼された HTTPS
          証明書が必要で、クライアントからのサインインは未検証です。アプリのセッションは別に管理され、データはアンインストール後も Container Manager
          のボリュームに残ります。DSM の管理者サインインと Container Manager が必要です
        ko: 비밀번호, 로그인 정보, 보안 메모를 내 서버의 암호화된 보관함에 보관해요. Vaultwarden은 Bitwarden과 호환되는 서버로, 항목을 관리하는 웹 보관함이
          있어요. 보관함은 별도의 마스터 비밀번호로 열고, DSM으로는 복구할 수 없어요. Bitwarden 클라이언트에는 신뢰할 수 있는 HTTPS 인증서가 필요하고,
          클라이언트 로그인은 검증되지 않았어요. 앱 세션은 따로 관리되고, 데이터는 제거 후에도 Container Manager 볼륨에 남아요. DSM 관리자 로그인과
          Container Manager가 필요해요
        es: Guarda contraseñas, credenciales y notas seguras en una bóveda cifrada alojada en tu propio
          servidor. Vaultwarden es un servidor compatible con Bitwarden e incluye una bóveda web
          para gestionar tus entradas. Una contraseña maestra independiente desbloquea la bóveda y
          no se puede recuperar mediante DSM. Los clientes Bitwarden requieren un certificado HTTPS
          de confianza; no se ha verificado el inicio de sesión de esos clientes. Las sesiones de la
          aplicación se gestionan por separado y los datos se conservan en los volúmenes de
          Container Manager tras desinstalarla; requiere iniciar sesión como administrador de DSM y
          disponer de Container Manager
        it: Conserva password, credenziali e note sicure in una cassaforte cifrata ospitata sul tuo server.
          Vaultwarden è un server compatibile con Bitwarden e include una cassaforte web per gestire
          le voci. Una password principale separata sblocca la cassaforte e non può essere
          recuperata tramite DSM. I client Bitwarden richiedono un certificato HTTPS attendibile;
          l'accesso da tali client non è stato verificato. Le sessioni dell'app sono gestite
          separatamente e i dati restano nei volumi di Container Manager dopo la disinstallazione;
          richiede l'accesso come amministratore DSM e Container Manager
