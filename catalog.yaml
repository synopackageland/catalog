  - recommended: true
    category: utilities
    order: 30
    publisher: synopackageland
    source:
      kind: github-release
      repo: synopackageland/syno-pkg-gopeed
      release: v0.2.2-0050
      access: private
    metadata:
      contact_email: support@synopkgland.com
      support_email: support@synopkgland.com
      homepage: https://synopkgland.com/
      source_url: https://packages.synopkgland.com/src/synopackageland/syno-pkg-gopeed/
      upstream:
        name: Gopeed
        url: https://github.com/GopeedLab/gopeed
        license: GPL-3.0
      internet: required
      license: GPL-3.0-or-later
      description:
        en: "Download almost anything to your NAS: HTTP/HTTPS links, BitTorrent (.torrent files
          and magnet links), ED2K, and videos from sites supported by yt-dlp, plus addresses
          that extensions add. Each DSM user keeps their own downloads; administrators manage
          access and engine updates. Powered by Gopeed"
        zh-TW: 幾乎什麼都能下載到 NAS：HTTP／HTTPS 連結、BitTorrent（.torrent 檔與磁力連結）、ED2K，以及 yt-dlp
          支援的影音網站，還有擴充套件新增的位址。每位 DSM 使用者各自管理自己的下載；存取權限與引擎更新由管理員管理。Powered by Gopeed
        zh-CN: 几乎什么都能下载到 NAS：HTTP/HTTPS 链接、BitTorrent（.torrent 文件与磁力链接）、ED2K，以及 yt-dlp
          支持的视频网站，还有扩展添加的地址。每位 DSM 用户各自管理自己的下载；访问权限与引擎更新由管理员管理。Powered by Gopeed
        ja: HTTP/HTTPS リンク、BitTorrent（.torrent ファイルとマグネットリンク）、ED2K、yt-dlp
          が対応する動画サイト、さらに拡張機能が追加するアドレスまで、ほぼ何でも NAS にダウンロードできます。DSM
          ユーザーごとに自分のダウンロードを管理し、アクセス権限とエンジンの更新は管理者が管理します。Powered by Gopeed
        ko: HTTP/HTTPS 링크, BitTorrent(.torrent 파일 및 마그넷 링크), ED2K, yt-dlp가 지원하는 동영상 사이트, 확장 프로그램이
          추가하는 주소까지 거의 모든 것을 NAS로 다운로드해요. DSM 사용자마다 자신의 다운로드를 관리하고, 액세스 권한과 엔진 업데이트는 관리자가 맡아요.
          Powered by Gopeed
        de: "Lädt fast alles auf Ihr NAS: HTTP/HTTPS-Links, BitTorrent (.torrent-Dateien und
          Magnet-Links), ED2K und Videos von Websites, die yt-dlp unterstützt, dazu Adressen aus
          Erweiterungen. Jeder DSM-Benutzer verwaltet seine eigenen Downloads; Zugriff und
          Engine-Updates verwaltet der Administrator. Powered by Gopeed"
        fr: "Téléchargez presque tout sur votre NAS : liens HTTP/HTTPS, BitTorrent (fichiers
          .torrent et liens magnet), ED2K et vidéos des sites pris en charge par yt-dlp, ainsi
          que les adresses ajoutées par des extensions. Chaque utilisateur DSM gère ses propres
          téléchargements ; l’administrateur gère l’accès et les mises à jour du moteur. Powered
          by Gopeed"
        es: "Descargue casi cualquier cosa en su NAS: enlaces HTTP/HTTPS, BitTorrent (archivos
          .torrent y enlaces magnet), ED2K y vídeos de los sitios compatibles con yt-dlp, además
          de las direcciones que añaden las extensiones. Cada usuario de DSM gestiona sus
          propias descargas; el administrador gestiona el acceso y las actualizaciones del
          motor. Powered by Gopeed"
        it: "Scarica quasi tutto sul tuo NAS: link HTTP/HTTPS, BitTorrent (file .torrent e link
          magnet), ED2K e video dai siti supportati da yt-dlp, oltre agli indirizzi aggiunti
          dalle estensioni. Ogni utente DSM gestisce i propri download; l’amministratore
          gestisce l’accesso e gli aggiornamenti del motore. Powered by Gopeed"
      long_description:
        en: Download files from HTTP/HTTPS links, torrents, magnet links and ED2K, plus videos
          from sites supported by yt-dlp and sources added by extensions. Pause, resume and
          organize downloads, choose where completed files are saved and view your history. Each
          user has separate downloads; administrators manage access, extensions and engine
          updates. Powered by Gopeed; DSM sign-in is required
        zh-TW: 下載 HTTP／HTTPS 連結、種子、磁力連結與 ED2K 檔案，以及 yt-dlp
          支援網站的影片和擴充套件新增的來源。暫停、繼續與整理下載，選擇完成檔案的儲存位置並查看歷史紀錄。每位使用者各自管理下載，管理員管理存取權限、擴充套件與引擎更新。以
          Gopeed 為核心；需 DSM 登入
      changelog:
        en: >-
          0.2.2-0050

          - Security rebuild with released SDK/App/CLI/templates 0.24.0 and UI
          0.14.0; package-owned Go binaries use go1.26.10.

          - Official App icon with source/license attribution; existing display
          names are preserved.

          - No NAS tests were performed for this release.

          - Administrator reapproval of system access is required after
          upgrading.

          - search-helper requires Go 1.27 and uses patched go1.27.3; the
          official Gopeed binary remains unchanged.
        zh-TW: >-
          0.2.2-0050

          - 使用已發佈 SDK/App/CLI/templates 0.24.0、UI 0.14.0 安全重建；自有 Go binaries 使用
          go1.26.10。

          - 使用官方圖示並保留來源、授權及既有顯示名稱。

          - 本輪未執行 NAS 測試。

          - 升級後須由管理員重新核准系統存取。

          - search-helper 使用已修補 go1.27.3；官方 Gopeed 主程式保持原樣。
      screenshots:
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgGopeed/01-downloads.png
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgGopeed/02-new-download.png
