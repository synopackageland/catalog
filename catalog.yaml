    source:
      kind: github-release
      repo: synopackageland/syno-pkg-gopeed
      release: v0.2.2-0045
      access: private
    metadata:
      contact_email: support@synopkgland.com
      support_email: support@synopkgland.com
      homepage: https://synopkgland.com/
      source_url: https://packages.synopkgland.com/src/synopackageland/syno-pkg-gopeed/
      upstream:
        name: Gopeed
        url: https://github.com/GopeedLab/gopeed
        license: GPL-3.0
      internet: required
      license: GPL-3.0-or-later
      description:
        ko: HTTP/HTTPS 링크, BitTorrent(.torrent 파일 및 마그넷 링크), ED2K, yt-dlp가 지원하는 동영상 사이트, 확장 프로그램이 추가하는 주소까지 거의 모든 것을 NAS로 다운로드해요. DSM 사용자마다 자신의 다운로드를 관리하고, 액세스 권한과 엔진 업데이트는 관리자가 맡아요. Powered by Gopeed.
      long_description:
        en: |-
          Download Hub: per-user downloads powered by the official Gopeed engine, with DSM Application Privileges and administrator-managed core updates.

          Each DSM user has their own downloads, destinations and history; administrators cannot operate other users' tasks. Who can use the app is set in Control Panel > Application Privileges. Completed downloads are saved into the user's chosen shared folder with that user's own DSM permissions.

          Administrators manage download limits, connections, extensions and updates of the official Gopeed core, which are downloaded from the official release and verified before use.

          Licensed under GPL-3.0-or-later; the corresponding source code is available at the source link.
        zh-TW: |-
          下載中心：以官方 Gopeed 引擎為核心、每位使用者各自的下載，透過 DSM 應用程式權限控管，核心更新由管理員管理。

          每位 DSM 使用者有各自的下載、目的地與歷史紀錄，管理員也不能操作別人的工作。可使用本 App 的人員在「控制台 → 權限 → 應用程式權限」設定。下載完成的檔案以該使用者自己的 DSM 權限存到其選擇的共用資料夾。

          下載上限、連線數、擴充套件與官方 Gopeed 核心的更新由管理員管理；更新從官方 Release 下載，並在使用前驗證。

          以 GPL-3.0-or-later 授權；對應原始碼見「原始碼」連結。
      changelog:
        en: |-
          0.2.2-0045
          - Updated SDK/templates to 0.15.2, CLI to 0.15.4 and UI to 0.12.0; custom interface colours follow UI tokens.
          - The private engine API token is regenerated on every start.
          - Executor/lifecycle digests match 0044; upgrading from 0044 needs no new administrator approval. Older builds retain the one-time approval required by 0044.
          - Refresh the whole DSM page after upgrading.
        zh-TW: |-
          0.2.2-0045
          - 升級至 SDK／templates 0.15.2、CLI 0.15.4 與 UI 0.12.0；介面自訂配色沿用 UI token。
          - 引擎私有 API token 每次啟動重新產生。
          - Executor／lifecycle digest 與 0044 相同，從 0044 升級不需重新核准；更舊版本仍須依 0044 要求由管理員核准一次。
          - 升級後請重新整理整個 DSM 頁面。
      screenshots:
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgGopeed/01-downloads.png
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgGopeed/02-new-download.png
