      description:
        en: Use herdr workspaces, coding agents and terminals from your browser or phone
        zh-TW: 透過瀏覽器或手機使用 herdr 工作區、coding agent 與終端機
        zh-CN: 通过浏览器或手机使用 herdr 工作区、coding agent 和终端
        de: herdr-Arbeitsbereiche, Coding-Agenten und Terminals im Browser oder auf dem Smartphone nutzen
        fr: Accédez aux espaces de travail, agents de code et terminaux herdr depuis votre navigateur ou
          téléphone
        ja: ブラウザーやスマートフォンから herdr のワークスペース、コーディングエージェント、ターミナルを利用
        ko: 브라우저나 휴대폰에서 herdr 작업 공간, 코딩 에이전트, 터미널 사용
        es: Usa espacios de trabajo, agentes de código y terminales de herdr desde tu navegador o teléfono
        it: Usa spazi di lavoro, agenti di coding e terminali herdr dal browser o dal telefono
      long_description:
        en: Bring herdr workspaces, agent conversations, prompts, approvals and live terminals to your browser
          or phone. Connect other computers over SSH, or run shells and agents inside the App's own container
          with bundled herdr, Bun, Node.js, common command-line tools and Python. Requires DSM 7.2.1 or
          later, Container Manager and DSM administrator sign-in; all administrators share one Ovis identity.
          The pinned container image is downloaded separately. Data volumes remain after uninstall. Relay
          and Portal are disabled; anonymous usage counts are off by default and can be enabled in Settings
        zh-TW: 在瀏覽器或手機上使用 herdr 工作區、agent 對話、提示、核准與即時終端機。可透過 SSH 連接其他電腦，或在 App 專用容器內執行 shell 與 agent，內附
          herdr、Bun、Node.js、常用命令列工具及 Python。需要 DSM 7.2.1 以上、Container Manager 與 DSM 管理員登入；所有管理員共用同一個 Ovis
          身分。安裝時另行下載固定版本的容器映像。卸載後保留資料 volume。Relay 與 Portal 已停用；匿名使用統計預設關閉，可在設定中開啟
        zh-CN: 在浏览器或手机上使用 herdr 工作区、agent 对话、提示、批准和实时终端。可通过 SSH 连接其他电脑，或在 App 专用容器内运行 shell 和 agent，内含 herdr、Bun、Node.js、常用命令行工具及
          Python。需要 DSM 7.2.1 及以上、Container Manager 和 DSM 管理员登录；所有管理员共用同一个 Ovis 身份。安装时另行下载固定版本的容器镜像。卸载后保留数据卷。Relay
          和 Portal 已禁用；匿名使用统计默认关闭，可在设置中开启
        de: Nutze herdr-Arbeitsbereiche, Agenten-Chats, Eingabeaufforderungen, Freigaben und Live-Terminals
          im Browser oder auf dem Smartphone. Verbinde andere Computer per SSH oder starte Shells und Agenten
          im eigenen App-Container mit herdr, Bun, Node.js, gängigen Kommandozeilenwerkzeugen und Python.
          DSM ab 7.2.1, Container Manager und eine DSM-Administratoranmeldung sind erforderlich; alle Administratoren
          teilen eine Ovis-Identität. Das festgelegte Container-Image wird separat heruntergeladen. Datenvolumes
          bleiben nach der Deinstallation erhalten. Relay und Portal sind deaktiviert; anonyme Nutzungsstatistiken
          sind standardmäßig aus und können in den Einstellungen aktiviert werden
        fr: Retrouvez les espaces herdr, conversations d'agents, invites, approbations et terminaux en direct
          sur navigateur ou téléphone. Connectez d'autres ordinateurs en SSH, ou exécutez shells et agents
          dans le conteneur de l'App avec herdr, Bun, Node.js, les outils de ligne de commande courants
          et Python. DSM 7.2.1 ou ultérieur, Container Manager et une connexion administrateur DSM sont
          requis ; tous les administrateurs partagent une identité Ovis. L'image de conteneur épinglée est
          téléchargée séparément. Les volumes de données restent après la désinstallation. Relay et Portal
          sont désactivés ; les statistiques anonymes sont désactivées par défaut et peuvent être activées
          dans les paramètres
        ja: herdr のワークスペース、エージェントとの会話、プロンプト、承認、ライブターミナルをブラウザーやスマートフォンで利用できます。SSH で別のコンピューターに接続するほか、herdr、Bun、Node.js、一般的なコマンドラインツール、Python
          を備えた専用コンテナー内でシェルやエージェントを実行できます。DSM 7.2.1 以降、Container Manager、DSM 管理者サインインが必要で、すべての管理者が一つの Ovis
          ID を共有します。固定されたコンテナーイメージは別途ダウンロードされます。データボリュームはアンインストール後も残ります。Relay と Portal は無効です。匿名の利用統計は初期状態でオフになっており、設定で有効にできます
        ko: herdr 작업 공간, 에이전트 대화, 프롬프트, 승인, 실시간 터미널을 브라우저나 휴대폰에서 이용하세요. 다른 컴퓨터에 SSH로 연결하거나 herdr, Bun, Node.js,
          일반 명령줄 도구, Python이 포함된 App 전용 컨테이너에서 셸과 에이전트를 실행할 수 있어요. DSM 7.2.1 이상, Container Manager, DSM
          관리자 로그인이 필요하며 모든 관리자가 하나의 Ovis 계정을 공유해요. 고정된 컨테이너 이미지는 별도로 다운로드돼요. 제거 후에도 데이터 볼륨은 남아요. Relay와
          Portal은 꺼져 있어요. 익명 사용 통계는 기본적으로 꺼져 있으며 설정에서 켤 수 있어요
        es: Accede a espacios herdr, conversaciones de agentes, indicaciones, aprobaciones y terminales
          en directo desde el navegador o el teléfono. Conecta otros equipos por SSH o ejecuta shells y
          agentes en el contenedor de la App con herdr, Bun, Node.js, herramientas habituales de línea de
          comandos y Python. Requiere DSM 7.2.1 o posterior, Container Manager e inicio de sesión como administrador
          de DSM; todos los administradores comparten una identidad Ovis. La imagen de contenedor fijada
          se descarga por separado. Los volúmenes de datos se conservan tras desinstalar. Relay y Portal
          están desactivados; las estadísticas anónimas están desactivadas por defecto y se pueden activar
          en los ajustes
        it: Accedi a spazi herdr, conversazioni degli agenti, richieste, approvazioni e terminali in tempo
          reale dal browser o dal telefono. Collega altri computer tramite SSH oppure esegui shell e agenti
          nel contenitore dell'App con herdr, Bun, Node.js, i comuni strumenti da riga di comando e Python.
          Richiede DSM 7.2.1 o successivo, Container Manager e accesso come amministratore DSM; tutti gli
          amministratori condividono un'identità Ovis. L'immagine del contenitore fissata viene scaricata
          separatamente. I volumi dei dati restano dopo la disinstallazione. Relay e Portal sono disabilitati;
          le statistiche anonime sono disattivate per impostazione predefinita e possono essere attivate
          nelle impostazioni
      changelog:
        en: |-
          Use sudo inside the container to install tools; the SDK now handles SSH key permissions

          Choose a NAS subfolder for HOME and workspaces, run as the package account without root capabilities

          Improve page loading reliability when signing in

          0.5.1-0001

          - Upgrade to upstream Ovis 0.5.1 with conversation, terminal and mobile fixes
          - Find SSH PCs under Devices and PCs > Add a connection > SSH
          - Preserve SSH keys, aliases and workspaces while repairing container account and home ownership
          - Rebuild both architectures with SDK 0.53.9 and CLI 0.52.6; retain DSM administrator sign-in

          0.4.22-0006

          - First public DSM release of Ovis 0.4.22 with administrator sign-in, an isolated container runtime, bundled herdr, common shell tools and Python, and persistent workspace data
        zh-TW: |-
          可在容器內使用 sudo 安裝工具；SSH 金鑰權限改由 SDK 處理

          可選擇 NAS 子資料夾儲存 HOME 與工作區，改以套件帳號執行並移除 root capabilities

          改善登入時的頁面載入穩定性

          0.5.1-0001

          - 升級至上游 Ovis 0.5.1，改善對話、終端機與行動裝置體驗
          - 在 Devices and PCs > Add a connection > SSH 尋找 SSH 電腦
          - 修正容器帳號與家目錄擁有者，保留 SSH 金鑰、別名與工作區
          - 使用 SDK 0.53.9 與 CLI 0.52.6 重建兩架構，沿用 DSM 管理員登入

          0.4.22-0006

          - 首次公開發佈 Ovis 0.4.22 DSM 套件，提供管理員登入、獨立容器執行環境、內附 herdr、常用 shell 工具與 Python，並保留工作區資料
        zh-CN: |-
          可在容器内使用 sudo 安装工具；SSH 密钥权限改由 SDK 处理

          可选择 NAS 子文件夹存储 HOME 和工作区，改以套件账户运行并移除 root capabilities

          改善登录时的页面加载稳定性

          0.5.1-0001

          - 升级至上游 Ovis 0.5.1，改善对话、终端与移动设备体验
          - 在 Devices and PCs > Add a connection > SSH 查找 SSH 电脑
          - 修复容器账户与主目录所有者，保留 SSH 密钥、别名和工作区
          - 使用 SDK 0.53.9 与 CLI 0.52.6 重建两种架构，沿用 DSM 管理员登录

          0.4.22-0006

          - 首次公开发布 Ovis 0.4.22 DSM 套件，提供管理员登录、独立容器运行环境、内含 herdr、常用 shell 工具和 Python，并保留工作区数据
        ja: |-
          コンテナー内で sudo を使ってツールをインストール可能に。SSH 鍵の権限は SDK が管理

          HOME とワークスペース用の NAS サブフォルダーを選択し、root 権限なしのパッケージアカウントで実行

          ログイン時のページ読み込みの安定性を改善

          0.5.1-0001

          - 上流 Ovis 0.5.1 に更新し、会話、ターミナル、モバイルの問題を修正
          - SSH 接続先は Devices and PCs > Add a connection > SSH に移動
          - コンテナのアカウントとホームの所有権を修正し、SSH 鍵、別名、ワークスペースを保持
          - SDK 0.53.9 と CLI 0.52.6 で両アーキテクチャを再ビルドし、DSM 管理者ログインを維持

          0.4.22-0006

          - Ovis 0.4.22 の DSM 向け初公開版。管理者サインイン、分離されたコンテナー環境、herdr、一般的なシェルツール、Python、ワークスペースデータの保持に対応
        ko: |-
          컨테이너 안에서 sudo로 도구 설치 가능, SSH 키 권한은 SDK가 관리

          HOME 및 작업 공간에 NAS 하위 폴더를 선택하고 root 권한 없이 패키지 계정으로 실행

          로그인 시 페이지 로딩 안정성 개선

          0.5.1-0001

          - 업스트림 Ovis 0.5.1로 업데이트하여 대화, 터미널 및 모바일 문제 수정
          - Devices and PCs > Add a connection > SSH에서 SSH PC 찾기
          - 컨테이너 계정과 홈 소유권을 수정하면서 SSH 키, 별칭 및 작업 공간 유지
          - SDK 0.53.9와 CLI 0.52.6으로 두 아키텍처를 다시 빌드하고 DSM 관리자 로그인 유지

          0.4.22-0006

          - Ovis 0.4.22의 첫 공개 DSM 릴리스: 관리자 로그인, 격리된 컨테이너 환경, herdr, 일반 셸 도구, Python 및 작업 공간 데이터 유지 지원
        de: |-
          Werkzeuge mit sudo im Container installieren; das SDK verwaltet jetzt die SSH-Schlüsselrechte

          NAS-Unterordner für HOME und Arbeitsbereiche wählen und ohne Root-Berechtigungen als Paketkonto ausführen

          Zuverlässigkeit beim Laden der Seite während der Anmeldung verbessern

          0.5.1-0001

          - Auf Ovis 0.5.1 mit Korrekturen für Gespräche, Terminal und Mobilgeräte aktualisieren
          - SSH-PCs unter Devices and PCs > Add a connection > SSH finden
          - Containerkonto und Home-Eigentümer korrigieren; SSH-Schlüssel, Aliase und Arbeitsbereiche behalten
          - Beide Architekturen mit SDK 0.53.9 und CLI 0.52.6 neu bauen; DSM-Administratoranmeldung beibehalten

          0.4.22-0006

          - Erste öffentliche DSM-Version von Ovis 0.4.22 mit Administratoranmeldung, isolierter Container-Laufzeit, herdr, gängigen Shell-Werkzeugen, Python und dauerhaft gespeicherten Arbeitsbereichsdaten
        fr: |-
          Installer des outils avec sudo dans le conteneur ; le SDK gère désormais les droits des clés SSH

          Choisir un sous-dossier NAS pour HOME et les espaces de travail, avec le compte du paquet sans privilèges root

          Améliorer la fiabilité du chargement des pages lors de la connexion

          0.5.1-0001

          - Passer à Ovis 0.5.1 avec des corrections des conversations, du terminal et de l’affichage mobile
          - Retrouver les PC SSH dans Devices and PCs > Add a connection > SSH
          - Corriger le compte du conteneur et la propriété du dossier personnel en conservant clés SSH, alias et espaces de travail
          - Reconstruire les deux architectures avec SDK 0.53.9 et CLI 0.52.6, avec connexion administrateur DSM

          0.4.22-0006

          - Première version publique DSM d'Ovis 0.4.22 avec connexion administrateur, environnement conteneurisé isolé, herdr, outils shell courants, Python et données d'espace de travail persistantes
        es: |-
          Instalar herramientas con sudo dentro del contenedor; el SDK gestiona ahora los permisos de las claves SSH

          Elegir una subcarpeta del NAS para HOME y los espacios de trabajo, con la cuenta del paquete sin privilegios root

          Mejorar la fiabilidad de carga de las páginas al iniciar sesión

          0.5.1-0001

          - Actualizar a Ovis 0.5.1 con correcciones de conversaciones, terminal y dispositivos móviles
          - Encontrar los PC SSH en Devices and PCs > Add a connection > SSH
          - Corregir la cuenta del contenedor y la propiedad del directorio personal conservando claves SSH, alias y espacios de trabajo
          - Reconstruir ambas arquitecturas con SDK 0.53.9 y CLI 0.52.6 y mantener el acceso de administrador DSM

          0.4.22-0006

          - Primera versión pública para DSM de Ovis 0.4.22 con inicio de sesión de administrador, entorno de contenedor aislado, herdr, herramientas shell habituales, Python y datos de trabajo persistentes
        it: |-
          Installare strumenti con sudo nel container; l’SDK ora gestisce i permessi delle chiavi SSH

          Scegliere una sottocartella NAS per HOME e gli spazi di lavoro, usando l’account del pacchetto senza privilegi root

          Migliorare l’affidabilità del caricamento delle pagine durante l’accesso

          0.5.1-0001

          - Aggiornare a Ovis 0.5.1 con correzioni per conversazioni, terminale e dispositivi mobili
          - Trovare i PC SSH in Devices and PCs > Add a connection > SSH
          - Correggere l’account del contenitore e la proprietà della home mantenendo chiavi SSH, alias e spazi di lavoro
          - Ricostruire entrambe le architetture con SDK 0.53.9 e CLI 0.52.6 mantenendo l’accesso amministratore DSM

          0.4.22-0006

          - Prima versione pubblica DSM di Ovis 0.4.22 con accesso amministratore, ambiente contenitore isolato, herdr, strumenti shell comuni, Python e dati di lavoro persistenti
