          - en:
              - Add this NAS to the Syno Package Land mobile app by scanning the new Connect your
                phone QR code on the Home, or copy the same link
              - LAN addresses come first, followed by connected external addresses; untrusted HTTPS
                LAN addresses include certificate fingerprints, while temporary Cloudflare addresses
                and credentials are omitted
            zh-TW:
