      release: v0.1.1-1598
      access: private
    metadata:
      maintainer: Syno Package Land
      maintainer_url: https://synopkgland.com/
      contact_email: support@synopkgland.com
      support_email: support@synopkgland.com
      homepage: https://synopkgland.com/
      internet: none
      telemetry: none
      description:
        en: Find what really frees space on a Btrfs volume, and free it safely
        zh-TW: 找出 Btrfs 儲存空間的可回收項目，並安全釋放空間
        zh-CN: 找出 Btrfs 存储空间的可回收项目，并安全释放空间
        de: Finde, was auf einem Btrfs-Volume wirklich Platz freigibt, und gib ihn sicher frei
        fr: Trouvez ce qui libère vraiment de l'espace sur un volume Btrfs, et libérez-le en toute sécurité
        ja: Btrfs ボリュームで本当に空き容量を増やせるものを見つけ、安全に解放
        ko: Btrfs 볼륨에서 실제로 공간을 확보할 수 있는 항목을 찾아 안전하게 정리
      long_description:
        en: Find what really frees space on a Btrfs volume, and free it safely
        zh-TW: 找出 Btrfs 儲存空間的可回收項目，並安全釋放空間
        zh-CN: 找出 Btrfs 存储空间的可回收项目，并安全释放空间
        de: Finde, was auf einem Btrfs-Volume wirklich Platz freigibt, und gib ihn sicher frei
        fr: Trouvez ce qui libère vraiment de l'espace sur un volume Btrfs, et libérez-le en toute sécurité
        ja: Btrfs ボリュームで本当に空き容量を増やせるものを見つけ、安全に解放
        ko: Btrfs 볼륨에서 실제로 공간을 확보할 수 있는 항목을 찾아 안전하게 정리
      changelog:
        en: |-
          - Hover, focus or tap a chart part or legend row to read its name, size, share of used space and share of the volume
          - Legend rows show percentages; tiny parts stay visible, and the Packages tab is a donut too
          - Suggested cleanup rows have a type icon, one short line and one height, with the package explanation shown once
          - Reuse build 1597 native binaries unchanged on all three architectures
        zh-TW: |-
          - 移到、聚焦或點按圖表區段或圖例列，即可看到名稱、大小、占已使用空間與占儲存空間的比例
          - 圖例顯示百分比；極小項目保持可見，「套件」分頁也改為甜甜圈圖
          - 「建議處理」每列有類型圖示、一行簡短說明且高度一致，套件說明只出現一次
          - 三架構原生 binaries 沿用 1597，掃描與清理行為不變
        zh-CN: |-
          - 移到、聚焦或点按图表区段或图例行，即可看到名称、大小、占已用空间与占存储空间的比例
          - 图例显示百分比；极小项目保持可见，“套件”标签页也改为环形图
          - “建议处理”每行有类型图标、一行简短说明且高度一致，套件说明只出现一次
          - 三架构原生 binaries 沿用 1597，扫描与清理行为不变
        de: |-
          - Diagrammteil oder Legendenzeile zeigen, fokussieren oder antippen, um Name, Größe, Anteil am belegten Speicher und am Volume zu sehen
          - Die Legende zeigt Prozentwerte; sehr kleine Teile bleiben sichtbar, und auch der Tab Pakete ist ein Ringdiagramm
          - Bereinigungsvorschläge haben ein Typsymbol, eine kurze Zeile und eine einheitliche Höhe; der Pakethinweis steht nur einmal
          - Unveränderte native Binärdateien aus Build 1597 für alle drei Architekturen
        fr: |-
          - Survolez, sélectionnez ou touchez une partie du graphique ou une ligne de légende pour voir son nom, sa taille, sa part de l’espace utilisé et du volume
          - La légende affiche les pourcentages ; les très petites parts restent visibles et l’onglet Paquets est aussi un graphique en anneau
          - Les suggestions de nettoyage ont une icône de type, une seule ligne courte et une hauteur uniforme ; l’explication des paquets n’apparaît qu’une fois
          - Réutilisation des binaires natifs inchangés de la version 1597 pour les trois architectures
        ja: |-
          - グラフの区分や凡例の行にポインター、フォーカス、タップで、名前、サイズ、使用済み容量とボリュームに占める割合を表示
          - 凡例に割合を表示し、ごく小さい項目も見えるように。パッケージタブもドーナツグラフに
          - 推奨クリーンアップの各行に種類アイコンと短い 1 行を表示して高さを統一し、パッケージの説明は 1 回だけ表示
          - 3 アーキテクチャすべてでビルド 1597 のネイティブバイナリを変更せず再利用
        ko: |-
          - 차트 구간이나 범례 행을 가리키거나 포커스하거나 탭하면 이름, 크기, 사용 중인 공간과 볼륨에서 차지하는 비율이 표시돼요
          - 범례에 비율을 표시하고 아주 작은 항목도 보이게 했으며, 패키지 탭도 도넛 차트로 바꿨어요
          - 정리 제안의 각 행에 유형 아이콘과 짧은 한 줄을 표시해 높이를 맞추고, 패키지 설명은 한 번만 보여 줘요
          - 세 아키텍처 모두 빌드 1597의 네이티브 바이너리를 변경 없이 재사용
      screenshots:
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoReclaim/01-overview-1598.png
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoReclaim/02-explore-1597.png
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoReclaim/03-packages-1597.png
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoReclaim/04-settings-1597.png
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoReclaim/05-snapshots-1597.png
