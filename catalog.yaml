  - category: utilities
    order: 20
    publisher: synopackageland
    source:
      kind: github-release
      repo: synopackageland/syno-pkg-connect
      release: v0.1.0-0053
      access: private
    metadata:
      contact_email: support@synopkgland.com
      support_email: support@synopkgland.com
      homepage: https://synopkgland.com/
      license: MIT. Bundled Go and npm dependencies keep their own licenses; the full
        notices ship in the package's LICENSES/ folder. The cloudflared, Tailscale and
        NetBird clients are downloaded from their vendors under their own licenses.
        Source code is not public at this time.
      description:
        ko: 라우터 포트를 열지 않고도 외부에서 NAS에 접속해요. Cloudflare Tunnel, Tailscale, NetBird, IPv6 직접 연결을 한 화면에서 켜고 끌 수 있어요.
      long_description:
        en: |-
          Reach your NAS remotely without opening router ports. Connect lists every connection method on one page; turn Cloudflare Tunnel, Tailscale, NetBird or IPv6 direct access on or off independently, or disable them all.

          Only DSM administrators can open the app or call its API. Everything runs as the package account; no root helper, Node.js or shared service is installed.

          Cloudflare Tunnel, Tailscale and NetBird use their official, unmodified clients, downloaded from the vendors and verified before use. Cloudflare publishes only the DSM web page; NetBird access is controlled by your management server's policy.

          Development preview: Connect does not create cloud accounts or resources, and end-to-end external connectivity of each method has not been verified on every network.
        zh-TW: |-
          不必在路由器開放連接埠，也能從外部連回 NAS。Connect 在同一頁列出所有連線方式；Cloudflare Tunnel、Tailscale、NetBird 與 IPv6 直連可以各自啟用或停用，也可以全部停用。

          只有 DSM 管理員能開啟本 App 或呼叫其 API。所有程式都以套件帳號執行，不安裝 root helper、Node.js 或全機共用服務。

          Cloudflare Tunnel、Tailscale 與 NetBird 使用未經修改的官方用戶端，從原廠下載並在使用前驗證。Cloudflare 只公開 DSM 網頁；NetBird 的存取範圍由您的管理伺服器政策控制。

          開發預覽版：Connect 不會建立雲端帳號或資源，各連線方式的外部端到端連線尚未在所有網路環境驗證。
      changelog:
        en: |-
          0.1.0-0053
          - Buttons, dialogs, scrollbars and corners follow DSM: page and form actions are pill-shaped buttons, toolbar buttons are grey, and dialogs size to their content.
          - Each page spaces its sections like DSM.
          - Stopping a connection uses the same button as the actions under it.
          - Upgrading from 0.1.0-0052 needs no administrator approval.
        zh-TW: |-
          0.1.0-0053
          - 按鈕、對話框、捲軸與圓角對齊 DSM：頁面與表單動作改為圓角膠囊按鈕，工具列按鈕為灰色，對話框依內容調整寬度。
          - 各頁區塊間距與 DSM 一致。
          - 停用連線的按鈕與下方動作按鈕樣式一致。
          - 從 0.1.0-0052 升級不需要管理員核准。
