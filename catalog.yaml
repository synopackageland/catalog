      internet: required
      upstream:
        name: Vaultwarden
        url: https://github.com/dani-garcia/vaultwarden
        license: AGPL-3.0-only
      description:
        en: Vaultwarden Web Vault with native DSM administrator OIDC sign-in. A separate
          master password unlocks encrypted data.
        zh-TW: Vaultwarden Web Vault，支援 DSM 管理員 OIDC 登入；另以主密碼解鎖加密資料。
      long_description:
        en: >-
          This entry is limited to DSM administrators. Open it from the DSM main
          menu through native OIDC, then create or enter the Vaultwarden master
          password. DSM SSO cannot decrypt or unlock a vault and cannot recover
          a lost master password.


          In the installation wizard, enter the required Public HTTPS origin,
          including port 29443, for the hostname used to open DSM. Use a root
          HTTPS origin without a path, query or fragment. The hostname, gateway
          port and Vaultwarden DOMAIN must agree. Retained configuration can be
          reused on upgrade or keep-data reinstall.


          Official Bitwarden clients require a trusted HTTPS certificate
          matching that hostname. Accepting a browser certificate warning does
          not establish client trust. The package does not install certificates
          or change DSM proxy settings.


          Vaultwarden owns its App sessions, API keys and offline vaults. DSM
          logout or access changes do not revoke them immediately; deleting a
          DSM account does not automatically delete its Vaultwarden account. The
          upstream /admin interface remains disabled without an ADMIN_TOKEN.


          Requires DSM 7.2.1 or later, x86_64 and Container Manager. Built with
          published CLI/templates/SDK/App 0.22.0, executor/v0.20.0 and template
          UI 0.12.5; official upstream images and UI remain unchanged.


          Data retention: Container Manager named volumes survive uninstall even
          when delete-data is selected. Back up App data and manage retained
          volumes separately.


          Preview; not recommended. Corresponding source and integration
          documentation are available from the linked release tag.
        zh-TW: >-
          僅限 DSM 管理員。安裝精靈必須填寫用來開啟 DSM 的主機名稱所對應的 Public HTTPS origin，包含 port
          29443，不含路徑、query 或 fragment；主機名稱、gateway port 與 Vaultwarden DOMAIN
          必須一致。從 DSM 主選單透過 OIDC 登入後，仍須建立或輸入 Vaultwarden 主密碼；DSM SSO
          無法解密保險庫，也無法復原遺失的主密碼。升級或保留資料重新安裝可沿用設定。官方 Bitwarden 客戶端需要名稱相符的可信 HTTPS
          憑證；瀏覽器接受憑證警告不代表客戶端信任，官方客戶端登入尚未驗證。DSM 登出或權限變更不會即時撤銷 App session、API key
