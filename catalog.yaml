        zh-TW: 建立個人的有聲書與 Podcast 媒體庫，在瀏覽器中瀏覽收藏、收聽節目並記錄播放進度。不支援下載 Podcast 至所選的唯讀媒體資料夾，手機／TV
          用戶端尚未驗證。資料夾須授予套件帳號讀取權限，卸載後 App 資料仍會保留。需 DSM 管理員登入及 Container Manager
        zh-CN: 创建个人的有声书与 Podcast 媒体库，在浏览器中浏览收藏、收听节目并记录播放进度。不支持下载 Podcast 至所选的唯读媒体文件夹，手机／TV
          用户端尚未验证。文件夹须授予套件帐号读取权限，卸载后 App 数据仍会保留。需 DSM 管理员登录及 Container Manager
        de: Baue eine eigene Bibliothek aus Hörbüchern und Podcasts auf, stöbere in deiner Sammlung und hör
          im Browser, während dein Fortschritt gespeichert wird. Podcast-Downloads in den gewählten
          schreibgeschützten Medienordner werden nicht unterstützt, mobile und TV-Clients sind
          ungeprüft. Der Ordner braucht Lesezugriff für das Paketkonto; App-Daten bleiben nach der
          Deinstallation erhalten. DSM-Anmeldung als Administrator und Container Manager sind
          erforderlich
        fr: Constituez votre bibliothèque de livres audio et de podcasts, parcourez votre collection et
          écoutez-la dans votre navigateur en gardant votre progression. Le téléchargement de
          podcasts dans le dossier multimédia choisi, en lecture seule, n'est pas pris en charge, et
          les clients mobiles et TV ne sont pas vérifiés. Le dossier doit accorder la lecture au
          compte du paquet ; les données de l'App restent après la désinstallation. Connexion DSM en
          tant qu'administrateur et Container Manager requis
        ja: オーディオブックとポッドキャストの自分だけのライブラリを作り、コレクションを見ながらブラウザーで聴けます。再生位置も記録されます。選択した読み取り専用のメディア
          フォルダーへのポッドキャストのダウンロードには対応しておらず、モバイルや TV のクライアントは未検証です。フォルダーにはパッケージ
          アカウントの読み取り権限が必要です。アプリのデータはアンインストール後も残ります。DSM の管理者サインインと Container Manager が必要です
        ko: 오디오북과 팟캐스트로 나만의 서재를 만들고, 컬렉션을 둘러보며 브라우저에서 들을 수 있어요. 듣던 위치도 기억해요. 선택한 읽기 전용 미디어 폴더로 팟캐스트를 내려받는
          기능은 지원하지 않고, 모바일·TV 클라이언트는 검증되지 않았어요. 폴더에는 패키지 계정의 읽기 권한이 필요하고, 앱 데이터는 제거 후에도 남아요. DSM 관리자
          로그인과 Container Manager가 필요해요
        es: Crea una biblioteca personal de audiolibros y pódcast, explora tu colección y escucha en el
          navegador mientras guardas tu progreso. No se admite descargar pódcast en la carpeta
          multimedia seleccionada, que es de solo lectura; los clientes móviles y de TV no se han
          verificado. La cuenta del paquete necesita permiso de lectura en la carpeta. Los datos de
          la aplicación se conservan tras desinstalarla. Requiere iniciar sesión como administrador
          de DSM y disponer de Container Manager
        it: Crea una raccolta personale di audiolibri e podcast, esplora la libreria e ascolta nel browser
          mantenendo i tuoi progressi. Il download di podcast nella cartella multimediale
          selezionata, accessibile in sola lettura, non è supportato; i client mobili e TV non sono
          stati verificati. L'account del pacchetto deve avere il permesso di lettura sulla
          cartella. I dati dell'app restano dopo la disinstallazione. Richiede l'accesso come
          amministratore DSM e Container Manager
      screenshots:
