              - 優先列出區域網路位址，再列出已連線的外部位址；不受信任的 HTTPS 區域網路位址附帶憑證指紋，並排除 Cloudflare 臨時位址與登入憑證
            zh-CN:
              - 在首页打开新的“连接手机”，使用 Syno Package Land 移动应用扫描二维码，即可添加这台 NAS，也可复制相同链接
              - 优先列出局域网地址，再列出已连接的外部地址；不受信任的 HTTPS 局域网地址附带证书指纹，并排除 Cloudflare 临时地址与登录凭据
