            ko:
              - "Ovis 0.4.22의 첫 공개 DSM 릴리스: 관리자 로그인, 격리된 컨테이너 환경, herdr, 일반 셸 도구, Python 및 작업 공간 데이터
                유지 지원"
            es:
              - Primera versión pública para DSM de Ovis 0.4.22 con inicio de sesión de
                administrador, entorno de contenedor aislado, herdr, herramientas shell habituales,
                Python y datos de trabajo persistentes
            it:
              - Prima versione pubblica DSM di Ovis 0.4.22 con accesso amministratore, ambiente
                contenitore isolato, herdr, strumenti shell comuni, Python e dati di lavoro
                persistenti
