          - 狀態由套件中心提供；檔案、儲存、工作、使用者與設定使用原生 OpenList UI 管理。

          - 保留 DSM 管理員登入、升級時的既有管理員綁定，以及 daemon 故障重啟。

          - 使用已發佈 SDK/App/CLI/templates 0.27.0 建置；官方 binary 與原生 UI 不變，不需要 Container Manager。
