      description:
        en: "Download almost anything to your NAS: HTTP/HTTPS links, BitTorrent
          (.torrent files and magnet links), ED2K, and videos from sites
          supported by yt-dlp, plus addresses that extensions add. Each DSM user
          keeps their own downloads; administrators manage access and engine
          updates. Powered by Gopeed"
        zh-TW: 幾乎什麼都能下載到 NAS：HTTP／HTTPS 連結、BitTorrent（.torrent 檔與磁力連結）、ED2K，以及 yt-dlp
          支援的影音網站，還有擴充套件新增的位址。每位 DSM 使用者各自管理自己的下載；存取權限與引擎更新由管理員管理。Powered by
          Gopeed
        zh-CN: 几乎什么都能下载到 NAS：HTTP/HTTPS 链接、BitTorrent（.torrent 文件与磁力链接）、ED2K，以及 yt-dlp
          支持的视频网站，还有扩展添加的地址。每位 DSM 用户各自管理自己的下载；访问权限与引擎更新由管理员管理。Powered by Gopeed
        ja: HTTP/HTTPS リンク、BitTorrent（.torrent ファイルとマグネットリンク）、ED2K、yt-dlp
          が対応する動画サイト、さらに拡張機能が追加するアドレスまで、ほぼ何でも NAS にダウンロードできます。DSM
          ユーザーごとに自分のダウンロードを管理し、アクセス権限とエンジンの更新は管理者が管理します。Powered by Gopeed
        ko: HTTP/HTTPS 링크, BitTorrent(.torrent 파일 및 마그넷 링크), ED2K, yt-dlp가 지원하는 동영상 사이트,
          확장 프로그램이 추가하는 주소까지 거의 모든 것을 NAS로 다운로드해요. DSM 사용자마다 자신의 다운로드를 관리하고, 액세스
          권한과 엔진 업데이트는 관리자가 맡아요. Powered by Gopeed
        de: "Lädt fast alles auf Ihr NAS: HTTP/HTTPS-Links, BitTorrent (.torrent-Dateien
          und Magnet-Links), ED2K und Videos von Websites, die yt-dlp
          unterstützt, dazu Adressen aus Erweiterungen. Jeder DSM-Benutzer
          verwaltet seine eigenen Downloads; Zugriff und Engine-Updates
          verwaltet der Administrator. Powered by Gopeed"
        fr: "Téléchargez presque tout sur votre NAS : liens HTTP/HTTPS, BitTorrent
          (fichiers .torrent et liens magnet), ED2K et vidéos des sites pris en
          charge par yt-dlp, ainsi que les adresses ajoutées par des extensions.
          Chaque utilisateur DSM gère ses propres téléchargements ;
          l’administrateur gère l’accès et les mises à jour du moteur. Powered
          by Gopeed"
        es: "Descargue casi cualquier cosa en su NAS: enlaces HTTP/HTTPS, BitTorrent
          (archivos .torrent y enlaces magnet), ED2K y vídeos de los sitios
          compatibles con yt-dlp, además de las direcciones que añaden las
          extensiones. Cada usuario de DSM gestiona sus propias descargas; el
          administrador gestiona el acceso y las actualizaciones del motor.
          Powered by Gopeed"
        it: "Scarica quasi tutto sul tuo NAS: link HTTP/HTTPS, BitTorrent (file .torrent
          e link magnet), ED2K e video dai siti supportati da yt-dlp, oltre agli
          indirizzi aggiunti dalle estensioni. Ogni utente DSM gestisce i propri
          download; l’amministratore gestisce l’accesso e gli aggiornamenti del
          motore. Powered by Gopeed"
      long_description:
        en: Download files from HTTP/HTTPS links, torrents, magnet links and ED2K, plus
          videos from sites supported by yt-dlp and sources added by extensions.
          Pause, resume and organize downloads, choose where completed files are
          saved and view your history. Each user has separate downloads;
          administrators manage access, extensions and engine updates. Powered
          by Gopeed; DSM sign-in is required
        zh-TW: 下載 HTTP／HTTPS 連結、種子、磁力連結與 ED2K 檔案，以及 yt-dlp
          支援網站的影片和擴充套件新增的來源。暫停、繼續與整理下載，選擇完成檔案的儲存位置並查看歷史紀錄。每位使用者各自管理下載，管理員管理存取權限、擴充套件與引擎更新。以
          Gopeed 為核心；需 DSM 登入
        zh-CN: 下载 HTTP／HTTPS 链接、种子、磁力链接与 ED2K 文件，以及 yt-dlp 支持网站的视频和扩展添加的来源。暂停、继续与整理下载，选择完成文件的保存位置并查看历史记录。每位用户各自管理下载，管理员管理访问权限、扩展与引擎更新。以 Gopeed 为内核；需 DSM 登录
        de: Lade Dateien über HTTP/HTTPS-Links, Torrents, Magnet-Links und ED2K herunter, dazu Videos von Seiten, die yt-dlp unterstützt, und aus Quellen von Erweiterungen. Pausiere, setze fort und ordne Downloads, wähle, wo fertige Dateien gespeichert werden, und sieh dir deinen Verlauf an. Jeder Nutzer hat eigene Downloads; Administratoren verwalten Zugriff, Erweiterungen und Engine-Updates. Basiert auf Gopeed; DSM-Anmeldung ist erforderlich
        fr: Téléchargez des fichiers depuis des liens HTTP/HTTPS, des torrents, des liens magnet et ED2K, ainsi que des vidéos des sites pris en charge par yt-dlp et des sources ajoutées par des extensions. Mettez en pause, reprenez et organisez vos téléchargements, choisissez où enregistrer les fichiers terminés et consultez votre historique. Chaque utilisateur a ses propres téléchargements ; les administrateurs gèrent l'accès, les extensions et les mises à jour du moteur. Basé sur Gopeed ; connexion DSM requise
        ja: HTTP/HTTPS リンク、Torrent、マグネット リンク、ED2K のファイルに加え、yt-dlp 対応サイトの動画や拡張機能で追加したソースからダウンロードできます。ダウンロードの一時停止・再開・整理、完了したファイルの保存先の選択、履歴の確認ができます。ダウンロードはユーザーごとに分かれ、アクセス、拡張機能、エンジンの更新は管理者が管理します。Gopeed を利用しています。DSM サインインが必要です
        ko: HTTP/HTTPS 링크, 토렌트, 마그넷 링크, ED2K 파일은 물론 yt-dlp가 지원하는 사이트의 동영상과 확장 기능으로 추가한 소스에서도 내려받아요. 다운로드를 일시 정지, 재개, 정리하고, 완료된 파일을 저장할 위치를 고르고, 기록을 볼 수 있어요. 다운로드는 사용자마다 따로이고, 접근 권한과 확장 기능, 엔진 업데이트는 관리자가 관리해요. Gopeed 기반이며 DSM 로그인이 필요해요
      changelog:
        en: |-
          0.2.2-0071

          Use the verified official downloader for yt-dlp updates, avoiding the old updater’s anonymous GitHub API limit; keep the previous version on failure. Show precise tool errors. Fix Kickass “just now” dates and distinguish connection resets/TLS errors from browser challenges. Extend large Release asset uploads to 20 minutes
        zh-TW: |-
          0.2.2-0071

          yt-dlp 更新改用官方下載與驗證流程，避免舊版更新器的匿名 GitHub API 限流，失敗時保留原版並顯示具體錯誤。修正 Kickass「just now」日期解析；連線重設與 TLS 錯誤不再誤報需要瀏覽器，只有真正的挑戰頁才提供輔助。大型 Release 檔案上傳逾時延長至 20 分鐘
        zh-CN: |-
          0.2.2-0071

          yt-dlp 更新使用官方验证下载，避免旧版更新器的匿名 GitHub API 限流，失败时保留原版并显示具体错误。修复 Kickass「just now」日期解析；连接重置与 TLS 错误不再误报需要浏览器，仅真正的挑战页提供辅助。大型 Release 文件上传超时延长至 20 分钟
        de: |-
          0.2.2-0071

          yt-dlp nutzt den geprüften offiziellen Download statt des alten anonymen Updaters; bei Fehlern bleibt die vorherige Version erhalten. Präzise Werkzeugfehler und Kickass-Zeitangaben „just now“. Verbindungsresets und TLS-Fehler werden von Browser-Challenges getrennt. Upload-Zeitlimit für große Release-Dateien: 20 Minuten
        fr: |-
          0.2.2-0071

          yt-dlp utilise le téléchargement officiel vérifié au lieu de l’ancien programme de mise à jour anonyme ; la version précédente est conservée en cas d’échec. Erreurs précises et dates Kickass « just now » corrigées. Les réinitialisations et erreurs TLS sont distinguées des pages de vérification. Délai des gros fichiers Release : 20 minutes
        ja: |-
          0.2.2-0071

          yt-dlp の更新を公式の検証済みダウンロードに変更し、旧版の匿名 GitHub API 制限を回避。失敗時は旧版を保持し、具体的なエラーを表示します。Kickass の「just now」を解析し、接続リセットや TLS エラーをブラウザー認証と区別します。大きな Release ファイルのアップロード制限を20分に延長
        ko: |-
          0.2.2-0071

          yt-dlp 업데이트에 공식 검증 다운로드를 사용해 이전 프로그램의 익명 GitHub API 제한을 피해요. 실패하면 이전 버전을 유지하고 구체적인 오류를 보여 줘요. Kickass의 “just now” 날짜를 처리하고 연결 재설정과 TLS 오류를 브라우저 인증과 구분해요. 큰 Release 파일 업로드 제한을 20분으로 늘렸어요
