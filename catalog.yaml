      description:
        en: "Download almost anything to your NAS: HTTP/HTTPS links, BitTorrent (.torrent files and magnet
          links), ED2K, and videos from sites supported by yt-dlp, plus addresses that extensions
          add. Each DSM user keeps their own downloads; administrators manage access and engine
          updates. Powered by Gopeed"
        zh-TW: 幾乎什麼都能下載到 NAS：HTTP／HTTPS 連結、BitTorrent（.torrent 檔與磁力連結）、ED2K，以及 yt-dlp 支援的影音網站，還有擴充套件新增的位址。每位
          DSM 使用者各自管理自己的下載；存取權限與引擎更新由管理員管理。Powered by Gopeed
        zh-CN: 几乎什么都能下载到 NAS：HTTP/HTTPS 链接、BitTorrent（.torrent 文件与磁力链接）、ED2K，以及 yt-dlp 支持的视频网站，还有扩展添加的地址。每位
          DSM 用户各自管理自己的下载；访问权限与引擎更新由管理员管理。Powered by Gopeed
        ja: HTTP/HTTPS リンク、BitTorrent（.torrent ファイルとマグネットリンク）、ED2K、yt-dlp
          が対応する動画サイト、さらに拡張機能が追加するアドレスまで、ほぼ何でも NAS にダウンロードできます。DSM
          ユーザーごとに自分のダウンロードを管理し、アクセス権限とエンジンの更新は管理者が管理します。Powered by Gopeed
        ko: HTTP/HTTPS 링크, BitTorrent(.torrent 파일 및 마그넷 링크), ED2K, yt-dlp가 지원하는 동영상 사이트, 확장 프로그램이 추가하는 주소까지
          거의 모든 것을 NAS로 다운로드해요. DSM 사용자마다 자신의 다운로드를 관리하고, 액세스 권한과 엔진 업데이트는 관리자가 맡아요. Powered by
          Gopeed
        de: "Lädt fast alles auf Ihr NAS: HTTP/HTTPS-Links, BitTorrent (.torrent-Dateien und Magnet-Links),
          ED2K und Videos von Websites, die yt-dlp unterstützt, dazu Adressen aus Erweiterungen.
          Jeder DSM-Benutzer verwaltet seine eigenen Downloads; Zugriff und Engine-Updates verwaltet
          der Administrator. Powered by Gopeed"
        fr: "Téléchargez presque tout sur votre NAS : liens HTTP/HTTPS, BitTorrent (fichiers .torrent et
          liens magnet), ED2K et vidéos des sites pris en charge par yt-dlp, ainsi que les adresses
          ajoutées par des extensions. Chaque utilisateur DSM gère ses propres téléchargements ;
          l’administrateur gère l’accès et les mises à jour du moteur. Powered by Gopeed"
        es: "Descargue casi cualquier cosa en su NAS: enlaces HTTP/HTTPS, BitTorrent (archivos .torrent y
          enlaces magnet), ED2K y vídeos de los sitios compatibles con yt-dlp, además de las
          direcciones que añaden las extensiones. Cada usuario de DSM gestiona sus propias
          descargas; el administrador gestiona el acceso y las actualizaciones del motor. Powered by
          Gopeed"
        it: "Scarica quasi tutto sul tuo NAS: link HTTP/HTTPS, BitTorrent (file .torrent e link magnet),
          ED2K e video dai siti supportati da yt-dlp, oltre agli indirizzi aggiunti dalle
          estensioni. Ogni utente DSM gestisce i propri download; l’amministratore gestisce
          l’accesso e gli aggiornamenti del motore. Powered by Gopeed"
      long_description:
        en: Download files from HTTP/HTTPS links, torrents, magnet links and ED2K, plus videos from sites
          supported by yt-dlp and sources added by extensions. Pause, resume and organize downloads,
          choose where completed files are saved and view your history. Each user has separate
          downloads; administrators manage access, extensions and engine updates. Powered by Gopeed;
          DSM sign-in is required
        zh-TW: 下載 HTTP／HTTPS 連結、種子、磁力連結與 ED2K 檔案，以及 yt-dlp
          支援網站的影片和擴充套件新增的來源。暫停、繼續與整理下載，選擇完成檔案的儲存位置並查看歷史紀錄。每位使用者各自管理下載，管理員管理存取權限、擴充套件與引擎更新。以 Gopeed
          為核心；需 DSM 登入
        zh-CN: 下载 HTTP／HTTPS 链接、种子、磁力链接与 ED2K 文件，以及 yt-dlp
          支持网站的视频和扩展添加的来源。暂停、继续与整理下载，选择完成文件的保存位置并查看历史记录。每位用户各自管理下载，管理员管理访问权限、扩展与引擎更新。以 Gopeed 为内核；需
          DSM 登录
        de: Lade Dateien über HTTP/HTTPS-Links, Torrents, Magnet-Links und ED2K herunter, dazu Videos von
          Seiten, die yt-dlp unterstützt, und aus Quellen von Erweiterungen. Pausiere, setze fort
          und ordne Downloads, wähle, wo fertige Dateien gespeichert werden, und sieh dir deinen
          Verlauf an. Jeder Nutzer hat eigene Downloads; Administratoren verwalten Zugriff,
          Erweiterungen und Engine-Updates. Basiert auf Gopeed; DSM-Anmeldung ist erforderlich
        fr: Téléchargez des fichiers depuis des liens HTTP/HTTPS, des torrents, des liens magnet et ED2K,
          ainsi que des vidéos des sites pris en charge par yt-dlp et des sources ajoutées par des
          extensions. Mettez en pause, reprenez et organisez vos téléchargements, choisissez où
          enregistrer les fichiers terminés et consultez votre historique. Chaque utilisateur a ses
          propres téléchargements ; les administrateurs gèrent l'accès, les extensions et les mises
          à jour du moteur. Basé sur Gopeed ; connexion DSM requise
        ja: HTTP/HTTPS リンク、Torrent、マグネット リンク、ED2K のファイルに加え、yt-dlp
          対応サイトの動画や拡張機能で追加したソースからダウンロードできます。ダウンロードの一時停止・再開・整理、完了したファイルの保存先の選択、履歴の確認ができます。ダウンロードはユーザーごとに分かれ、アクセス、拡張機能、エンジンの更新は管理者が管理します。Gopeed
          を利用しています。DSM サインインが必要です
        ko: HTTP/HTTPS 링크, 토렌트, 마그넷 링크, ED2K 파일은 물론 yt-dlp가 지원하는 사이트의 동영상과 확장 기능으로 추가한 소스에서도 내려받아요. 다운로드를 일시
          정지, 재개, 정리하고, 완료된 파일을 저장할 위치를 고르고, 기록을 볼 수 있어요. 다운로드는 사용자마다 따로이고, 접근 권한과 확장 기능, 엔진 업데이트는
          관리자가 관리해요. Gopeed 기반이며 DSM 로그인이 필요해요
        es: Descarga archivos desde enlaces HTTP/HTTPS, torrents, enlaces magnet y ED2K, además de vídeos de
          sitios compatibles con yt-dlp y fuentes añadidas mediante extensiones. Pausa, reanuda y
          organiza las descargas, elige dónde guardar los archivos completados y consulta el
          historial. Cada usuario tiene sus propias descargas; los administradores gestionan el
          acceso, las extensiones y las actualizaciones del motor. Basado en Gopeed; requiere
          iniciar sesión en DSM
        it: Scarica file da collegamenti HTTP/HTTPS, torrent, link magnet ed ED2K, oltre a video da siti
          supportati da yt-dlp e fonti aggiunte tramite estensioni. Metti in pausa, riprendi e
          organizza i download, scegli dove salvare i file completati e consulta la cronologia. Ogni
          utente ha download separati; gli amministratori gestiscono accessi, estensioni e
          aggiornamenti del motore. Basato su Gopeed; richiede l'accesso a DSM
