      description:
        en: Reach the NAS and its Apps from anywhere without opening router ports, with
          DSM sign-in on by default. Connect through a free workers.dev link, your own
          Cloudflare domain, a private network or IPv6 direct access, and choose which
          Apps are reachable
        zh-TW: 不必在路由器開放連接埠，就能從任何地方連回 NAS 與其 App，預設需 DSM 登入。可透過免費 workers.dev 連結、自有
