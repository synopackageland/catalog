      description:
        en: A browser console for coding agents such as Codex and Claude Code. Install the agents you want
          yourself
        zh-TW: Codex、Claude Code 等 coding agent 的瀏覽器控制台。請自行安裝所需的 agent
        zh-CN: Codex、Claude Code 等 coding agent 的浏览器控制台。请自行安装所需的 agent
        ja: Codex や Claude Code などのコーディングエージェント用ブラウザーコンソール。エージェントはご自身でインストールしてください
        ko: Codex, Claude Code 등 코딩 에이전트를 위한 브라우저 콘솔입니다. 원하는 에이전트는 직접 설치하세요
        de: Browser-Konsole für Coding-Agenten wie Codex und Claude Code. Die gewünschten Agenten installieren
          Sie selbst
        fr: Console web pour les agents de code comme Codex et Claude Code. Installez vous-même les agents
          de votre choix
        es: Consola web para agentes de código como Codex y Claude Code. Instale usted mismo los agentes
          que desee
        it: Console web per agenti di coding come Codex e Claude Code. Installa tu gli agenti che desideri
      long_description:
        en: 'T3 Code is a browser console for coding agents. Run Codex, Claude Code, Pi, OpenCode and other
          supported agents on your Synology NAS, and work with them from any browser on your network: chat
          with agents, review their changes and use a built-in terminal. No agent is included. Install the
          agents you want from T3 Code''s setup wizard or its terminal, then sign in with your own subscription
          or API key. Agents are kept in the package''s own storage, so you can update them as soon as new
          versions are released. Projects are stored in the shared folder you choose during installation.
          Container Manager is required. Only DSM administrators can open T3 Code, and all administrators
          share one T3 Code instance, including its agent sign-ins. T3 Connect, device pairing and usage
          data are turned off, and T3 Code is updated only through Package Center. To use it outside your
          local network, connect through a VPN'
        zh-TW: T3 Code 是 coding agent 的瀏覽器控制台。可在 Synology NAS 上執行 Codex、Claude Code、Pi、OpenCode 等支援的 agent，並從區域網路中的任何瀏覽器操作：與
          agent 對話、檢視其變更，以及使用內建終端機。套件不含任何 agent。請從 T3 Code 的設定精靈或終端機自行安裝所需的 agent，再以您自己的訂閱或 API 金鑰登入。agent
          存放於套件專屬的儲存空間，新版本推出時即可自行更新。專案存放於安裝時選擇的共用資料夾。需要 Container Manager。僅 DSM 管理員可開啟 T3 Code，所有管理員共用同一個
          T3 Code實例及其 agent 登入。T3 Connect、裝置配對與使用資料皆已關閉，T3 Code 僅透過套件中心更新。若要在區域網路外使用，請透過 VPN 連線。
        zh-CN: T3 Code 是 coding agent 的浏览器控制台。可在 Synology NAS 上运行 Codex、Claude Code、Pi、OpenCode 等支持的 agent，并从局域网中的任何浏览器操作：与
          agent 对话、查看其更改，以及使用内置终端。套件不含任何 agent。请从 T3 Code 的设置向导或终端自行安装所需的 agent，再使用您自己的订阅或 API 密钥登录。agent
          存放在套件专用的存储空间中，新版本发布后即可自行更新。项目存放在安装时选择的共享文件夹中。需要 Container Manager。仅 DSM 管理员可打开 T3 Code，所有管理员共用同一个
          T3 Code实例及其 agent 登录。T3 Connect、设备配对和使用数据均已关闭，T3 Code 仅通过套件中心更新。如需在局域网外使用，请通过 VPN 连接。
        ja: T3 Code はコーディングエージェント用のブラウザーコンソールです。Synology NAS 上でCodex、Claude Code、Pi、OpenCode などの対応エージェントを実行し、ネットワーク内のブラウザーから操作できます。エージェントとの対話、変更内容の確認、内蔵ターミナルの使用が可能です。エージェントは含まれていません。T3
          Code のセットアップウィザードまたはターミナルから必要なエージェントをインストールし、ご自身のサブスクリプションまたは API キーでサインインしてください。エージェントはパッケージ専用のストレージに保存されるため、新しいバージョンがリリースされたらすぐに更新できます。プロジェクトはインストール時に選択した共有フォルダに保存されます。Container
          Manager が必要です。T3 Code を開けるのは DSM 管理者のみで、すべての管理者が1 つの T3 Code インスタンスとそのエージェントのサインインを共有します。T3 Connect、デバイスのペアリング、利用データはオフで、T3
          Code はパッケージセンターからのみ更新されます。ローカルネットワーク外から使用するには VPN で接続してください。
        ko: T3 Code는 코딩 에이전트를 위한 브라우저 콘솔입니다. Synology NAS에서 Codex, Claude Code, Pi, OpenCode 등 지원되는 에이전트를
          실행하고 네트워크의 모든 브라우저에서 사용할 수있습니다. 에이전트와 대화하고, 변경 내용을 검토하고, 내장 터미널을 사용할 수 있습니다.에이전트는 포함되어 있지 않습니다.
          T3 Code의 설정 마법사나 터미널에서 원하는 에이전트를직접 설치한 후 본인의 구독 또는 API 키로 로그인하세요. 에이전트는 패키지 전용 저장공간에 보관되므로 새 버전이
          출시되면 바로 업데이트할 수 있습니다. 프로젝트는 설치 시선택한 공유 폴더에 저장됩니다. Container Manager가 필요합니다. DSM 관리자만 T3 Code를
          열 수 있으며, 모든 관리자가 하나의T3 Code 인스턴스와 에이전트 로그인을 공유합니다. T3 Connect, 장치 페어링, 사용 데이터는꺼져 있으며 T3 Code는
          패키지 센터를 통해서만 업데이트됩니다. 로컬 네트워크 밖에서사용하려면 VPN으로 연결하세요
        de: 'T3 Code ist eine Browser-Konsole für Coding-Agenten. Führen Sie Codex, Claude Code, Pi, OpenCode
          und andere unterstützte Agenten auf Ihrem Synology NAS aus und arbeiten Sie mit ihnen in jedem
          Browser in Ihrem Netzwerk: Chatten Sie mit Agenten, prüfen Sie ihre Änderungen und nutzen Sie
          das integrierte Terminal. Es ist kein Agent enthalten. Installieren Sie die gewünschten Agenten
          über den Einrichtungsassistenten oder das Terminal von T3 Code und melden Sie sich mit Ihrem eigenen
          Abonnement oder API-Schlüssel an. Agenten werden im eigenen Speicher des Pakets abgelegt, sodass
          Sie sie aktualisieren können, sobald neue Versionen erscheinen. Projekte werden im freigegebenen
          Ordner gespeichert, den Sie bei der Installation wählen. Container Manager ist erforderlich. Nur
          DSM-Administratoren können T3 Code öffnen, und alle Administratoren teilen sich eine T3 Code-Instanz
          einschließlich der Agenten-Anmeldungen. T3 Connect, Gerätekopplung und Nutzungsdaten sind deaktiviert,
          und T3 Code wird nur über das Paket-Zentrum aktualisiert. Für die Nutzung außerhalb Ihres lokalen
          Netzwerks verbinden Sie sich über ein VPN'
        fr: 'T3 Code est une console web pour les agents de code. Exécutez Codex, Claude Code, Pi, OpenCode
          et d''autres agents pris en charge sur votre Synology NAS, et utilisez-les depuis n''importe quel
          navigateur de votre réseau : discutez avec les agents, examinez leurs modifications et utilisez
          le terminal intégré. Aucun agent n''est inclus. Installez les agents de votre choix depuis l''assistant
          de configuration ou le terminal de T3 Code, puis connectez-vous avec votre propre abonnement ou
          clé API. Les agents sont conservés dans le stockage propre au paquet ; vous pouvez donc les mettre
          à jour dès la sortie de nouvelles versions. Les projets sont stockés dans le dossier partagé choisi
          lors de l''installation. Container Manager est requis. Seuls les administrateurs DSM peuvent ouvrir
          T3 Code, et tous les administrateurs partagent une même instance de T3 Code, y compris ses connexions
          aux agents. T3 Connect, l''appairage d''appareils et les données d''utilisation sont désactivés,
          et T3 Code est mis à jour uniquement via le Centre de paquets. Pour l''utiliser hors de votre
          réseau local, connectez-vous via un VPN'
        es: 'T3 Code es una consola web para agentes de código. Ejecute Codex, Claude Code, Pi, OpenCode
          y otros agentes compatibles en su Synology NAS y úselos desde cualquier navegador de su red: converse
          con los agentes, revise sus cambios y use el terminal integrado. No se incluye ningún agente.
          Instale los agentes que desee desde el asistente de configuración o el terminal de T3 Code e inicie
          sesión con su propia suscripción o clave de API. Los agentes se guardan en el almacenamiento propio
          del paquete, por lo que puede actualizarlos en cuanto se publiquen nuevas versiones. Los proyectos
          se guardan en la carpeta compartida que elija durante la instalación. Se requiere Container Manager.
          Solo los administradores de DSM pueden abrir T3 Code, y todos los administradores comparten una
          misma instancia de T3 Code, incluidos sus inicios de sesión de agentes. T3 Connect, el emparejamiento
          de dispositivos y los datos de uso están desactivados, y T3 Code solo se actualiza desde el Centro
          de paquetes. Para usarlo fuera de su red local, conéctese mediante una VPN'
        it: 'T3 Code è una console web per gli agenti di coding. Esegui Codex, Claude Code, Pi, OpenCode
          e altri agenti supportati sul tuo Synology NAS e usali da qualsiasi browser della tua rete: conversa
          con gli agenti, esamina le loro modifiche e usa il terminale integrato. Nessun agente è incluso.
          Installa gli agenti che desideri dalla procedura guidata di configurazione o dal terminale di
          T3 Code, quindi accedi con il tuo abbonamento o la tua chiave API. Gli agenti sono conservati
          nello spazio di archiviazione del pacchetto, quindi puoi aggiornarli appena escono nuove versioni.
          I progetti sono salvati nella cartella condivisa scelta durante l''installazione. È richiesto
          Container Manager. Solo gli amministratori DSM possono aprire T3 Code e tutti gli amministratori
          condividono un''unica istanza di T3 Code, inclusi gli accessi agli agenti. T3 Connect, l''abbinamento
          dei dispositivi e i dati di utilizzo sono disattivati e T3 Code viene aggiornato solo tramite
          il Centro pacchetti. Per usarlo al di fuori della rete locale, connettiti tramite VPN'
      changelog:
        en: |-
          0.1.7-0008

          - Choose a NAS shared folder for T3 Code's home and projects, install tools with sudo inside the container, keep temporary files on disk and require 1.7 GB of memory. Earlier data is not carried over

          0.1.7-0001

          - First release of T3 Code 0.1.7, a browser console for coding agents
          - No agent included: install Codex, Claude Code or other agents from T3 Code and sign in with your own account
          - DSM administrators only, with no extra password or pairing; all administrators share one instance
          - Browser tabs and page previews run on the NAS; their Chrome is ended after 10 idle minutes to free memory
          - T3 Code updates only through Package Center
        zh-TW: |-
          0.1.7-0008

          - 可選擇 NAS 共用資料夾存放 T3 Code 的家目錄與專案，可在容器內以 sudo 安裝工具，暫存檔改存於磁碟，安裝需 1.7 GB 記憶體。先前的資料不會沿用

          0.1.7-0001

          - 首次推出 T3 Code 0.1.7，coding agent 的瀏覽器控制台
          - 不含 agent：請從 T3 Code 安裝 Codex、Claude Code 等 agent，並以您自己的帳號登入
          - 僅限 DSM 管理員，不需額外密碼或配對；所有管理員共用同一個實例
          - 瀏覽器分頁與頁面預覽在 NAS 上執行；閒置 10 分鐘後會結束其 Chrome 以釋放記憶體
          - T3 Code 僅透過套件中心更新
        zh-CN: |-
          0.1.7-0008

          - 可选择 NAS 共享文件夹存放 T3 Code 的主目录和项目，可在容器内用 sudo 安装工具，临时文件改存于磁盘，安装需 1.7 GB 内存。之前的数据不会沿用

          0.1.7-0001

          - 首次推出 T3 Code 0.1.7，coding agent 的浏览器控制台
          - 不含 agent：请从 T3 Code 安装 Codex、Claude Code 等 agent，并使用您自己的账户登录
          - 仅限 DSM 管理员，无需额外密码或配对；所有管理员共用同一个实例
          - 浏览器标签页与页面预览在 NAS 上运行；闲置 10 分钟后会结束其 Chrome 以释放内存
          - T3 Code 仅通过套件中心更新
        ja: |-
          0.1.7-0008

          - T3 Code のホームとプロジェクト用に NAS の共有フォルダを選択可能、コンテナ内で sudo によるツールのインストールに対応、一時ファイルをディスクに保存、1.7 GB のメモリが必要に。以前のデータは引き継がれません

          0.1.7-0001

          - コーディングエージェント用ブラウザーコンソール T3 Code 0.1.7 の初回リリース
          - エージェントは含まれません：T3 Code から Codex や Claude Code などをインストールし、ご自身のアカウントでサインイン
          - DSM 管理者専用で、追加のパスワードやペアリングは不要。すべての管理者が 1 つのインスタンスを共有
          - ブラウザータブとページプレビューは NAS 上で動作。10 分間使用されないと Chrome を終了してメモリを解放
          - T3 Code はパッケージセンターからのみ更新
        ko: |-
          0.1.7-0008

          - T3 Code의 홈과 프로젝트용 NAS 공유 폴더 선택, 컨테이너 안에서 sudo로 도구 설치, 임시 파일을 디스크에 저장, 1.7GB 메모리 필요. 이전 데이터는 이어지지 않습니다

          0.1.7-0001

          - 코딩 에이전트를 위한 브라우저 콘솔 T3 Code 0.1.7 첫 출시
          - 에이전트 미포함: T3 Code에서 Codex, Claude Code 등을 설치하고 본인 계정으로 로그인
          - DSM 관리자 전용이며 추가 비밀번호나 페어링 불필요, 모든 관리자가 하나의 인스턴스 공유
          - 브라우저 탭과 페이지 미리 보기는 NAS에서 실행되며, 10분 동안 사용하지 않으면 Chrome을 종료해 메모리를 확보
