              - Das Modell-Gateway ist im LAN auf Port 3425 mit magpie-Gateway-Schlüsseln
                erreichbar, ohne DSM-Anmeldung
              - Community-Plugin-Seiten funktionieren im Panel
              - magpies eigener Updater bleibt aktiv, ein neues SPK ersetzt die mitgelieferte
                Binärdatei
            fr:
              - Première version Syno Package Land, basée sur magpie 0.1.3093
              - Les administrateurs ouvrent le panneau depuis le menu principal de DSM ; la
                passerelle d'identité DSM fournit la clé du panneau de magpie, sans second mot de
                passe d'application
              - La passerelle de modèles est joignable sur le LAN au port 3425 avec les clés de
                passerelle de magpie, sans connexion à DSM
              - Les pages des plugins communautaires fonctionnent dans le panneau
              - Le programme de mise à jour de magpie reste actif ; un nouveau SPK remplace le
                binaire fourni
            ja:
              - Syno Package Land 初回リリース（magpie 0.1.3093 に追従）
              - 管理者は DSM のメインメニューからパネルを開きます。パネルのキーは DSM identity gateway が渡すため、2 つ目のアプリパスワードは不要です
              - モデルのゲートウェイは magpie のゲートウェイキーでポート 3425 から LAN に提供され、DSM へのサインインは不要です
              - コミュニティプラグインのページがパネル内で動作します
              - magpie 自身の更新機能は有効なままで、新しい SPK が同梱のバイナリを置き換えます
            ko:
              - Syno Package Land 첫 릴리스, magpie 0.1.3093 기반
              - 관리자는 DSM 메인 메뉴에서 패널을 열어요. 패널 키는 DSM identity gateway가 제공하므로 두 번째 앱 비밀번호가 필요 없어요
              - 모델 게이트웨이는 magpie 게이트웨이 키로 3425 포트에서 LAN에 제공되며 DSM 로그인이 필요 없어요
              - 커뮤니티 플러그인 페이지가 패널 안에서 동작해요
              - magpie 자체 업데이터는 그대로 켜져 있고, 새 SPK가 패키지된 바이너리를 교체해요
            es:
              - Primera versión de Syno Package Land, basada en Magpie 0.1.3093
              - Los administradores de DSM abren el panel desde el menú principal; la pasarela de
                identidad de DSM proporciona la clave del panel de Magpie, sin una segunda
                contraseña de la aplicación
              - La pasarela de modelos sirve a la red local en el puerto 3425 con las claves de
                Magpie, sin iniciar sesión en DSM
              - Las páginas de complementos de la comunidad funcionan dentro del panel
              - El actualizador de Magpie permanece activado y un nuevo SPK sustituye el binario
                incluido
            it:
              - Prima versione di Syno Package Land, basata su Magpie 0.1.3093
              - Gli amministratori DSM aprono il pannello dal menu principale; il gateway di
                identità DSM fornisce la chiave del pannello di Magpie, senza una seconda password
                per l'app
              - Il gateway dei modelli serve la rete locale sulla porta 3425 con le chiavi di
                Magpie, senza accesso a DSM
              - Le pagine dei plugin della community funzionano nel pannello
              - Il sistema di aggiornamento di Magpie resta attivo e un nuovo SPK sostituisce il
                programma incluso
