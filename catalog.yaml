      long_description:
        en: Find what really frees space on a Btrfs volume, and free it safely
        zh-TW: 找出 Btrfs 儲存空間的可回收項目，並安全釋放空間
      changelog:
        en: >-
          0.1.1-1587


          Update UI to 0.14.8 and put Suggested cleanup in a white card matching the Overview space breakdown.
          Rebuild with SDK/App/CLI/templates 0.27.0 and executor/v0.27.0 to fix idle writes from executor
          task-inventory and DSM scheduler verification.


          Root programs, declared permissions and task templates are unchanged from 0.1.1-1586.
          Offline approval retention is eligible for this executor-only update, conditional on the installed
          protected runtime and exact DSM task readback matching the baseline. Follow the normal
          administrator approval flow if requested by the app.
        zh-TW: >-
          0.1.1-1587


          UI 更新至 0.14.8，建議清理表格改為與 Overview 空間分布一致的白色卡片。
          使用 SDK/App/CLI/templates 0.27.0 與 executor/v0.27.0 重建，修正 executor task inventory
          與 DSM scheduler 驗證在閒置時產生的寫入。


          相較 0.1.1-1586，root 程式、宣告權限與 task template 不變。此次 executor-only 更新的
          離線核准保留判定為 eligible，實際仍依已安裝 protected runtime 與 exact DSM task readback
          是否吻合；App 若要求，請由管理員依正常流程核准。
