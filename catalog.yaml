        ja: "未サインイン時は DSM サインインへ移動し、元のページに戻ります。サインインのエラーページを改善"
        ko: "DSM에 로그인하지 않았으면 바로 DSM 로그인으로 이동하고 원래 페이지로 돌아와요. 로그인 오류 페이지 개선"
        de: "Nicht angemeldete Besucher werden direkt zur DSM-Anmeldung geleitet und kehren zur geöffneten Seite zurück; klarere Anmelde-Fehlerseite"
        fr: "Les visiteurs non connectés sont redirigés vers la connexion DSM puis ramenés à la page ouverte ; page d’erreur de connexion plus claire"
