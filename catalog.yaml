        ko: Btrfs 볼륨에서 실제로 공간을 확보할 수 있는 항목을 찾아 안전하게 정리
      long_description:
        en: Find what really frees space on a Btrfs volume, and free it safely
        zh-TW: 找出 Btrfs 儲存空間的可回收項目，並安全釋放空間
        zh-CN: 找出 Btrfs 存储空间的可回收项目，并安全释放空间
        de: Finde, was auf einem Btrfs-Volume wirklich Platz freigibt, und gib ihn
          sicher frei
        fr: Trouvez ce qui libère vraiment de l'espace sur un volume Btrfs, et
          libérez-le en toute sécurité
        ja: Btrfs ボリュームで本当に空き容量を増やせるものを見つけ、安全に解放
        ko: Btrfs 볼륨에서 실제로 공간을 확보할 수 있는 항목을 찾아 안전하게 정리
      changelog:
        en: |-
          - Explore opens a plain file straight in File Station, without waiting on a detail panel
          - A file with notes shows them at once, each reason in words
          - File Station opens only inside DSM's shared folders; other paths say why
        zh-TW: |-
          - 探索會直接在 File Station 開啟一般檔案，不必等待詳細資訊面板
          - 有說明的檔案會立即顯示，每個原因都以文字說明
          - 只在 DSM 的共用資料夾內開啟 File Station；其他路徑會說明原因
        zh-CN: |-
          - 探索会直接在 File Station 中打开普通文件，无需等待详细信息面板
          - 有说明的文件会立即显示，每个原因都以文字说明
          - 仅在 DSM 的共享文件夹内打开 File Station；其他路径会说明原因
        de: |-
          - Erkunden öffnet eine gewöhnliche Datei direkt in File Station, ohne auf einen Detailbereich zu warten
          - Eine Datei mit Hinweisen zeigt diese sofort, jeden Grund in Worten
          - File Station öffnet nur innerhalb der freigegebenen DSM-Ordner; bei anderen Pfaden wird der Grund angezeigt
        fr: |-
          - Explorer ouvre un fichier ordinaire directement dans File Station, sans attendre un panneau de détails
          - Un fichier avec des remarques les affiche immédiatement, chaque raison en toutes lettres
          - File Station ne s’ouvre que dans les dossiers partagés de DSM ; pour les autres chemins, la raison est indiquée
        ja: |-
          - エクスプローラーで通常のファイルを詳細パネルを待たずに File Station で直接開きます
          - 注記のあるファイルはすぐに表示し、理由をそれぞれ文章で説明します
          - File Station は DSM の共有フォルダー内でのみ開き、それ以外のパスでは理由を表示します
        ko: |-
          - 탐색에서 일반 파일을 세부 정보 패널을 기다리지 않고 File Station에서 바로 엽니다
          - 참고 사항이 있는 파일은 즉시 표시하고 각 이유를 문장으로 설명합니다
          - File Station은 DSM 공유 폴더 안에서만 열고, 다른 경로는 이유를 알려 줍니다
