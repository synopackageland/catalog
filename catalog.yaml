        zh-TW: 轉換文件、圖片、音訊與影片的檔案格式
        zh-CN: 转换文档、图片、音频与视频的文件格式
        de: Dokumente, Bilder, Audio und Video zwischen Dateiformaten umwandeln
        fr: Convertissez documents, images, audio et vidéo d'un format à l'autre
        ja: 文書、画像、音声、動画のファイル形式を変換
        ko: 문서, 이미지, 오디오, 동영상의 파일 형식 변환
        es: Convierte documentos, imágenes, audio y vídeo entre formatos de archivo
        it: Converti documenti, immagini, audio e video tra formati diversi
      long_description:
        en: Upload documents, images, audio or video in your browser, choose an output format and download
          the converted files. All authorized users share one workspace and can see and download
          each other's files. Jobs older than 24 hours are periodically removed. App data remains in
          Container Manager volumes after uninstall; DSM sign-in and Container Manager are required
        zh-TW: 在瀏覽器上傳文件、圖片、音訊或影片，選擇輸出格式後下載轉換完成的檔案。所有獲授權使用者共用同一工作空間，可看見並下載彼此的檔案；超過 24 小時的工作會定期移除。卸載後 App
          資料仍保留於 Container Manager 儲存空間；需 DSM 登入及 Container Manager
        zh-CN: 在浏览器上传文档、图片、音频或视频，选择输出格式后下载转换完成的文件。所有获授权用户共用同一工作空间，可看见并下载彼此的文件；超过 24 小时的工作会定期移除。卸载后 App
          数据仍保留于 Container Manager 存储空间；需 DSM 登录及 Container Manager
        de: Lade Dokumente, Bilder, Audio oder Video im Browser hoch, wähle ein Zielformat und lade die
          umgewandelten Dateien herunter. Alle berechtigten Nutzer teilen sich einen Arbeitsbereich
          und können die Dateien der anderen sehen und herunterladen. Aufträge, die älter als 24
          Stunden sind, werden regelmäßig entfernt. App-Daten bleiben nach der Deinstallation in
          Volumes von Container Manager; DSM-Anmeldung und Container Manager sind erforderlich
        fr: Envoyez des documents, images, fichiers audio ou vidéo dans votre navigateur, choisissez un
          format de sortie et téléchargez les fichiers convertis. Tous les utilisateurs autorisés
          partagent un même espace de travail et peuvent voir et télécharger les fichiers des
          autres. Les tâches de plus de 24 heures sont supprimées régulièrement. Les données de
          l'App restent dans les volumes de Container Manager après la désinstallation ; connexion
          DSM et Container Manager requis
        ja: ブラウザーで文書、画像、音声、動画をアップロードし、出力形式を選んで変換後のファイルをダウンロードできます。許可されたユーザー全員が同じ作業スペースを共有し、互いのファイルを表示・ダウンロードできます。24
          時間を過ぎたジョブは定期的に削除されます。アプリのデータはアンインストール後も Container Manager のボリュームに残ります。DSM サインインと Container
          Manager が必要です
        ko: 브라우저에서 문서, 이미지, 오디오, 동영상을 올리고 출력 형식을 골라 변환된 파일을 내려받아요. 권한이 있는 사용자 모두가 작업 공간 하나를 함께 쓰고, 서로의 파일을
          보고 내려받을 수 있어요. 24시간이 지난 작업은 주기적으로 지워져요. 앱 데이터는 제거 후에도 Container Manager 볼륨에 남아요. DSM 로그인과
          Container Manager가 필요해요
        es: Sube documentos, imágenes, audio o vídeo desde el navegador, elige el formato de salida y
          descarga los archivos convertidos. Todos los usuarios autorizados comparten un mismo
          espacio de trabajo y pueden ver y descargar los archivos de los demás. Las tareas de más
          de 24 horas se eliminan periódicamente. Los datos de la aplicación se conservan en los
          volúmenes de Container Manager tras desinstalarla; requiere iniciar sesión en DSM y
          disponer de Container Manager
        it: Carica documenti, immagini, audio o video dal browser, scegli il formato di uscita e scarica i
          file convertiti. Tutti gli utenti autorizzati condividono lo stesso spazio di lavoro e
          possono vedere e scaricare i file degli altri. Le attività più vecchie di 24 ore vengono
          eliminate periodicamente. I dati dell'app restano nei volumi di Container Manager dopo la
          disinstallazione; richiede l'accesso a DSM e Container Manager
      screenshots:
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgConvertX/01-file-conversion-upstream.png
