      long_description:
        en: Download files from HTTP/HTTPS links, torrents, magnet links and ED2K, plus
          videos from sites supported by yt-dlp and sources added by extensions.
          Pause, resume and organize downloads, choose where completed files are
          saved and view your history. Each user has separate downloads;
          administrators manage access, extensions and engine updates. Powered
          by Gopeed; DSM sign-in is required
        zh-TW: 下載 HTTP／HTTPS 連結、種子、磁力連結與 ED2K 檔案，以及 yt-dlp
          支援網站的影片和擴充套件新增的來源。暫停、繼續與整理下載，選擇完成檔案的儲存位置並查看歷史紀錄。每位使用者各自管理下載，管理員管理存取權限、擴充套件與引擎更新。以
          Gopeed 為核心；需 DSM 登入
        zh-CN: 下载 HTTP／HTTPS 链接、种子、磁力链接与 ED2K 文件，以及 yt-dlp 支持网站的视频和扩展添加的来源。暂停、继续与整理下载，选择完成文件的保存位置并查看历史记录。每位用户各自管理下载，管理员管理访问权限、扩展与引擎更新。以 Gopeed 为内核；需 DSM 登录
        de: Lade Dateien über HTTP/HTTPS-Links, Torrents, Magnet-Links und ED2K herunter, dazu Videos von Seiten, die yt-dlp unterstützt, und aus Quellen von Erweiterungen. Pausiere, setze fort und ordne Downloads, wähle, wo fertige Dateien gespeichert werden, und sieh dir deinen Verlauf an. Jeder Nutzer hat eigene Downloads; Administratoren verwalten Zugriff, Erweiterungen und Engine-Updates. Basiert auf Gopeed; DSM-Anmeldung ist erforderlich
        fr: Téléchargez des fichiers depuis des liens HTTP/HTTPS, des torrents, des liens magnet et ED2K, ainsi que des vidéos des sites pris en charge par yt-dlp et des sources ajoutées par des extensions. Mettez en pause, reprenez et organisez vos téléchargements, choisissez où enregistrer les fichiers terminés et consultez votre historique. Chaque utilisateur a ses propres téléchargements ; les administrateurs gèrent l'accès, les extensions et les mises à jour du moteur. Basé sur Gopeed ; connexion DSM requise
        ja: HTTP/HTTPS リンク、Torrent、マグネット リンク、ED2K のファイルに加え、yt-dlp 対応サイトの動画や拡張機能で追加したソースからダウンロードできます。ダウンロードの一時停止・再開・整理、完了したファイルの保存先の選択、履歴の確認ができます。ダウンロードはユーザーごとに分かれ、アクセス、拡張機能、エンジンの更新は管理者が管理します。Gopeed を利用しています。DSM サインインが必要です
        ko: HTTP/HTTPS 링크, 토렌트, 마그넷 링크, ED2K 파일은 물론 yt-dlp가 지원하는 사이트의 동영상과 확장 기능으로 추가한 소스에서도 내려받아요. 다운로드를 일시 정지, 재개, 정리하고, 완료된 파일을 저장할 위치를 고르고, 기록을 볼 수 있어요. 다운로드는 사용자마다 따로이고, 접근 권한과 확장 기능, 엔진 업데이트는 관리자가 관리해요. Gopeed 기반이며 DSM 로그인이 필요해요
      changelog:
        en: |-
          0.2.2-0097

          - Improve sign-in reliability and responsiveness when the NAS is busy, and make selected items clearer on phones

          0.2.2-0096

          - Improve startup and authorization feedback, refresh window and dialog styling, and refine touch feedback on phones

          0.2.2-0095

          - Fix phone scrolling after the header hides, keep the top bar and settings actions in place, and reduce disk wake-ups during background status checks

          0.2.2-0094

          - Update the toolchain and fix phone sign-in approval, bottom spacing, sideways scrolling and sticky positioning

          0.2.2-0093

          - Update the UI, SDK and packaging tools with compact phone controls and mobile approval

          0.2.2-0090

          - Share links, text containing links and torrent files into Download Hub through the compatible Syno Package Land mobile app, then review before starting
          - Save completed NAS downloads to your phone, including individual files from multi-file downloads
          - Replace unsupported filename characters and automatically rename same-name downloads without replacing existing files
          - Correctly recognize completed multi-file saves in subfolders and recover saves left pending by the earlier result check without copying again
        zh-TW: |-
          0.2.2-0097

          - 改善登入穩定性與 NAS 忙碌時的操作回應，讓手機上的已選項目更清楚

          0.2.2-0096

          - 改善啟動與授權提示，更新視窗及對話框外觀，並優化手機觸控回饋

          0.2.2-0095

          - 修正手機頂部列隱藏後回捲時畫面凍結，改善頂部列與設定操作列位置，並減少背景狀態檢查喚醒硬碟

          0.2.2-0094

          - 更新工具鏈，修正手機登入核准、底部留白、橫向捲動與固定列位置

          0.2.2-0093

          - 更新 UI、SDK 與打包工具鏈，精簡手機控制項並支援行動版權限核准

          0.2.2-0090

          - 透過相容的 Syno Package Land 行動 App 將連結、含連結的文字與種子檔分享至 Download Hub，確認後再開始下載
          - 將已儲存至 NAS 的下載存到手機，也可個別儲存多檔下載中的檔案
          - 替換檔名中不支援的字元，並自動重新命名同名下載，保留既有檔案
          - 正確辨識已存入子資料夾的多檔下載，並恢復因舊版結果檢查而停在待確認的儲存狀態，不重複複製
        zh-CN: |-
          0.2.2-0097

          - 改善登录稳定性与 NAS 忙碌时的操作响应，让手机上的已选项目更清楚

          0.2.2-0096

          - 改善启动与授权提示，更新窗口及对话框外观，并优化手机触控反馈

          0.2.2-0095

          - 修复手机顶部栏隐藏后回滚时画面冻结，改善顶部栏与设置操作栏位置，并减少后台状态检查唤醒硬盘

          0.2.2-0094

          - 更新工具链，修复手机登录授权、底部留白、横向滚动和固定栏位置

          0.2.2-0093

          - 更新 UI、SDK 和打包工具链，精简手机控件并支持移动版权限授权

          0.2.2-0090

          - 通过兼容的 Syno Package Land 移动 App 将链接、含链接的文本和种子文件分享至 Download Hub，确认后再开始下载
          - 将已保存至 NAS 的下载存到手机，也可单独保存多文件下载中的文件
          - 替换文件名中不支持的字符，并自动重命名同名下载，保留现有文件
          - 正确识别已存入子文件夹的多文件下载，并恢复因旧版结果检查而停在待确认的保存状态，不重复复制
        de: |-
          0.2.2-0097

          - Zuverlässigere Anmeldung und bessere Reaktion bei ausgelastetem NAS sowie deutlichere Markierung ausgewählter Elemente auf Smartphones

          0.2.2-0096

          - Verbesserte Rückmeldungen beim Start und bei der Autorisierung, überarbeitete Fenster und Dialoge sowie optimierte Touch-Rückmeldungen auf Smartphones

          0.2.2-0095

          - Einfrieren beim Hochscrollen nach dem Ausblenden der Kopfleiste auf Smartphones beheben, obere Leiste und Einstellungsaktionen korrekt platzieren und Festplatten seltener durch Statusprüfungen aufwecken

          0.2.2-0094

          - Toolchain aktualisieren und Anmeldegenehmigung, unteren Abstand, seitliches Scrollen und fixierte Leisten auf Smartphones korrigieren

          0.2.2-0093

          - UI, SDK und Paketwerkzeuge aktualisieren, mit kompakteren Smartphone-Bedienelementen und mobiler Genehmigung

          0.2.2-0090

          - Links, Text mit Links und Torrent-Dateien über die kompatible mobile App von Syno Package Land an Download Hub teilen und vor dem Start prüfen
          - Auf dem NAS gespeicherte Downloads auf dem Smartphone speichern, auch einzelne Dateien aus Downloads mit mehreren Dateien
          - Nicht unterstützte Zeichen in Dateinamen ersetzen und gleichnamige Downloads automatisch umbenennen, ohne vorhandene Dateien zu ersetzen
          - Abgeschlossene Speichervorgänge für mehrere Dateien in Unterordnern korrekt erkennen und durch die frühere Ergebnisprüfung ausstehende Vorgänge ohne erneutes Kopieren abschließen
        fr: |-
          0.2.2-0097

          - Connexion plus fiable et meilleure réactivité lorsque le NAS est occupé, avec une sélection plus visible sur téléphone

          0.2.2-0096

          - Amélioration des indications au démarrage et lors de l’autorisation, nouveau style des fenêtres et des boîtes de dialogue et retour tactile affiné sur téléphone

          0.2.2-0095

          - Corriger le blocage lors du défilement vers le haut après le masquage de l’en-tête sur téléphone, améliorer la position de la barre supérieure et des actions des réglages et réduire les réveils des disques lors des vérifications en arrière-plan

          0.2.2-0094

          - Mettre à jour les outils et corriger l’approbation de connexion, l’espace inférieur, le défilement horizontal et les barres fixes sur téléphone

          0.2.2-0093

          - Mettre à jour l’UI, le SDK et les outils de création avec des commandes compactes et l’approbation sur mobile

          0.2.2-0090

          - Partager des liens, du texte contenant des liens et des fichiers torrent vers Download Hub depuis l’application mobile compatible Syno Package Land, puis vérifier avant de lancer le téléchargement
          - Enregistrer sur le téléphone les téléchargements sauvegardés sur le NAS, y compris des fichiers individuels issus d’un téléchargement multiple
          - Remplacer les caractères non pris en charge dans les noms et renommer automatiquement les téléchargements de même nom sans remplacer les fichiers existants
          - Reconnaître correctement les sauvegardes multiples terminées dans des sous-dossiers et rétablir celles restées en attente à cause de l’ancienne vérification, sans nouvelle copie
        ja: |-
          0.2.2-0097

          - サインインの安定性と NAS が混雑しているときの操作応答を改善し、スマートフォンで選択中の項目を見やすく表示

          0.2.2-0096

          - 起動と認証の案内を改善し、ウィンドウとダイアログの表示を更新、スマートフォンのタッチ操作時の反応を調整

          0.2.2-0095

          - スマートフォンで上部バーが隠れた後に上へスクロールすると画面が固まる問題を修正し、上部バーと設定操作欄の位置を改善、バックグラウンドの状態確認によるディスクの起動を削減

          0.2.2-0094

          - ツールチェーンを更新し、スマートフォンのログイン承認、下部の余白、横スクロール、固定バーの位置を修正

          0.2.2-0093

          - UI、SDK、パッケージングツールを更新し、スマートフォンの操作部をコンパクトにしてモバイルでの承認に対応

          0.2.2-0090

          - 対応する Syno Package Land モバイルアプリからリンク、リンクを含むテキスト、Torrent ファイルを Download Hub に共有し、内容を確認してからダウンロードを開始
          - NAS に保存済みのダウンロードをスマートフォンに保存し、複数ファイルのダウンロードから個別のファイルも保存可能
          - ファイル名の未対応文字を置き換え、同名のダウンロードを自動で改名して既存のファイルを保持
          - サブフォルダーへの複数ファイルの保存完了を正しく認識し、従来の結果確認で保留になった保存を再コピーせずに復元
        ko: |-
          0.2.2-0097

          - 로그인 안정성과 NAS가 사용 중일 때의 응답성을 개선하고 휴대폰에서 선택한 항목을 더 명확하게 표시

          0.2.2-0096

          - 시작 및 권한 승인 안내를 개선하고, 창과 대화 상자 디자인을 새롭게 다듬으며 휴대폰 터치 반응을 개선

          0.2.2-0095

          - 휴대폰 상단 표시줄이 숨겨진 뒤 위로 스크롤할 때 화면이 멈추는 문제를 수정하고, 상단 표시줄과 설정 작업 버튼의 위치를 개선하며 백그라운드 상태 확인으로 인한 디스크 깨우기를 줄임

          0.2.2-0094

          - 툴체인을 업데이트하고 휴대폰 로그인 승인, 하단 여백, 가로 스크롤 및 고정 막대 위치 수정

          0.2.2-0093

          - UI, SDK 및 패키징 도구를 업데이트하고 휴대폰 컨트롤을 간결하게 개선하며 모바일 승인 지원

          0.2.2-0090

          - 호환되는 Syno Package Land 모바일 앱에서 링크, 링크가 포함된 텍스트와 토렌트 파일을 Download Hub로 공유하고 내용을 확인한 후 다운로드 시작
          - NAS에 저장된 다운로드를 휴대폰에 저장하고 여러 파일로 구성된 다운로드의 개별 파일도 저장
          - 파일명의 지원되지 않는 문자를 바꾸고 이름이 같은 다운로드는 자동으로 이름을 변경하여 기존 파일 보존
          - 하위 폴더의 여러 파일 저장 완료를 올바르게 인식하고 이전 결과 확인으로 보류된 저장 상태를 다시 복사하지 않고 복구
        es: |-
          0.2.2-0097

          - Mejora la fiabilidad del inicio de sesión y la respuesta cuando el NAS está ocupado, y muestra con más claridad los elementos seleccionados en teléfonos

          0.2.2-0096

          - Mejoras en los avisos de inicio y autorización, en el aspecto de ventanas y diálogos y en la respuesta táctil en teléfonos

          0.2.2-0095

          - Corregir el bloqueo al desplazarse hacia arriba tras ocultarse la cabecera en teléfonos, mejorar la posición de la barra superior y las acciones de ajustes y reducir las activaciones de discos durante las comprobaciones en segundo plano

          0.2.2-0094

          - Actualizar las herramientas y corregir la aprobación de inicio de sesión, el espacio inferior, el desplazamiento horizontal y las barras fijas en teléfonos

          0.2.2-0093

          - Actualizar la UI, el SDK y las herramientas de empaquetado con controles compactos y aprobación desde el móvil

          0.2.2-0090

          - Comparte enlaces, texto con enlaces y archivos torrent con Download Hub desde la aplicación móvil compatible de Syno Package Land y revisa el contenido antes de iniciar la descarga
          - Guarda en el teléfono las descargas almacenadas en el NAS, incluidos archivos individuales de descargas con varios archivos
          - Sustituye los caracteres no admitidos en los nombres y renombra automáticamente las descargas con el mismo nombre sin reemplazar los archivos existentes
          - Reconoce correctamente los guardados de varios archivos completados en subcarpetas y recupera los que quedaron pendientes por la comprobación anterior sin volver a copiarlos
        it: |-
          0.2.2-0097

          - Migliora l’affidabilità dell’accesso e la risposta quando il NAS è occupato, rendendo più chiari gli elementi selezionati sui telefoni

          0.2.2-0096

          - Miglioramenti alle indicazioni di avvio e autorizzazione, allo stile di finestre e dialoghi e alla risposta al tocco sui telefoni

          0.2.2-0095

          - Correggere il blocco scorrendo verso l’alto dopo la scomparsa dell’intestazione sui telefoni, migliorare la posizione della barra superiore e delle azioni delle impostazioni e ridurre i risvegli dei dischi durante i controlli in background

          0.2.2-0094

          - Aggiornare gli strumenti e correggere l’approvazione di accesso, lo spazio inferiore, lo scorrimento orizzontale e le barre fisse sui telefoni

          0.2.2-0093

          - Aggiornare UI, SDK e strumenti di creazione con controlli compatti e approvazione da dispositivi mobili

          0.2.2-0090

          - Condividi link, testo contenente link e file torrent con Download Hub dall’app mobile compatibile di Syno Package Land e controlla il contenuto prima di avviare il download
          - Salva sul telefono i download archiviati sul NAS, anche i singoli file dei download con più file
          - Sostituisci i caratteri non supportati nei nomi e rinomina automaticamente i download omonimi senza sostituire i file esistenti
          - Riconosci correttamente i salvataggi di più file completati nelle sottocartelle e recupera quelli rimasti in sospeso per il precedente controllo senza copiarli di nuovo
      screenshots:
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgGopeed/01-downloads-0096-en.png
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgGopeed/02-search-0081-en.png
