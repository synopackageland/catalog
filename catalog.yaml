        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgJellyfin/02-movie-library-upstream.jpg
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgJellyfin/03-movie-details-upstream.jpg
