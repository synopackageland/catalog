        fr: "Gérer les documents avec des jetons API personnels, des envois bornés et des originaux vérifiés"
        es: "Gestiona documentos con tokens API personales, cargas limitadas y descargas originales verificadas"
        it: "Gestisci documenti con token API personali, caricamenti limitati e download originali verificati"
