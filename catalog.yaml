        zh-TW: 找出 Btrfs 儲存空間的可回收項目，並安全釋放空間
        zh-CN: 找出 Btrfs 存储空间的可回收项目，并安全释放空间
        de: Finde, was auf einem Btrfs-Volume wirklich Platz freigibt, und gib ihn
