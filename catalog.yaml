        en: Browse and manage files from local storage and cloud drives in one place
        zh-TW: 在同一處瀏覽與管理本機儲存空間和雲端硬碟的檔案
        zh-CN: 在同一处浏览与管理本地存储和云盘中的文件
        ja: ローカルストレージとクラウドドライブのファイルを一か所で閲覧・管理
        ko: 로컬 저장소와 클라우드 드라이브의 파일을 한곳에서 탐색하고 관리해요
        de: Dateien aus lokalem Speicher und Cloud-Laufwerken an einem Ort durchsuchen und verwalten
        fr: Parcourez et gérez les fichiers du stockage local et des espaces cloud au même endroit
        es: Explore y gestione archivos del almacenamiento local y de unidades en la nube en un solo lugar
        it: Sfoglia e gestisci i file locali e delle unità cloud in un unico posto
      long_description:
        en: Bring local folders and supported cloud drives into one file browser. Preview files, play audio
          and video, and upload, download or organize files across your connected storage. DSM
          grants the package account read-only access to the folder selected in the wizard; add that
          folder as Local storage in OpenList to browse it. External WebDAV access is unavailable.
          Preview package; DSM administrator sign-in is required
        zh-TW: 在同一個檔案瀏覽器整合本機資料夾與支援的雲端硬碟。預覽檔案、播放影音，並在已連接的儲存空間上傳、下載及整理檔案。DSM 會授予套件帳號所選共用資料夾的唯讀權限；仍須在 OpenList
          新增 Local storage 才能瀏覽。不開放外部 WebDAV 存取。本套件為預覽版；需 DSM 管理員登入
        zh-CN: 在同一个文件浏览器中整合本地文件夹与支持的云盘。预览文件、播放音视频，并在已连接的存储中上传、下载和整理文件。DSM 会授予套件账号所选共享文件夹的只读权限；仍须在 OpenList
          中新增 Local storage 才能浏览。不开放外部 WebDAV 访问。本套件为预览版；需 DSM 管理员登录
        ja: ローカルフォルダーと対応するクラウドドライブを一つのファイルブラウザーにまとめます。ファイルのプレビュー、音声・動画の再生、接続したストレージでのアップロード、ダウンロード、整理ができます。DSM
          がウィザードで選択した共有フォルダーの読み取り権限をパッケージアカウントに付与します。参照するには OpenList でそのフォルダーを Local storage
          として追加してください。外部 WebDAV アクセスは利用できません。プレビュー版で、DSM 管理者のサインインが必要です
        ko: 로컬 폴더와 지원되는 클라우드 드라이브를 하나의 파일 탐색기에 모아요. 파일 미리보기, 오디오·동영상 재생, 연결된 저장소의 파일 업로드, 다운로드와 정리를 할 수 있어요.
          DSM이 마법사에서 선택한 공유 폴더에 패키지 계정의 읽기 전용 권한을 부여해요. 폴더를 둘러보려면 OpenList에 Local storage로 추가하세요. 외부
          WebDAV 접속은 제공하지 않아요. 미리보기 버전이며 DSM 관리자 로그인이 필요해요
        de: Lokale Ordner und unterstützte Cloud-Laufwerke in einem Dateibrowser verbinden. Dateien als
          Vorschau ansehen, Audio und Video abspielen sowie Dateien in verbundenen Speichern
          hochladen, herunterladen und organisieren. DSM gewährt dem Paketkonto Lesezugriff auf den
          im Assistenten gewählten Ordner; füge diesen in OpenList als Local storage hinzu, um ihn
          zu durchsuchen. Externer WebDAV-Zugriff ist nicht verfügbar. Vorschauversion;
          DSM-Administratoranmeldung erforderlich
        fr: Regroupez les dossiers locaux et les espaces cloud compatibles dans un seul navigateur de
          fichiers. Prévisualisez des fichiers, lisez des contenus audio et vidéo, puis importez,
          téléchargez et organisez les fichiers de vos stockages connectés. DSM accorde au compte du
          paquet un accès en lecture seule au dossier choisi dans l’assistant ; ajoutez ce dossier
          comme Local storage dans OpenList pour le parcourir. L’accès WebDAV externe est
          indisponible. Version en aperçu ; connexion administrateur DSM requise
        es: Reúne carpetas locales y unidades en la nube compatibles en un solo explorador. Previsualiza
          archivos, reproduce audio y vídeo, y sube, descarga u organiza archivos entre los
          almacenamientos conectados. DSM concede a la cuenta del paquete acceso de solo lectura a
          la carpeta elegida en el asistente; añádela como almacenamiento local en OpenList para
          explorarla. El acceso WebDAV externo no está disponible. Paquete en versión preliminar;
          requiere iniciar sesión como administrador de DSM
        it: Riunisci cartelle locali e unità cloud supportate in un unico gestore di file. Visualizza
          anteprime, riproduci audio e video e carica, scarica o organizza file tra gli archivi
          collegati. DSM concede all'account del pacchetto l'accesso in sola lettura alla cartella
          scelta nella procedura guidata; aggiungila come archivio locale in OpenList per
          esplorarla. L'accesso WebDAV esterno non è disponibile. Pacchetto in anteprima; richiede
          l'accesso come amministratore DSM
