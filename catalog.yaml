      description:
        en: "See what is filling your Synology NAS and safely free up space"
        zh-TW: "看清 Synology NAS 的空間被什麼佔用，安全清出空間"
        zh-CN: "看清 Synology NAS 的空间被什么占用，安全清出空间"
        ja: "Synology NAS の容量を何が使っているかを把握し、安全に空き容量を確保"
        ko: "Synology NAS 공간을 무엇이 차지하는지 확인하고 안전하게 공간 확보"
        de: "Sieh, was den Speicher deiner Synology NAS belegt, und gib sicher Platz frei"
        fr: "Voyez ce qui remplit votre NAS Synology et libérez de l'espace en toute sécurité"
        es: "Descubre qué ocupa el espacio de tu NAS Synology y libéralo de forma segura"
        it: "Scopri cosa occupa lo spazio del tuo NAS Synology e liberalo in sicurezza"
      long_description:
        en: "Space cleanup for Synology NAS, for Btrfs and ext4 volumes. Scan a volume or chosen folders to see what really uses space: shared folders, package data, recycle bins, snapshots and the system partition. Reclaim shows how much deleting something would actually free, including space still held by snapshots or shared copies, and tracks how usage changes over time. Cleanup uses a reviewed plan that is checked again right before anything is deleted"
        zh-TW: "Synology NAS 的空間整理工具，支援 Btrfs 與 ext4 儲存空間。掃描整個儲存空間或指定資料夾，看清共用資料夾、套件資料、資源回收筒、快照與系統分割區實際佔用多少空間。Reclaim 會算出刪除後真正能釋放的空間，包含仍被快照或共用副本佔住的部分，並追蹤用量變化。清理前會先列出計畫供確認，實際刪除前再重新檢查一次"
        zh-CN: "Synology NAS 的空间整理工具，支持 Btrfs 与 ext4 存储空间。扫描整个存储空间或指定文件夹，看清共享文件夹、套件数据、回收站、快照与系统分区实际占用多少空间。Reclaim 会算出删除后真正能释放的空间，包含仍被快照或共享副本占用的部分，并追踪用量变化。清理前会先列出计划供确认，实际删除前再重新检查一次"
        ja: "Synology NAS の容量整理ツール。Btrfs と ext4 のボリュームに対応。ボリューム全体または指定したフォルダーをスキャンし、共有フォルダー、パッケージデータ、ごみ箱、スナップショット、システムパーティションが実際に使っている容量を確認できます。削除で本当に解放される容量を、スナップショットや共有コピーが保持している分も含めて算出し、使用量の変化も追跡します。クリーンアップは確認済みの計画に沿って行い、削除の直前にもう一度検証します"
        ko: "Synology NAS용 공간 정리 도구로 Btrfs와 ext4 볼륨을 지원합니다. 볼륨 전체 또는 선택한 폴더를 스캔해 공유 폴더, 패키지 데이터, 휴지통, 스냅샷, 시스템 파티션이 실제로 차지하는 공간을 확인합니다. 스냅샷이나 공유 사본이 아직 붙잡고 있는 공간까지 포함해 삭제 시 실제로 확보되는 공간을 계산하고 사용량 변화도 추적합니다. 정리는 검토한 계획대로 진행하며 삭제 직전에 다시 확인합니다"
        de: "Speicherbereinigung für Synology NAS mit Btrfs- und ext4-Volumes. Scanne ein Volume oder ausgewählte Ordner und sieh, was wirklich Platz belegt: freigegebene Ordner, Paketdaten, Papierkörbe, Snapshots und die Systempartition. Reclaim zeigt, wie viel das Löschen tatsächlich freigibt, auch Platz, den Snapshots oder geteilte Kopien noch halten, und verfolgt die Belegung über die Zeit. Bereinigt wird nach einem geprüften Plan, der direkt vor dem Löschen erneut kontrolliert wird"
        fr: "Nettoyage de l'espace pour NAS Synology, avec volumes Btrfs et ext4. Analysez un volume ou des dossiers choisis pour voir ce qui occupe vraiment l'espace : dossiers partagés, données des paquets, corbeilles, instantanés et partition système. Reclaim indique combien une suppression libérerait réellement, y compris l'espace encore retenu par des instantanés ou des copies partagées, et suit l'évolution de l'utilisation. Le nettoyage suit un plan validé, vérifié de nouveau juste avant toute suppression"
        es: "Limpieza de espacio para NAS Synology con volúmenes Btrfs y ext4. Analiza un volumen o carpetas elegidas para ver qué ocupa realmente el espacio: carpetas compartidas, datos de paquetes, papeleras, instantáneas y la partición del sistema. Reclaim muestra cuánto liberaría de verdad una eliminación, incluido el espacio que aún retienen instantáneas o copias compartidas, y sigue la evolución del uso. La limpieza sigue un plan revisado que se vuelve a comprobar justo antes de borrar nada"
        it: "Pulizia dello spazio per NAS Synology con volumi Btrfs ed ext4. Analizza un volume o le cartelle scelte per vedere cosa occupa davvero spazio: cartelle condivise, dati dei pacchetti, cestini, snapshot e partizione di sistema. Reclaim mostra quanto libererebbe davvero un'eliminazione, compreso lo spazio ancora trattenuto da snapshot o copie condivise, e segue l'andamento dell'utilizzo. La pulizia segue un piano verificato, controllato di nuovo subito prima di eliminare qualsiasi cosa"
      changelog:
        en: "0.1.1-1629\n\n- Fix phone scrolling when the hidden header reappears, and keep the header above page content\n- Improve the phone toolbar and settings action buttons\n- Keep read-only system task checks in memory to avoid waking disks\n- Update SDK/App to 0.53.6 and UI to 0.23.7; retain settings and scan reports\n\n0.1.1-1628\n\n- Open Reclaim in the Package Land phone layout without enabling Application Portal, preserving administrator access, settings and scan reports\n- Approve system tasks directly from the phone entry on first launch\n- Use minified public frontend bundles without source maps; all App data requires an administrator session\n- Approve the updated system tasks after upgrading\n\n0.1.1-1627\n\n- Updated UI components to 0.20.17: on a touch screen a control's tap box no longer makes the page scroll sideways, overlays return focus to the button that opened them, and short screens keep compact settings rows\n- Reuse the unchanged runtime, executor and root programs from 0.1.1-1626 for x86_64, aarch64 and armv7\n- Settings and saved scan reports are kept; the system task approval is unchanged"
        zh-TW: "0.1.1-1629\n\n- 修正手機版隱藏標頭重新出現時畫面凍結的問題，並讓標頭保持在內容上方\n- 改善手機頂部工具列與設定頁操作按鈕\n- 唯讀系統工作檢查改用記憶體紀錄，避免喚醒硬碟\n- 更新 SDK/App 至 0.53.6、UI 至 0.23.7，保留設定與掃描報告\n\n0.1.1-1628\n\n- 在 Package Land 以手機版面開啟 Reclaim，無須啟用應用程式入口，保留管理員權限、設定與掃描報告\n- 首次啟動時可直接從手機入口核准系統工作\n- 公開前端檔案經壓縮且不含 source maps，所有 App 資料皆須管理員工作階段\n- 升級後請核准更新的系統工作\n\n0.1.1-1627\n\n- 更新 UI 元件至 0.20.17：觸控螢幕上控制項的點按區不再讓頁面左右捲動，覆蓋層關閉後焦點回到開啟它的按鈕，矮螢幕維持精簡的設定列\n- x86_64、aarch64 與 armv7 沿用 0.1.1-1626 未變更的執行環境、executor 與 root 程式\n- 保留設定與已儲存的掃描報告；系統工作核准狀態不變"
        zh-CN: "0.1.1-1629\n\n- 修复手机版隐藏标题栏重新出现时画面冻结的问题，并让标题栏保持在内容上方\n- 改善手机顶部工具栏与设置页操作按钮\n- 只读系统任务检查改用内存记录，避免唤醒硬盘\n- 更新 SDK/App 至 0.53.6、UI 至 0.23.7，保留设置与扫描报告\n\n0.1.1-1628\n\n- 在 Package Land 以手机版面打开 Reclaim，无需启用应用程序门户，保留管理员权限、设置与扫描报告\n- 首次启动时可直接从手机入口批准系统任务\n- 公开前端文件经过压缩且不含 source maps，所有 App 数据均需管理员会话\n- 升级后请批准更新的系统任务\n\n0.1.1-1627\n\n- 更新 UI 组件至 0.20.17：触控屏幕上控件的点按区域不再让页面左右滚动，覆盖层关闭后焦点回到打开它的按钮，矮屏幕保持精简的设置行\n- x86_64、aarch64 与 armv7 沿用 0.1.1-1626 未改变的运行环境、executor 与 root 程序\n- 保留设置与已保存的扫描报告；系统任务批准状态不变"
        ja: "0.1.1-1629\n\n- スマートフォンで非表示のヘッダーが再表示される際のフリーズを修正し、ヘッダーをページ内容の上に表示\n- スマートフォン上部のツールバーと設定画面の操作ボタンを改善\n- システムタスクの読み取り専用チェックをメモリに記録し、ディスクの不要な起動を抑制\n- SDK/App を 0.53.6、UI を 0.23.7 に更新し、設定とスキャンレポートを保持\n\n0.1.1-1628\n\n- アプリケーションポータルを有効にせず Package Land のスマートフォン用レイアウトで Reclaim を開き、管理者アクセス、設定、スキャンレポートを保持\n- 初回起動時にスマートフォンの入口から直接システムタスクを承認\n- 公開フロントエンドを圧縮しソースマップを除外、すべてのアプリデータに管理者セッションが必要\n- アップグレード後に更新されたシステムタスクを承認してください\n\n0.1.1-1627\n\n- UI コンポーネントを 0.20.17 に更新：タッチ画面でコントロールのタップ領域がページの横スクロールを起こさなくなり、オーバーレイを閉じると開いたボタンにフォーカスが戻り、低い画面では設定行がコンパクトなままになります\n- x86_64、aarch64、armv7 は 0.1.1-1626 の未変更のランタイム、executor、root プログラムを再利用します\n- 設定と保存済みスキャンレポートは保持され、システムタスクの承認状態は変わりません"
        ko: "0.1.1-1629\n\n- 휴대폰에서 숨겨진 헤더가 다시 나타날 때 화면이 멈추는 문제를 수정하고 헤더를 콘텐츠 위에 표시\n- 휴대폰 상단 도구 모음과 설정 화면의 작업 버튼 개선\n- 읽기 전용 시스템 작업 확인 기록을 메모리에 보관하여 디스크가 깨어나는 현상 방지\n- SDK/App을 0.53.6, UI를 0.23.7로 업데이트하고 설정 및 스캔 보고서 유지\n\n0.1.1-1628\n\n- 응용 프로그램 포털을 활성화하지 않고 Package Land의 휴대폰 레이아웃으로 Reclaim을 열며 관리자 접근 권한, 설정 및 스캔 보고서 유지\n- 처음 실행할 때 휴대폰 진입 화면에서 직접 시스템 작업 승인\n- 공개 프런트엔드 번들을 최소화하고 소스 맵을 제외하며 모든 앱 데이터에 관리자 세션 필요\n- 업그레이드 후 업데이트된 시스템 작업 승인 필요\n\n0.1.1-1627\n\n- UI 구성 요소를 0.20.17로 업데이트: 터치 화면에서 컨트롤의 탭 영역이 페이지를 가로로 스크롤하지 않으며, 오버레이를 닫으면 연 버튼으로 포커스가 돌아가고, 낮은 화면에서는 설정 행이 간결하게 유지됩니다\n- x86_64, aarch64, armv7은 0.1.1-1626의 변경되지 않은 런타임, executor, root 프로그램을 재사용합니다\n- 설정과 저장된 스캔 보고서는 유지되며 시스템 작업 승인 상태는 변경되지 않습니다"
        de: "0.1.1-1629\n\n- Einfrieren beim erneuten Einblenden der Kopfzeile auf dem Smartphone beheben und die Kopfzeile über dem Seiteninhalt halten\n- Smartphone-Werkzeugleiste und Schaltflächen der Einstellungen verbessern\n- Schreibgeschützte Prüfungen der Systemaufgaben im Speicher protokollieren, ohne Festplatten aufzuwecken\n- SDK/App auf 0.53.6 und UI auf 0.23.7 aktualisieren; Einstellungen und Scanberichte beibehalten\n\n0.1.1-1628\n\n- Reclaim im Smartphone-Layout von Package Land ohne aktiviertes Anwendungsportal öffnen; Administratorzugriff, Einstellungen und Scanberichte bleiben erhalten\n- Systemaufgaben beim ersten Start direkt über den Smartphone-Einstieg freigeben\n- Minimierte öffentliche Frontend-Bundles ohne Source Maps verwenden; alle App-Daten erfordern eine Administratorsitzung\n- Aktualisierte Systemaufgaben nach dem Upgrade freigeben\n\n0.1.1-1627\n\n- UI-Komponenten auf 0.20.17 aktualisiert: Auf Touchscreens lässt die Tippfläche eines Steuerelements die Seite nicht mehr seitwärts scrollen, Overlays geben den Fokus an die Schaltfläche zurück, die sie geöffnet hat, und niedrige Bildschirme behalten kompakte Einstellungszeilen\n- Unveränderte Laufzeit, Executor und Root-Programme aus 0.1.1-1626 werden für x86_64, aarch64 und armv7 wiederverwendet\n- Einstellungen und gespeicherte Scanberichte bleiben erhalten; die Freigabe der Systemaufgaben ist unverändert"
        fr: "0.1.1-1629\n\n- Corriger le blocage au retour de l’en-tête sur téléphone et le maintenir au-dessus du contenu\n- Améliorer la barre d’outils mobile et les boutons des réglages\n- Conserver en mémoire les journaux des vérifications en lecture seule pour éviter de réveiller les disques\n- Mettre à jour SDK/App vers 0.53.6 et UI vers 0.23.7 en conservant les réglages et rapports d’analyse\n\n0.1.1-1628\n\n- Ouvrir Reclaim dans l’interface mobile de Package Land sans activer le Portail des applications, en conservant l’accès administrateur, les réglages et les rapports d’analyse\n- Approuver les tâches système directement depuis l’entrée mobile au premier lancement\n- Utiliser des fichiers frontend publics minifiés sans source maps ; toutes les données de l’application nécessitent une session administrateur\n- Approuvez les tâches système mises à jour après la mise à niveau\n\n0.1.1-1627\n\n- Composants UI mis à jour vers 0.20.17 : sur un écran tactile, la zone de pression d’un contrôle ne fait plus défiler la page latéralement, les superpositions rendent le focus au bouton qui les a ouvertes et les écrans bas gardent des lignes de réglage compactes\n- Le runtime, l’executor et les programmes root inchangés de 0.1.1-1626 sont réutilisés pour x86_64, aarch64 et armv7\n- Les réglages et les rapports d’analyse enregistrés sont conservés ; l’approbation des tâches système est inchangée"
        es: "0.1.1-1629\n\n- Corregir el bloqueo al reaparecer la cabecera en el teléfono y mantenerla por encima del contenido\n- Mejorar la barra de herramientas del teléfono y los botones de ajustes\n- Registrar en memoria las comprobaciones de tareas del sistema de solo lectura para evitar activar los discos\n- Actualizar SDK/App a 0.53.6 y UI a 0.23.7 conservando los ajustes y los informes de análisis\n\n0.1.1-1628\n\n- Abrir Reclaim con el diseño para teléfonos de Package Land sin activar el Portal de aplicaciones, conservando el acceso de administrador, los ajustes y los informes de análisis\n- Aprobar las tareas del sistema directamente desde la entrada móvil en el primer inicio\n- Usar archivos frontend públicos minificados sin mapas de código fuente; todos los datos de la aplicación requieren una sesión de administrador\n- Apruebe las tareas del sistema actualizadas después de actualizar\n\n0.1.1-1627\n\n- Componentes de UI actualizados a 0.20.17: en una pantalla táctil, el área de toque de un control ya no desplaza la página en horizontal, las capas devuelven el foco al botón que las abrió y las pantallas bajas mantienen filas de ajustes compactas\n- Se reutilizan el runtime, el executor y los programas root sin cambios de 0.1.1-1626 para x86_64, aarch64 y armv7\n- Se conservan los ajustes y los informes de análisis guardados; la aprobación de las tareas del sistema no cambia"
        it: "0.1.1-1629\n\n- Correggere il blocco quando ricompare l’intestazione sul telefono e mantenerla sopra il contenuto\n- Migliorare la barra degli strumenti del telefono e i pulsanti delle impostazioni\n- Registrare in memoria i controlli di sola lettura delle attività di sistema per non riattivare i dischi\n- Aggiornare SDK/App a 0.53.6 e UI a 0.23.7 mantenendo impostazioni e rapporti di scansione\n\n0.1.1-1628\n\n- Aprire Reclaim nel layout per telefoni di Package Land senza attivare il Portale applicazioni, mantenendo l’accesso amministratore, le impostazioni e i rapporti di scansione\n- Approvare le attività di sistema direttamente dall’accesso mobile al primo avvio\n- Usare bundle frontend pubblici minimizzati senza source map; tutti i dati dell’app richiedono una sessione amministratore\n- Approvare le attività di sistema aggiornate dopo l’aggiornamento\n\n0.1.1-1627\n\n- Componenti UI aggiornati a 0.20.17: su uno schermo touch l’area di tocco di un controllo non fa più scorrere la pagina lateralmente, le sovrapposizioni restituiscono il focus al pulsante che le ha aperte e gli schermi bassi mantengono righe delle impostazioni compatte\n- Runtime, executor e programmi root invariati di 0.1.1-1626 vengono riutilizzati per x86_64, aarch64 e armv7\n- Impostazioni e report di analisi salvati vengono conservati; l’approvazione delle attività di sistema resta invariata"
