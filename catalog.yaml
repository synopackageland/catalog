      changelog:
        en: |-
          0.1.1-1622

          - Resume paused scans without losing progress on unchanged data
          - Keep saved reports and settings after upgrading
          - Update SDK and App to 0.50.15 and UI to 0.20.12
        zh-TW: |-
          0.1.1-1622

          - 暫停後繼續掃描，未變更的部分不會重新計算
          - 升級後保留已儲存的報告與設定
          - 更新 SDK 與 App 至 0.50.15、UI 至 0.20.12
        zh-CN: |-
          0.1.1-1622

          - 暂停后继续扫描，未变更的部分不会重新计算
          - 升级后保留已保存的报告和设置
          - 更新 SDK 与 App 至 0.50.15、UI 至 0.20.12
        de: |-
          0.1.1-1622

          - Pausierte Scans fortsetzen, ohne den Fortschritt bei unveränderten Daten zu verlieren
          - Gespeicherte Berichte und Einstellungen nach dem Upgrade behalten
          - SDK und App auf 0.50.15 und UI auf 0.20.12 aktualisieren
        fr: |-
          0.1.1-1622

          - Reprendre les analyses en pause sans perdre la progression sur les données inchangées
          - Conserver les rapports et réglages après la mise à niveau
          - Mise à jour du SDK et de l’App vers 0.50.15 et de l’UI vers 0.20.12
        ja: |-
          0.1.1-1622

          - 一時停止したスキャンを再開しても、変更のないデータの進捗を保持
          - アップグレード後も保存済みレポートと設定を保持
          - SDK と App を 0.50.15、UI を 0.20.12 に更新
        ko: |-
          0.1.1-1622

          - 일시 중지한 스캔을 재개해도 변경되지 않은 데이터의 진행률 유지
          - 업그레이드 후에도 저장된 보고서와 설정 유지
          - SDK와 App을 0.50.15, UI를 0.20.12로 업데이트
        es: |-
          0.1.1-1622

          - Reanudar análisis en pausa sin perder el progreso de los datos sin cambios
          - Conservar los informes y la configuración tras actualizar
          - Actualizar el SDK y la App a 0.50.15 y la UI a 0.20.12
        it: |-
          0.1.1-1622

          - Riprendi le scansioni in pausa senza perdere i progressi sui dati invariati
          - Mantieni report e impostazioni salvati dopo l’aggiornamento
          - Aggiorna SDK e App a 0.50.15 e UI a 0.20.12
