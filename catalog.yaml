          0.5.1-0001:
            en:
              - Upgrade to upstream Ovis 0.5.1 with conversation, terminal and mobile fixes
              - Find SSH PCs under Devices and PCs > Add a connection > SSH
              - Preserve SSH keys, aliases and workspaces while repairing container account and home
                ownership
              - Rebuild both architectures with SDK 0.53.9 and CLI 0.52.6; retain DSM administrator
                sign-in
            zh-TW:
              - 升級至上游 Ovis 0.5.1，改善對話、終端機與行動裝置體驗
              - 在 Devices and PCs > Add a connection > SSH 尋找 SSH 電腦
              - 修正容器帳號與家目錄擁有者，保留 SSH 金鑰、別名與工作區
              - 使用 SDK 0.53.9 與 CLI 0.52.6 重建兩架構，沿用 DSM 管理員登入
            zh-CN:
              - 升级至上游 Ovis 0.5.1，改善对话、终端与移动设备体验
              - 在 Devices and PCs > Add a connection > SSH 查找 SSH 电脑
              - 修复容器账户与主目录所有者，保留 SSH 密钥、别名和工作区
              - 使用 SDK 0.53.9 与 CLI 0.52.6 重建两种架构，沿用 DSM 管理员登录
            de:
              - Auf Ovis 0.5.1 mit Korrekturen für Gespräche, Terminal und Mobilgeräte aktualisieren
              - SSH-PCs unter Devices and PCs > Add a connection > SSH finden
              - Containerkonto und Home-Eigentümer korrigieren; SSH-Schlüssel, Aliase und
                Arbeitsbereiche behalten
              - Beide Architekturen mit SDK 0.53.9 und CLI 0.52.6 neu bauen;
                DSM-Administratoranmeldung beibehalten
            fr:
              - Passer à Ovis 0.5.1 avec des corrections des conversations, du terminal et de
                l’affichage mobile
              - Retrouver les PC SSH dans Devices and PCs > Add a connection > SSH
              - Corriger le compte du conteneur et la propriété du dossier personnel en conservant
                clés SSH, alias et espaces de travail
              - Reconstruire les deux architectures avec SDK 0.53.9 et CLI 0.52.6, avec connexion
                administrateur DSM
            ja:
              - 上流 Ovis 0.5.1 に更新し、会話、ターミナル、モバイルの問題を修正
              - SSH 接続先は Devices and PCs > Add a connection > SSH に移動
              - コンテナのアカウントとホームの所有権を修正し、SSH 鍵、別名、ワークスペースを保持
              - SDK 0.53.9 と CLI 0.52.6 で両アーキテクチャを再ビルドし、DSM 管理者ログインを維持
            ko:
              - 업스트림 Ovis 0.5.1로 업데이트하여 대화, 터미널 및 모바일 문제 수정
              - Devices and PCs > Add a connection > SSH에서 SSH PC 찾기
              - 컨테이너 계정과 홈 소유권을 수정하면서 SSH 키, 별칭 및 작업 공간 유지
              - SDK 0.53.9와 CLI 0.52.6으로 두 아키텍처를 다시 빌드하고 DSM 관리자 로그인 유지
            es:
              - Actualizar a Ovis 0.5.1 con correcciones de conversaciones, terminal y dispositivos
                móviles
              - Encontrar los PC SSH en Devices and PCs > Add a connection > SSH
              - Corregir la cuenta del contenedor y la propiedad del directorio personal conservando
                claves SSH, alias y espacios de trabajo
              - Reconstruir ambas arquitecturas con SDK 0.53.9 y CLI 0.52.6 y mantener el acceso de
                administrador DSM
            it:
              - Aggiornare a Ovis 0.5.1 con correzioni per conversazioni, terminale e dispositivi
                mobili
              - Trovare i PC SSH in Devices and PCs > Add a connection > SSH
              - Correggere l’account del contenitore e la proprietà della home mantenendo chiavi
                SSH, alias e spazi di lavoro
              - Ricostruire entrambe le architetture con SDK 0.53.9 e CLI 0.52.6 mantenendo
                l’accesso amministratore DSM
          0.4.22-0006:
            en:
              - First public DSM release of Ovis 0.4.22 with administrator sign-in, an isolated
                container runtime, bundled herdr, common shell tools and Python, and persistent
                workspace data
            zh-TW:
              - 首次公開發佈 Ovis 0.4.22 DSM 套件，提供管理員登入、獨立容器執行環境、內附 herdr、常用 shell 工具與 Python，並保留工作區資料
            zh-CN:
              - 首次公开发布 Ovis 0.4.22 DSM 套件，提供管理员登录、独立容器运行环境、内含 herdr、常用 shell 工具和 Python，并保留工作区数据
            de:
              - Erste öffentliche DSM-Version von Ovis 0.4.22 mit Administratoranmeldung, isolierter
                Container-Laufzeit, herdr, gängigen Shell-Werkzeugen, Python und dauerhaft
                gespeicherten Arbeitsbereichsdaten
            fr:
              - Première version publique DSM d'Ovis 0.4.22 avec connexion administrateur,
                environnement conteneurisé isolé, herdr, outils shell courants, Python et données
                d'espace de travail persistantes
            ja:
              - Ovis 0.4.22 の DSM
