            - "On a phone, the page background, cards and nested panels now match the desktop look"
            zh-TW:
            - "手機版的頁面底色、卡片與巢狀面板現在與桌面版一致"
            zh-CN:
            - "手机版的页面底色、卡片与嵌套面板现在与桌面版一致"
            ja:
            - "スマホ版のページ背景、カード、入れ子のパネルがデスクトップ版と同じ見た目になりました"
            ko:
            - "휴대폰에서 페이지 배경, 카드, 중첩 패널이 데스크톱과 같은 모양으로 표시됨"
            de:
            - "Auf dem Smartphone sehen Seitenhintergrund, Karten und verschachtelte Bereiche jetzt wie am Desktop aus"
            fr:
            - "Sur téléphone, le fond de page, les cartes et les panneaux imbriqués ont désormais le même aspect que sur ordinateur"
            es:
            - "En el teléfono, el fondo de la página, las tarjetas y los paneles anidados ahora se ven igual que en el escritorio"
            it:
            - "Sul telefono, lo sfondo della pagina, le schede e i pannelli annidati ora hanno lo stesso aspetto del desktop"
          0.1.1-1673:
            en:
            - "Fits phone screens better: tabs scroll instead of getting cut off, chart amounts are never cut, lists line up, the duplicates summary keeps its width with its button below, and the status button sits in the top bar"
            zh-TW:
            - "手機畫面更合身：分頁改為橫向捲動、不再被切掉，圖例數值不再被截斷，清單各列對齊，重複內容摘要維持寬度、按鈕移到下一行，狀態按鈕移到頂端列"
            zh-CN:
            - "手机画面更合身：标签页改为横向滚动、不再被切掉，图例数值不再被截断，列表各行对齐，重复内容摘要保持宽度、按钮移到下一行，状态按钮移到顶端栏"
            ja:
            - "スマホ画面に合わせて調整：タブは横スクロールになり切れず、凡例の数値は省略されず、リストの行がそろい、重複の概要は幅を保ってボタンを次の行へ、状態ボタンは上部バーに表示"
            ko:
            - "휴대폰 화면에 더 잘 맞춤: 탭은 잘리지 않고 가로로 스크롤되며, 범례 값은 잘리지 않고, 목록 행이 정렬되며, 중복 요약은 너비를 유지하고 버튼은 다음 줄로, 상태 버튼은 상단 바에 표시"
            de:
            - "Passt besser auf Smartphones: Tabs scrollen statt abgeschnitten zu werden, Werte in der Legende werden nie gekürzt, Listenzeilen sind bündig, die Duplikat-Übersicht behält ihre Breite mit der Schaltfläche darunter, und die Status-Schaltfläche sitzt in der oberen Leiste"
            fr:
            - "Mieux adapté aux téléphones : les onglets défilent au lieu d’être coupés, les valeurs de la légende ne sont plus tronquées, les lignes des listes sont alignées, le résumé des doublons garde sa largeur avec son bouton en dessous, et le bouton d’état se place dans la barre du haut"
            es:
            - "Se adapta mejor al teléfono: las pestañas se desplazan en lugar de cortarse, los valores de la leyenda ya no se recortan, las filas de las listas se alinean, el resumen de duplicados mantiene su ancho con el botón debajo y el botón de estado va en la barra superior"
            it:
            - "Si adatta meglio al telefono: le schede scorrono invece di essere tagliate, i valori della legenda non vengono più troncati, le righe degli elenchi sono allineate, il riepilogo dei duplicati mantiene la larghezza con il pulsante sotto e il pulsante di stato è nella barra in alto"
          0.1.1-1672:
            en:
            - "Internal interface component update; pages look and work the same"
            zh-TW:
            - "內部介面元件更新，頁面外觀與操作不變"
            zh-CN:
            - "内部界面组件更新，页面外观与操作不变"
            ja:
            - "内部の画面コンポーネントを更新（画面の見た目と操作は変わりません）"
            ko:
            - "내부 화면 구성 요소 업데이트, 페이지 모양과 동작은 같음"
            de:
            - "Interne Aktualisierung der Oberflächenkomponenten; Seiten sehen gleich aus und funktionieren gleich"
            fr:
            - "Mise à jour interne des composants de l’interface ; les pages restent identiques"
            es:
            - "Actualización interna de los componentes de la interfaz; las páginas se ven y funcionan igual"
            it:
            - "Aggiornamento interno dei componenti dell’interfaccia; le pagine restano uguali"
