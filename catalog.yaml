  - publisher: synopackageland
    category: developer
    order: 140
    source:
      kind: github-release
      repo: synopackageland/syno-pkg-magpie
      release: v0.1.3093-0009
      access: public
    metadata:
      maintainer: yetone
      maintainer_url: https://github.com/yetone/magpie
      distributor: Syno Package Land
      distributor_url: https://synopkgland.com/
      contact_email: support@synopkgland.com
      support_email: support@synopkgland.com
      homepage: https://github.com/synopackageland/syno-pkg-magpie
      source_url: https://github.com/synopackageland/syno-pkg-magpie
      issues_url: https://github.com/synopackageland/syno-pkg-magpie/issues
      upstream:
        name: magpie
        url: https://github.com/yetone/magpie
        license: MIT
      license: MIT
      internet: required
      telemetry: none
      description:
        en: Switch every coding agent's model from one panel, with a local gateway that fails over when a
          quota runs out
        zh-TW: 在同一個面板切換每個 coding agent 的模型，本機閘道會在額度用完時自動接手
        zh-CN: 在同一个面板切换每个 coding agent 的模型，本地网关会在额度用完时自动接手
        de: Das Modell jedes Coding-Agents in einem Panel wechseln, mit einem lokalen Gateway, das bei
          erschöpftem Kontingent übernimmt
        fr: Changez le modèle de chaque agent de code depuis un panneau, avec une passerelle locale qui
          prend le relais quand un quota s'épuise
        ja: コーディングエージェントのモデルを 1 つのパネルで切り替え、枠が尽きたらローカルゲートウェイが引き継ぎます
        ko: 코딩 에이전트의 모델을 한 패널에서 바꾸고, 할당량이 떨어지면 로컬 게이트웨이가 이어받아요
        es: Cambia el modelo de cada agente de programación desde un panel, con una pasarela local que
          cambia de proveedor al agotarse una cuota
        it: Cambia il modello di ogni agente di programmazione da un pannello, con un gateway locale che
          passa a un altro servizio quando si esaurisce una quota
      long_description:
        en: >-
          Magpie keeps every coding agent's model in one place. Pick the model for Claude Code,
          Codex, Gemini CLI, OpenCode, Zed and the rest from one list, and magpie writes it into
          that agent's own config.


          This package runs magpie as a DSM package service. Administrators open the panel from the
          DSM main menu after signing in to DSM, and the model gateway serves the LAN on port 3425
          with magpie's own gateway keys, so agents and other machines use it without signing in to
          DSM. Magpie's own updater stays enabled; a new SPK replaces the packaged binary
        zh-TW: >-
          Magpie 把每個 coding agent 的模型集中在一處。從同一份清單挑選 Claude Code、Codex、Gemini CLI、OpenCode、Zed
          等代理要用的模型，magpie 會把它寫進該代理自己的設定檔。


          這個套件把 magpie 以 DSM 套件服務執行：管理員登入 DSM 後從主選單開啟面板，模型的閘道則以 magpie 自己的 gateway key 在 3425
          埠對區域網路提供服務，代理與其他機器不需要登入 DSM。Magpie 本身的更新功能維持啟用；安裝新版 SPK 會取代套件內的執行檔
        zh-CN: >-
          Magpie 把每个 coding agent 的模型集中在一处。从同一份清单挑选 Claude Code、Codex、Gemini CLI、OpenCode、Zed
          等代理要用的模型，magpie 会把它写进该代理自己的配置文件。


          这个套件把 magpie 以 DSM 套件服务运行：管理员登录 DSM 后从主菜单打开面板，模型的网关则以 magpie 自己的 gateway key 在 3425
          端口对局域网提供服务，代理与其他机器不需要登录 DSM。Magpie 自身的更新功能保持启用；安装新版 SPK 会替换包内的可执行文件
        de: >-
          Magpie bündelt das Modell jedes Coding-Agents an einer Stelle. Wählen Sie das Modell für
          Claude Code, Codex, Gemini CLI, OpenCode, Zed und die übrigen aus einer Liste, und magpie
          schreibt es in die eigene Konfiguration des Agents.


          Dieses Paket betreibt magpie als DSM-Paketdienst. Administratoren öffnen das Panel nach
          der DSM-Anmeldung über das DSM-Hauptmenü, und das Modell-Gateway ist im LAN auf Port 3425
          mit magpies eigenen Gateway-Schlüsseln erreichbar, sodass Agents und andere Rechner sich
          nicht bei DSM anmelden müssen. Magpies eigene Aktualisierung bleibt aktiviert; ein neues
          SPK ersetzt die mitgelieferte Programmdatei
        fr: >-
          Magpie réunit le modèle de chaque agent de code au même endroit. Choisissez le modèle de
          Claude Code, Codex, Gemini CLI, OpenCode, Zed et des autres dans une seule liste, et
          magpie l'écrit dans la configuration propre à l'agent.


          Ce paquet exécute magpie comme service de paquet DSM. Les administrateurs ouvrent le
          panneau depuis le menu principal de DSM après s'être connectés, et la passerelle de
          modèles est joignable sur le LAN au port 3425 avec les clés de passerelle de magpie ; les
          agents et les autres machines n'ont donc pas besoin de se connecter à DSM. La mise à jour
          intégrée de Magpie reste activée ; un nouveau SPK remplace le programme fourni
        ja: >-
          magpie はコーディングエージェントのモデルを 1 か所にまとめます。Claude Code、Codex、Gemini CLI、OpenCode、Zed などのモデルを 1
          つの一覧から選ぶと、magpie が各エージェント自身の設定に書き込みます。


          このパッケージは magpie を DSM のパッケージサービスとして動かします。管理者は DSM にサインインしたあとメインメニューからパネルを開き、モデルのゲートウェイは
          magpie 自身のゲートウェイキーでポート 3425 から LAN に提供されるため、エージェントや他のマシンは DSM にサインインする必要がありません。Magpie
          自身の更新機能は有効なままです。新しい SPK をインストールすると同梱の実行ファイルが置き換わります
        ko: >-
          magpie는 모든 코딩 에이전트의 모델을 한곳에 모아요. Claude Code, Codex, Gemini CLI, OpenCode, Zed 등의 모델을 한
          목록에서 고르면 magpie가 각 에이전트의 설정 파일에 기록해요.


          이 패키지는 magpie를 DSM 패키지 서비스로 실행해요. 관리자는 DSM에 로그인한 뒤 메인 메뉴에서 패널을 열고, 모델 게이트웨이는 magpie 자체
          게이트웨이 키로 3425 포트에서 LAN에 제공되므로 에이전트와 다른 컴퓨터는 DSM에 로그인할 필요가 없어요. Magpie 자체 업데이트는 활성화된 상태를
          유지하며 새 SPK를 설치하면 패키지에 포함된 실행 파일이 교체돼요
        es: >-
          Magpie reúne la configuración de modelos de tus agentes de programación. Elige de una
          lista el modelo para Claude Code, Codex, Gemini CLI, OpenCode, Zed y otros, y Magpie lo
          escribe en la configuración de cada agente.


          Este paquete ejecuta Magpie como servicio de DSM. Los administradores abren el panel desde
          el menú principal tras iniciar sesión en DSM. La pasarela de modelos sirve a la red local
          en el puerto 3425 con las claves propias de Magpie, de modo que los agentes y otros
          equipos no necesitan iniciar sesión en DSM. El actualizador de Magpie permanece activado;
          una nueva versión del SPK sustituye el binario incluido
        it: >-
          Magpie riunisce la configurazione dei modelli dei tuoi agenti di programmazione. Scegli da
          un elenco il modello per Claude Code, Codex, Gemini CLI, OpenCode, Zed e altri e Magpie lo
          scrive nella configurazione di ciascun agente.


          Questo pacchetto esegue Magpie come servizio DSM. Gli amministratori aprono il pannello
          dal menu principale dopo l'accesso a DSM. Il gateway dei modelli serve la rete locale
          sulla porta 3425 con le chiavi proprie di Magpie, quindi gli agenti e gli altri computer
          non devono accedere a DSM. Il sistema di aggiornamento di Magpie resta attivo; una nuova
          versione del pacchetto SPK sostituisce il programma incluso
