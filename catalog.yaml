  - recommended: true
    category: utilities
    order: 20
    publisher: synopackageland
    source:
      kind: github-release
      repo: synopackageland/syno-pkg-connect
      release: v0.1.0-0061
      access: private
    metadata:
      contact_email: support@synopkgland.com
      support_email: support@synopkgland.com
      homepage: https://synopkgland.com/
      internet: required
      license: MIT. Bundled Go and npm dependencies keep their own licenses; the full
        notices ship in the package's LICENSES/ folder. The cloudflared,
        Tailscale and NetBird clients are downloaded from their vendors under
        their own licenses. Source code is not public at this time.
      description:
        en: Reach your NAS remotely without opening router ports. Turn Cloudflare Tunnel,
          Tailscale, NetBird or IPv6 direct access on or off from one page
        zh-TW: 不必在路由器開放連接埠，也能從外部連回 NAS。在同一頁啟用或停用 Cloudflare Tunnel、Tailscale、NetBird 與 IPv6 直連
        zh-CN: 无需在路由器开放端口，也能从外部连回 NAS。在同一页启用或停用 Cloudflare Tunnel、Tailscale、NetBird 与 IPv6 直连
        ja: ルーターのポートを開放せずに外部から NAS へ接続できます。Cloudflare Tunnel、Tailscale、NetBird、IPv6 直接接続を 1
          つの画面で有効化・無効化できます
        ko: 라우터 포트를 열지 않고도 외부에서 NAS에 접속해요. Cloudflare Tunnel, Tailscale, NetBird, IPv6 직접 연결을 한
          화면에서 켜고 끌 수 있어요
        de: Greifen Sie aus der Ferne auf Ihr NAS zu, ohne Router-Ports zu öffnen. Cloudflare
          Tunnel, Tailscale, NetBird und IPv6-Direktzugriff lassen sich auf einer Seite ein- und
          ausschalten
        fr: Accédez à votre NAS à distance sans ouvrir de ports sur le routeur. Activez ou
          désactivez Cloudflare Tunnel, Tailscale, NetBird et l’accès direct IPv6 depuis une
          seule page
        es: Acceda a su NAS de forma remota sin abrir puertos en el router. Active o desactive
          Cloudflare Tunnel, Tailscale, NetBird y el acceso directo por IPv6 desde una sola
          página
        it: Raggiungi il NAS da remoto senza aprire porte sul router. Attiva o disattiva
          Cloudflare Tunnel, Tailscale, NetBird e l’accesso diretto IPv6 da un’unica pagina
      long_description:
        en: "Reach your NAS from outside your home network. Manage Cloudflare Tunnel, Tailscale,
          NetBird and IPv6 direct connections from one page, and turn each method on or off
          independently. Cloudflare publishes only the DSM web page; NetBird access follows your
          management server policy. Development preview: connectivity depends on your network
          and provider setup; DSM administrator sign-in is required"
        zh-TW: 從外部網路連回 NAS，在同一頁管理 Cloudflare Tunnel、Tailscale、NetBird 與 IPv6
          直連，並個別啟用或停用。Cloudflare 只公開 DSM 網頁，NetBird 的存取範圍依管理伺服器政策而定。開發預覽版，連線結果依網路與服務設定而異；需 DSM
          管理員登入
      changelog:
        en: >-
          0.1.0-0061

