          App 私有 volume。從 DSM 主選單透過 OIDC 登入；一般使用者與管理員取得個別 Paperless
          帳號及對應角色，文件擁有權與分享依 Paperless 權限。DSM 登出、刪除帳號與角色變更不會即時撤銷既有 App session 或
          API token；刪除 DSM 帳號不會自動刪除 Paperless 帳號。首次啟動會透過 HTTPS 下載並驗證固定版本的中文 OCR
          模型；實體行動用戶端、Tika 與 Gotenberg 不在驗證範圍。


          需 x86_64、DSM 7.2.1 或以上與 Container Manager。使用正式 CLI/templates/SDK/App
