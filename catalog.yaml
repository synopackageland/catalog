        ja: お気に入りのサイトのニュースや更新をひとつのリーダーにまとめます。RSS や Atom
          フィードを購読し、カテゴリーで整理し、記事を検索し、お気に入りを保存できます。購読と既読状況は読者ごとに分かれます。DSM の管理者サインインと Container Manager
