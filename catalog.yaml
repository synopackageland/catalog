  - recommended: true
    category: utilities
    order: 20
    publisher: synopackageland
    source:
      kind: github-release
      repo: synopackageland/syno-pkg-connect
      release: v0.1.0-0104
      access: private
    metadata:
      maintainer: Syno Package Land
      maintainer_url: https://synopkgland.com/
      contact_email: support@synopkgland.com
      support_email: support@synopkgland.com
      homepage: https://synopkgland.com/
      internet: required
      license: MIT. Bundled Go and npm dependencies keep their own licenses; the full
        notices ship in the package's LICENSES/ folder. The cloudflared,
        Tailscale and NetBird clients are downloaded from their vendors under
        their own licenses. Source code is not public at this time.
      description:
        en: Reach your NAS remotely without opening router ports. Turn Cloudflare
          Tunnel, Tailscale, NetBird or IPv6 direct access on or off from one
          page
        zh-TW: 不必在路由器開放連接埠，也能從外部連回 NAS。在同一頁啟用或停用 Cloudflare Tunnel、Tailscale、NetBird 與
          IPv6 直連
        zh-CN: 无需在路由器开放端口，也能从外部连回 NAS。在同一页启用或停用 Cloudflare Tunnel、Tailscale、NetBird 与
          IPv6 直连
        ja: ルーターのポートを開放せずに外部から NAS へ接続できます。Cloudflare Tunnel、Tailscale、NetBird、IPv6
          直接接続を 1 つの画面で有効化・無効化できます
        ko: 라우터 포트를 열지 않고도 외부에서 NAS에 접속해요. Cloudflare Tunnel, Tailscale, NetBird, IPv6
          직접 연결을 한 화면에서 켜고 끌 수 있어요
        de: Greifen Sie aus der Ferne auf Ihr NAS zu, ohne Router-Ports zu öffnen.
          Cloudflare Tunnel, Tailscale, NetBird und IPv6-Direktzugriff lassen
          sich auf einer Seite ein- und ausschalten
        fr: Accédez à votre NAS à distance sans ouvrir de ports sur le routeur. Activez
          ou désactivez Cloudflare Tunnel, Tailscale, NetBird et l’accès direct
          IPv6 depuis une seule page
        es: Acceda a su NAS de forma remota sin abrir puertos en el router. Active o
          desactive Cloudflare Tunnel, Tailscale, NetBird y el acceso directo
          por IPv6 desde una sola página
        it: Raggiungi il NAS da remoto senza aprire porte sul router. Attiva o disattiva
          Cloudflare Tunnel, Tailscale, NetBird e l’accesso diretto IPv6 da
          un’unica pagina
      long_description:
        en: >-
          Reach your NAS remotely without opening router ports


          - Follow a four-step wizard to choose a way, connect it, select Apps
          and open their links

          - Use a free workers.dev link, your own Cloudflare domain or a private
          network

          - See connections and items needing attention in the home topology

          - Manage each App and its links in one dialog


          - Add custom web Apps by URL or from detected NAS services, with DSM
          sign-in on by default


          Sign in with a DSM administrator account
        zh-TW: |-
          不必在路由器開放連接埠，也能從外部連回 NAS

          - 四步驟精靈引導選擇方式、連線、選擇 App 並開啟連結
          - 使用免費 workers.dev 連結、自有 Cloudflare 網域或私人網路
          - 首頁拓樸呈現連線狀態與待處理項目
          - 在單一對話框管理每個 App 與連結

          - 以 URL 或 NAS 偵測清單新增自訂網頁 App，預設先要求 DSM 登入

          需使用 DSM 管理員帳號登入
        zh-CN: |-
          不必在路由器开放连接端口，也能从外部连回 NAS

          - 四步骤向导引导选择方式、连接、选择 App 并打开链接
          - 使用免费 workers.dev 链接、自有 Cloudflare 域名或私人网络
          - 首页拓朴呈现连接状态与待处理项目
          - 在单一对话框管理每个 App 与链接

          - 以 URL 或 NAS 检测清单添加自订网页 App，默认先要求 DSM 登录

          需使用 DSM 管理员帐号登录
        de: |-
          Erreiche dein NAS von unterwegs, ohne Ports am Router zu öffnen

          - Ein Assistent in vier Schritten: Weg wählen, verbinden, Apps auswählen und ihre Links öffnen
          - Nutze einen kostenlosen workers.dev-Link, deine eigene Cloudflare-Domain oder ein privates Netzwerk
          - Sieh Verbindungen und offene Punkte in der Übersichtstopologie
          - Verwalte jede App und ihre Links in einem Dialog

          - Füge eigene Web-Apps per URL oder aus erkannten NAS-Diensten hinzu, mit DSM-Anmeldung standardmäßig an

          Melde dich mit einem DSM-Administratorkonto an
        fr: |-
          Accédez à votre NAS à distance sans ouvrir de ports sur le routeur

          - Un assistant en quatre étapes : choisir une méthode, la connecter, sélectionner les Apps et ouvrir leurs liens
          - Utilisez un lien workers.dev gratuit, votre propre domaine Cloudflare ou un réseau privé
          - Voyez les connexions et les points à traiter dans la topologie d'accueil
          - Gérez chaque App et ses liens dans une seule fenêtre

          - Ajoutez des Apps web par URL ou depuis les services NAS détectés, avec la connexion DSM activée par défaut

          Connectez-vous avec un compte administrateur DSM
        ja: |-
          ルーターのポートを開けずに、外出先から NAS に接続できます

          - 4 ステップのウィザードで、方法を選んで接続し、アプリを選んでリンクを開けます
          - 無料の workers.dev リンク、独自の Cloudflare ドメイン、プライベート ネットワークに対応
          - ホームのトポロジーで接続状況と対応が必要な項目を確認できます
          - アプリごとのリンクをひとつのダイアログで管理できます

          - URL や検出された NAS サービスからカスタム Web アプリを追加できます。DSM サインインは既定でオンです

          DSM 管理者アカウントでサインインしてください
        ko: |-
          공유기 포트를 열지 않고 밖에서 NAS에 접속해요

          - 4단계 마법사로 방식을 고르고, 연결하고, 앱을 선택해 링크를 열어요
          - 무료 workers.dev 링크, 내 Cloudflare 도메인, 사설 네트워크 중에서 골라요
          - 홈 토폴로지에서 연결 상태와 확인이 필요한 항목을 봐요
          - 앱마다 링크를 대화 상자 하나에서 관리해요

          - URL이나 감지된 NAS 서비스로 사용자 지정 웹 앱을 추가해요. DSM 로그인은 기본으로 켜져 있어요

          DSM 관리자 계정으로 로그인하세요
      changelog:
        en: |-
          0.1.0-0104

          - Rebuild with frontend and Go SDK 0.38.5; keep UI 0.17.14
          - Use shared AppShell fixes for the account row, icon sign-out, main clipping and empty-slot fill
        zh-TW: |-
          0.1.0-0104

          - 以前端與 Go SDK 0.38.5 重建，UI 維持 0.17.14
          - 使用共用 AppShell 的單列帳號、圖示登出、主區裁切與空插槽填滿修正
        zh-CN: |-
          0.1.0-0104

          - 以前端与 Go SDK 0.38.5 重建，UI 保持 0.17.14
          - 使用共享 AppShell 的单行账号、图标登出、主区裁切与空插槽填满修复
        de: |-
          0.1.0-0104

          - Mit Frontend- und Go-SDK 0.38.5 neu erstellt; UI bleibt bei 0.17.14
          - Gemeinsame AppShell-Korrekturen für Kontozeile, Abmeldesymbol, Zuschnitt des Hauptbereichs und leere Slots
        fr: |-
          0.1.0-0104

          - Reconstruit avec les SDK frontend et Go 0.38.5 ; UI reste en 0.17.14
          - Corrections AppShell partagées pour la ligne du compte, la déconnexion par icône, le découpage du contenu principal et les slots vides
        ja: |-
          0.1.0-0104

          - フロントエンドと Go SDK 0.38.5 で再ビルド、UI は 0.17.14 を維持
          - アカウント行、アイコンでのログアウト、メイン領域のクリッピング、空スロットの共通 AppShell 修正を適用
        ko: |-
          0.1.0-0104

          - 프런트엔드 및 Go SDK 0.38.5로 다시 빌드하고 UI 0.17.14는 유지
          - 계정 행, 아이콘 로그아웃, 메인 영역 잘라내기, 빈 슬롯의 공통 AppShell 수정 적용
      screenshots:
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgConnect/01-overview-0104-en.png
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgConnect/02-own-domain-0104-en.png
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgConnect/03-netbird-server-0104-en.png
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgConnect/04-free-link-0104-en.png
        - https://raw.githubusercontent.com/synopackageland/catalog/main/screenshots/SynoPkgConnect/05-settings-0104-en.png
