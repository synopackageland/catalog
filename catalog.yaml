      long_description:
        en: Check whether websites and network services are available, view uptime
          history and receive outage notifications. Create status pages to
          summarize service health; status pages are administrator-only and
          cannot be shared publicly. Available monitor types depend on this
          package's network permissions. App data remains in Container Manager
          volumes after uninstall; DSM administrator sign-in and Container
          Manager are required
        zh-TW: 檢查網站與網路服務是否正常運作、查看歷史紀錄，並在中斷時接收通知。建立狀態頁面，集中呈現服務狀況；狀態頁面僅供管理員存取，無法公開分享。可用的監控類型受本套件網路權限限制。卸載後
          App 資料仍保留於 Container Manager 儲存空間；需 DSM 管理員登入及 Container Manager
        zh-CN: 检查网站与网络服务是否正常运作、查看历史记录，并在中断时接收通知。创建状态页面，集中呈现服务状况；状态页面仅供管理员访问，无法公开分享。可用的监控类型受本套件网络权限限制。卸载后 App 数据仍保留于 Container Manager 存储空间；需 DSM 管理员登录及 Container Manager
        de: Prüfe, ob Websites und Netzwerkdienste erreichbar sind, sieh dir den Verlauf der Verfügbarkeit an und erhalte Benachrichtigungen bei Ausfällen. Erstelle Statusseiten, die den Zustand deiner Dienste zusammenfassen; Statusseiten sind nur für Administratoren und lassen sich nicht öffentlich teilen. Welche Monitortypen verfügbar sind, hängt von den Netzwerkberechtigungen dieses Pakets ab. App-Daten bleiben nach der Deinstallation in Volumes von Container Manager; DSM-Anmeldung als Administrator und Container Manager sind erforderlich
        fr: Vérifiez que vos sites web et services réseau sont disponibles, consultez l'historique de disponibilité et recevez des notifications en cas de panne. Créez des pages d'état qui résument la santé de vos services ; elles sont réservées aux administrateurs et ne peuvent pas être partagées publiquement. Les types de sondes disponibles dépendent des autorisations réseau de ce paquet. Les données de l'App restent dans les volumes de Container Manager après la désinstallation ; connexion DSM en tant qu'administrateur et Container Manager requis
        ja: Web サイトやネットワーク サービスが利用できるかを確認し、稼働履歴を見て、停止時に通知を受け取れます。サービスの状態をまとめたステータス ページを作成できますが、ステータス ページは管理者専用で、一般公開はできません。使える監視の種類は、このパッケージのネットワーク権限によって変わります。アプリのデータはアンインストール後も Container Manager のボリュームに残ります。DSM の管理者サインインと Container Manager が必要です
        ko: 웹사이트와 네트워크 서비스가 살아 있는지 확인하고, 가동 기록을 보고, 장애가 나면 알림을 받아요. 서비스 상태를 요약한 상태 페이지를 만들 수 있지만, 상태 페이지는 관리자 전용이라 공개로 공유할 수 없어요. 쓸 수 있는 모니터 종류는 이 패키지의 네트워크 권한에 따라 달라요. 앱 데이터는 제거 후에도 Container Manager 볼륨에 남아요. DSM 관리자 로그인과 Container Manager가 필요해요
