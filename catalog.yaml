  - category: utilities
    order: 30
    publisher: synopackageland
    source:
      kind: github-release
      repo: synopackageland/syno-pkg-gopeed
      release: v0.2.2-0034
      access: private
    metadata:
      contact_email: synopackageland@gmail.com
      support_email: synopackageland@gmail.com
      homepage: https://www.varvis.me
      source_url: https://packages.varvis.me/src/synopackageland/syno-pkg-gopeed/
      license: GPL-3.0-or-later
      long_description:
        en: |-
          Download Hub: per-user downloads powered by the official Gopeed engine, with DSM Application Privileges and administrator-managed core updates.

          Each DSM user has their own downloads, destinations and history; administrators cannot operate other users' tasks. Who can use the app is set in Control Panel > Application Privileges. Completed downloads are saved into the user's chosen shared folder with that user's own DSM permissions.

          Administrators manage download limits, connections, extensions and updates of the official Gopeed core, which are downloaded from the official release and verified before use.

          Licensed under GPL-3.0-or-later; the corresponding source code is available at the source link.
        zh-TW: |-
          下載中心：以官方 Gopeed 引擎為核心、每位使用者各自的下載，透過 DSM 應用程式權限控管，核心更新由管理員管理。

          每位 DSM 使用者有各自的下載、目的地與歷史紀錄，管理員也不能操作別人的工作。可使用本 App 的人員在「控制台 → 權限 → 應用程式權限」設定。下載完成的檔案以該使用者自己的 DSM 權限存到其選擇的共用資料夾。

          下載上限、連線數、擴充套件與官方 Gopeed 核心的更新由管理員管理；更新從官方 Release 下載，並在使用前驗證。

          以 GPL-3.0-or-later 授權；對應原始碼見「原始碼」連結。
      changelog:
        en: |-
          0.2.2-0034
          - Download almost anything to the NAS from one address box: HTTP/HTTPS links, BitTorrent (magnet links, .torrent links and uploaded .torrent files, with file selection), ED2K links and eMule magnets, media pages through yt-dlp (installed by an administrator on the Core updates page), and addresses that Gopeed extensions add.
          - Each DSM user has their own downloads, destination and history; who can use the app is set in Control Panel > Application Privileges.
          - Completed files are saved into the folder the user chose, with that user's own DSM permissions, also after they sign out. An administrator approves background saving once and chooses the shared folders it may use.
          - Administrators manage concurrent downloads, connections, BT seeding and ports, ED2K ports, Gopeed extensions from the official registry, and updates of the official Gopeed core and of yt-dlp, ffmpeg and deno; each update is downloaded and verified before use and can be rolled back.
          - Optional full-page entry through the DSM Application Portal; click a saved file to show it in File Station.
          - Nine languages, DSM 7.1-42661 or later, x86_64 and aarch64.
          - Settings puts background saving first. The downloads list shows state, progress and speed together, and confirmations use DSM styling. Open in File Station selects the saved file.
          - When the package stops or starts, the page shows its state and continues on its own once it runs. Extensions can update while downloads are paused, and the download engine cleans up temporary copies of links on start and stop.
          - The executor checks scheduler tasks in the background. A fresh, ready result lets an administrator open the App without separate scheduler calls.
        zh-TW: |-
          0.2.2-0034
          - 一個輸入框就能把幾乎任何東西下載到 NAS：HTTP／HTTPS 連結、BitTorrent（磁力連結、.torrent 連結與上傳的 .torrent 檔，可選擇檔案）、ED2K 連結與 eMule 磁力連結、yt-dlp 支援的影音網頁（由管理員在「核心更新」頁安裝 yt-dlp），以及 Gopeed 擴充套件新增的位址。
          - 每位 DSM 使用者有各自的下載、目的地與歷史紀錄；可使用本 App 的人員在「控制台 → 權限 → 應用程式權限」設定。
          - 下載完成的檔案以使用者自己的 DSM 權限存到其選擇的資料夾，登出後也會繼續。背景存檔需管理員核准一次，並選定可使用的共用資料夾。
          - 管理員管理同時下載數、連線數、BT 做種與連接埠、ED2K 連接埠、從官方清單安裝的 Gopeed 擴充套件，以及官方 Gopeed 核心與 yt-dlp、ffmpeg、deno 的更新；每次更新都在使用前下載並驗證，並可退回上一版。
          - 可透過 DSM 應用程式入口以整頁開啟；點已存的檔案可在 File Station 中顯示。
          - 九種語言，DSM 7.1-42661 以上，x86_64 與 aarch64。
          - 設定頁以背景存檔為首；下載清單並列狀態、進度與速度，確認視窗採 DSM 樣式；「在 File Station 中開啟」會選取已存檔案。
          - 套件停止或啟動時，頁面顯示目前狀態，並在啟動完成後自動繼續；下載暫停時仍可更新擴充套件，下載核心會在啟動與停止時清理讀取連結的暫存副本。
          - 執行器在背景核對排程任務；核對結果有效且就緒時，管理員可直接開啟 App，無須另外呼叫排程 API。
