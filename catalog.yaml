    info:
      displayname: Ovis
      description: Herdr's coding agents in your browser and on your phone, served from your NAS.
      os_min_ver: 7.2.1-69057
    metadata:
      maintainer: devswha
      maintainer_url: https://github.com/devswha/ovis
      distributor: Syno Package Land
      distributor_url: https://synopkgland.com/
      contact_email: support@synopkgland.com
      support_email: support@synopkgland.com
      homepage: https://ovis.sh/
      source_url: https://github.com/synopackageland/syno-pkg-land-ovis/tree/v0.5.1-0001
      issues_url: https://github.com/synopackageland/syno-pkg-land-ovis/issues
      license: MIT
      upstream:
        name: Ovis
        url: https://github.com/devswha/ovis
        license: MIT
      internet: required
      telemetry: opt-in
      description:
        en: Use herdr workspaces, coding agents and terminals from your browser or phone. On a NAS with less
          than 4 GB of memory, run agents on another computer or use a lightweight one such as Pi
        zh-TW: 透過瀏覽器或手機使用 herdr 工作區、coding agent 與終端機。記憶體少於 4 GB 的 NAS 建議在其他電腦執行 agent，或改用 Pi 等輕量 agent
        zh-CN: 通过浏览器或手机使用 herdr 工作区、coding agent 和终端。内存少于 4 GB 的 NAS 建议在其他电脑运行 agent，或改用 Pi 等轻量 agent
        de: herdr-Arbeitsbereiche, Coding-Agenten und Terminals im Browser oder auf dem Smartphone nutzen.
          Auf einem NAS mit weniger als 4 GB Arbeitsspeicher Agenten besser auf einem anderen
          Computer ausführen oder einen schlanken wie Pi nutzen
        fr: Accédez aux espaces de travail, agents de code et terminaux herdr depuis votre navigateur ou
          téléphone. Sur un NAS doté de moins de 4 Go de mémoire, exécutez les agents sur un autre
          ordinateur ou choisissez-en un léger comme Pi
        ja: ブラウザーやスマートフォンから herdr のワークスペース、コーディングエージェント、ターミナルを利用。メモリが 4 GB 未満の NAS
          では、別のコンピューターでエージェントを実行するか、Pi のような軽量なエージェントをお使いください
        ko: 브라우저나 휴대폰에서 herdr 작업 공간, 코딩 에이전트, 터미널 사용. 메모리가 4 GB 미만인 NAS에서는 다른 컴퓨터에서 에이전트를 실행하거나 Pi 같은 가벼운
          에이전트를 사용하세요
        es: Usa espacios de trabajo, agentes de código y terminales de herdr desde tu navegador o teléfono.
          En un NAS con menos de 4 GB de memoria, ejecuta los agentes en otro equipo o usa uno
          ligero como Pi
        it: Usa spazi di lavoro, agenti di coding e terminali herdr dal browser o dal telefono. Su un NAS
          con meno di 4 GB di memoria, esegui gli agenti su un altro computer o usane uno leggero
          come Pi
      long_description:
        en: "Bring herdr workspaces, agent conversations, prompts, approvals and live terminals to your
          browser or phone. Connect other computers over SSH, or run shells and agents inside the
          App's own container with bundled herdr, Bun, Node.js, common command-line tools and
          Python. We recommend using Ovis as a control center for agents on other computers you add
          with Add PC, especially on a NAS with less than 4 GB of memory: Codex and Claude Code need
          a lot of memory and can slow down the whole NAS. To run an agent in the container, choose
          a lightweight one such as Pi. Requires DSM 7.2.1 or later, Container Manager and DSM
          administrator sign-in; all administrators share one Ovis identity. The pinned container
          image is downloaded separately. Data volumes remain after uninstall. Relay and Portal are
          disabled; anonymous usage counts are off by default and can be enabled in Settings"
        zh-TW: 在瀏覽器或手機上使用 herdr 工作區、agent 對話、提示、核准與即時終端機。可透過 SSH 連接其他電腦，或在 App 專用容器內執行 shell 與 agent，內附
          herdr、Bun、Node.js、常用命令列工具及 Python。建議將 Ovis 作為控制中心，用 Add PC 加入其他電腦並在那裡執行 agent，記憶體少於 4 GB 的
          NAS 尤其建議這樣使用：Codex 與 Claude Code 耗用大量記憶體，可能讓整台 NAS 變慢。若要在容器內執行 agent，請選用 Pi 等輕量 agent。需要
          DSM 7.2.1 以上、Container Manager 與 DSM 管理員登入；所有管理員共用同一個 Ovis 身分。安裝時另行下載固定版本的容器映像。卸載後保留資料
          volume。Relay 與 Portal 已停用；匿名使用統計預設關閉，可在設定中開啟
        zh-CN: 在浏览器或手机上使用 herdr 工作区、agent 对话、提示、批准和实时终端。可通过 SSH 连接其他电脑，或在 App 专用容器内运行 shell 和 agent，内含
          herdr、Bun、Node.js、常用命令行工具及 Python。建议将 Ovis 作为控制中心，用 Add PC 添加其他电脑并在那里运行 agent，内存少于 4 GB 的
          NAS 尤其建议这样使用：Codex 和 Claude Code 占用大量内存，可能让整台 NAS 变慢。如需在容器内运行 agent，请选用 Pi 等轻量 agent。需要
          DSM 7.2.1 及以上、Container Manager 和 DSM 管理员登录；所有管理员共用同一个 Ovis
          身份。安装时另行下载固定版本的容器镜像。卸载后保留数据卷。Relay 和 Portal 已禁用；匿名使用统计默认关闭，可在设置中开启
        de: "Nutze herdr-Arbeitsbereiche, Agenten-Chats, Eingabeaufforderungen, Freigaben und Live-Terminals
          im Browser oder auf dem Smartphone. Verbinde andere Computer per SSH oder starte Shells
          und Agenten im eigenen App-Container mit herdr, Bun, Node.js, gängigen
          Kommandozeilenwerkzeugen und Python. Wir empfehlen, Ovis als Steuerzentrale für Agenten
          auf anderen Computern zu nutzen, die du mit Add PC hinzufügst, vor allem auf einem NAS mit
          weniger als 4 GB Arbeitsspeicher: Codex und Claude Code brauchen viel Arbeitsspeicher und
          können das ganze NAS verlangsamen. Wenn du einen Agenten im Container ausführen möchtest,
          wähle einen schlanken wie Pi. DSM ab 7.2.1, Container Manager und eine
          DSM-Administratoranmeldung sind erforderlich; alle Administratoren teilen eine
          Ovis-Identität. Das festgelegte Container-Image wird separat heruntergeladen. Datenvolumes
          bleiben nach der Deinstallation erhalten. Relay und Portal sind deaktiviert; anonyme
          Nutzungsstatistiken sind standardmäßig aus und können in den Einstellungen aktiviert
          werden"
        fr: "Retrouvez les espaces herdr, conversations d'agents, invites, approbations et terminaux en
          direct sur navigateur ou téléphone. Connectez d'autres ordinateurs en SSH, ou exécutez
          shells et agents dans le conteneur de l'App avec herdr, Bun, Node.js, les outils de ligne
          de commande courants et Python. Nous recommandons d'utiliser Ovis comme centre de contrôle
          pour des agents exécutés sur d'autres ordinateurs ajoutés avec Add PC, surtout sur un NAS
          doté de moins de 4 Go de mémoire : Codex et Claude Code consomment beaucoup de mémoire et
          peuvent ralentir tout le NAS. Pour exécuter un agent dans le conteneur, choisissez-en un
          léger comme Pi. DSM 7.2.1 ou ultérieur, Container Manager et une connexion administrateur
          DSM sont requis ; tous les administrateurs partagent une identité Ovis. L'image de
          conteneur épinglée est téléchargée séparément. Les volumes de données restent après la
          désinstallation. Relay et Portal sont désactivés ; les statistiques anonymes sont
          désactivées par défaut et peuvent être activées dans les paramètres"
        ja: herdr のワークスペース、エージェントとの会話、プロンプト、承認、ライブターミナルをブラウザーやスマートフォンで利用できます。SSH
          で別のコンピューターに接続するほか、herdr、Bun、Node.js、一般的なコマンドラインツール、Python
          を備えた専用コンテナー内でシェルやエージェントを実行できます。Ovis はコントロールセンターとして使い、Add PC
          で追加した別のコンピューターでエージェントを実行することをおすすめします。メモリが 4 GB 未満の NAS では特にそうしてください。Codex や Claude Code
          は多くのメモリを使い、NAS 全体の動作が遅くなることがあります。コンテナー内でエージェントを実行する場合は、Pi のような軽量なエージェントを選んでください。DSM 7.2.1
          以降、Container Manager、DSM 管理者サインインが必要で、すべての管理者が一つの Ovis ID
          を共有します。固定されたコンテナーイメージは別途ダウンロードされます。データボリュームはアンインストール後も残ります。Relay と Portal
          は無効です。匿名の利用統計は初期状態でオフになっており、設定で有効にできます
        ko: herdr 작업 공간, 에이전트 대화, 프롬프트, 승인, 실시간 터미널을 브라우저나 휴대폰에서 이용하세요. 다른 컴퓨터에 SSH로 연결하거나 herdr, Bun,
          Node.js, 일반 명령줄 도구, Python이 포함된 App 전용 컨테이너에서 셸과 에이전트를 실행할 수 있어요. Ovis는 제어 센터로 쓰고, Add PC로
          추가한 다른 컴퓨터에서 에이전트를 실행하는 것을 권장해요. 메모리가 4 GB 미만인 NAS라면 더욱 그래요. Codex와 Claude Code는 메모리를 많이
          사용해 NAS 전체가 느려질 수 있어요. 컨테이너에서 에이전트를 실행하려면 Pi 같은 가벼운 에이전트를 선택하세요. DSM 7.2.1 이상, Container
          Manager, DSM 관리자 로그인이 필요하며 모든 관리자가 하나의 Ovis 계정을 공유해요. 고정된 컨테이너 이미지는 별도로 다운로드돼요. 제거 후에도 데이터
          볼륨은 남아요. Relay와 Portal은 꺼져 있어요. 익명 사용 통계는 기본적으로 꺼져 있으며 설정에서 켤 수 있어요
        es: "Accede a espacios herdr, conversaciones de agentes, indicaciones, aprobaciones y terminales en
          directo desde el navegador o el teléfono. Conecta otros equipos por SSH o ejecuta shells y
          agentes en el contenedor de la App con herdr, Bun, Node.js, herramientas habituales de
          línea de comandos y Python. Te recomendamos usar Ovis como centro de control de agentes
          que se ejecutan en otros equipos añadidos con Add PC, sobre todo en un NAS con menos de 4
          GB de memoria: Codex y Claude Code consumen mucha memoria y pueden ralentizar todo el NAS.
          Para ejecutar un agente en el contenedor, elige uno ligero como Pi. Requiere DSM 7.2.1 o
          posterior, Container Manager e inicio de sesión como administrador de DSM; todos los
          administradores comparten una identidad Ovis. La imagen de contenedor fijada se descarga
          por separado. Los volúmenes de datos se conservan tras desinstalar. Relay y Portal están
          desactivados; las estadísticas anónimas están desactivadas por defecto y se pueden activar
          en los ajustes"
        it: "Accedi a spazi herdr, conversazioni degli agenti, richieste, approvazioni e terminali in tempo
          reale dal browser o dal telefono. Collega altri computer tramite SSH oppure esegui shell e
          agenti nel contenitore dell'App con herdr, Bun, Node.js, i comuni strumenti da riga di
          comando e Python. Ti consigliamo di usare Ovis come centro di controllo per agenti
          eseguiti su altri computer aggiunti con Add PC, soprattutto su un NAS con meno di 4 GB di
          memoria: Codex e Claude Code usano molta memoria e possono rallentare l'intero NAS. Per
          eseguire un agente nel contenitore, scegline uno leggero come Pi. Richiede DSM 7.2.1 o
          successivo, Container Manager e accesso come amministratore DSM; tutti gli amministratori
          condividono un'identità Ovis. L'immagine del contenitore fissata viene scaricata
          separatamente. I volumi dei dati restano dopo la disinstallazione. Relay e Portal sono
          disabilitati; le statistiche anonime sono disattivate per impostazione predefinita e
          possono essere attivate nelle impostazioni"
