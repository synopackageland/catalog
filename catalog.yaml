      description:
        en: See what is filling your Synology NAS and safely free up space
        zh-TW: 看清 Synology NAS 的空間被什麼佔用，安全清出空間
        zh-CN: 看清 Synology NAS 的空间被什么占用，安全清出空间
        ja: Synology NAS の容量を何が使っているかを把握し、安全に空き容量を確保
        ko: Synology NAS 공간을 무엇이 차지하는지 확인하고 안전하게 공간 확보
        de: Sieh, was den Speicher deiner Synology NAS belegt, und gib sicher Platz frei
        fr: Voyez ce qui remplit votre NAS Synology et libérez de l'espace en toute sécurité
        es: Descubre qué ocupa el espacio de tu NAS Synology y libéralo de forma segura
        it: Scopri cosa occupa lo spazio del tuo NAS Synology e liberalo in sicurezza
      long_description:
        en: "Space cleanup for Synology NAS, for Btrfs and ext4 volumes. Scan a volume or chosen folders to
          see what really uses space: shared folders, package data, recycle bins, snapshots and the
          system partition. Reclaim shows how much deleting something would actually free, including
          space still held by snapshots or shared copies, and tracks how usage changes over time.
          Cleanup uses a reviewed plan that is checked again right before anything is deleted. DSM
          administrator sign-in is required; approve the system tasks before using features that
          need them"
        zh-TW: Synology NAS 的空間整理工具，支援 Btrfs 與 ext4
          儲存空間。掃描整個儲存空間或指定資料夾，看清共用資料夾、套件資料、資源回收筒、快照與系統分割區實際佔用多少空間。Reclaim
          會算出刪除後真正能釋放的空間，包含仍被快照或共用副本佔住的部分，並追蹤用量變化。清理前會先列出計畫供確認，實際刪除前再重新檢查一次。需以 DSM
          管理員登入；使用需要系統工作的功能前，須先核准系統工作
        zh-CN: Synology NAS 的空间整理工具，支持 Btrfs 与 ext4
          存储空间。扫描整个存储空间或指定文件夹，看清共享文件夹、套件数据、回收站、快照与系统分区实际占用多少空间。Reclaim
          会算出删除后真正能释放的空间，包含仍被快照或共享副本占用的部分，并追踪用量变化。清理前会先列出计划供确认，实际删除前再重新检查一次。需以 DSM
          管理员登录；使用需要系统任务的功能前，须先批准系统任务
        ja: Synology NAS の容量整理ツール。Btrfs と ext4
          のボリュームに対応。ボリューム全体または指定したフォルダーをスキャンし、共有フォルダー、パッケージデータ、ごみ箱、スナップショット、システムパーティションが実際に使っている容量を確認できます。削除で本当に解放される容量を、スナップショットや共有コピーが保持している分も含めて算出し、使用量の変化も追跡します。クリーンアップは確認済みの計画に沿って行い、削除の直前にもう一度検証します。DSM
          管理者としてのサインインが必要です。システムタスクを必要とする機能を使う前に、タスクを承認してください
        ko: Synology NAS용 공간 정리 도구로 Btrfs와 ext4 볼륨을 지원합니다. 볼륨 전체 또는 선택한 폴더를 스캔해 공유 폴더, 패키지 데이터, 휴지통, 스냅샷,
          시스템 파티션이 실제로 차지하는 공간을 확인합니다. 스냅샷이나 공유 사본이 아직 붙잡고 있는 공간까지 포함해 삭제 시 실제로 확보되는 공간을 계산하고 사용량
          변화도 추적합니다. 정리는 검토한 계획대로 진행하며 삭제 직전에 다시 확인합니다. DSM 관리자 로그인이 필요하며 시스템 작업이 필요한 기능을 사용하기 전에 해당
          작업을 승인해야 해요
        de: "Speicherbereinigung für Synology NAS mit Btrfs- und ext4-Volumes. Scanne ein Volume oder
          ausgewählte Ordner und sieh, was wirklich Platz belegt: freigegebene Ordner, Paketdaten,
          Papierkörbe, Snapshots und die Systempartition. Reclaim zeigt, wie viel das Löschen
          tatsächlich freigibt, auch Platz, den Snapshots oder geteilte Kopien noch halten, und
          verfolgt die Belegung über die Zeit. Bereinigt wird nach einem geprüften Plan, der direkt
          vor dem Löschen erneut kontrolliert wird. Die Anmeldung als DSM-Administrator ist
          erforderlich; Systemaufgaben müssen vor der Nutzung entsprechender Funktionen freigegeben
          werden"
        fr: "Nettoyage de l'espace pour NAS Synology, avec volumes Btrfs et ext4. Analysez un volume ou des
          dossiers choisis pour voir ce qui occupe vraiment l'espace : dossiers partagés, données
          des paquets, corbeilles, instantanés et partition système. Reclaim indique combien une
          suppression libérerait réellement, y compris l'espace encore retenu par des instantanés ou
          des copies partagées, et suit l'évolution de l'utilisation. Le nettoyage suit un plan
          validé, vérifié de nouveau juste avant toute suppression. Une connexion administrateur DSM
          est requise ; approuvez les tâches système avant d’utiliser les fonctions qui en
          dépendent"
        es: "Limpieza de espacio para NAS Synology con volúmenes Btrfs y ext4. Analiza un volumen o carpetas
          elegidas para ver qué ocupa realmente el espacio: carpetas compartidas, datos de paquetes,
          papeleras, instantáneas y la partición del sistema. Reclaim muestra cuánto liberaría de
          verdad una eliminación, incluido el espacio que aún retienen instantáneas o copias
          compartidas, y sigue la evolución del uso. La limpieza sigue un plan revisado que se
          vuelve a comprobar justo antes de borrar nada. Se requiere iniciar sesión como
          administrador de DSM y aprobar las tareas del sistema antes de usar las funciones que
          dependen de ellas"
        it: "Pulizia dello spazio per NAS Synology con volumi Btrfs ed ext4. Analizza un volume o le
          cartelle scelte per vedere cosa occupa davvero spazio: cartelle condivise, dati dei
          pacchetti, cestini, snapshot e partizione di sistema. Reclaim mostra quanto libererebbe
          davvero un'eliminazione, compreso lo spazio ancora trattenuto da snapshot o copie
          condivise, e segue l'andamento dell'utilizzo. La pulizia segue un piano verificato,
          controllato di nuovo subito prima di eliminare qualsiasi cosa. È richiesto l’accesso come
          amministratore DSM; approva le attività di sistema prima di usare le funzioni che ne
          dipendono"
      changelog:
        releases:
          0.1.1-1641:
            en:
              - System partition cleanup can now move files to a shared folder on an ext4 volume
              - System partition cleanup no longer leaves an empty temporary folder in the destination shared folder
              - Quota files at the root of an ext4 volume are now shown as DSM data and protected from cleanup
              - After upgrading, an administrator needs to approve the system tasks once more
              - Keep existing settings and saved scan reports
            zh-TW:
              - 系統分割區清理現在可以選擇 ext4 儲存空間上的共用資料夾作為目的地
              - 系統分割區清理完成後，不再於目的地共用資料夾留下空的暫存資料夾
              - ext4 儲存空間根目錄的配額檔案會標示為 DSM 資料並受到保護，不會被清理
              - 升級後，管理員需要再核准一次系統工作
              - 保留現有設定與已儲存的掃描報告
            zh-CN:
              - 系统分区清理现在可以选择 ext4 存储空间上的共享文件夹作为目标
              - 系统分区清理完成后，不再在目标共享文件夹中留下空的临时文件夹
              - ext4 存储空间根目录的配额文件会标记为 DSM 数据并受到保护，不会被清理
              - 升级后，管理员需要再批准一次系统任务
              - 保留现有设置与已保存的扫描报告
            ja:
              - システムパーティションのクリーンアップで、ext4 ボリューム上の共有フォルダを移動先に選択可能に
              - システムパーティションのクリーンアップ後、移動先の共有フォルダに空の一時フォルダが残らないように
              - ext4 ボリュームのルートにあるクォータファイルを DSM のデータとして表示し、クリーンアップから保護
              - アップグレード後、管理者がシステムタスクをもう一度承認する必要があります
              - 既存の設定と保存済みスキャンレポートを保持
            ko:
              - 시스템 파티션 정리에서 ext4 볼륨의 공유 폴더를 대상으로 선택할 수 있음
              - 시스템 파티션 정리 후 대상 공유 폴더에 빈 임시 폴더가 남지 않음
              - ext4 볼륨 루트의 할당량 파일을 DSM 데이터로 표시하고 정리되지 않도록 보호
              - 업그레이드 후 관리자가 시스템 작업을 한 번 더 승인해야 함
              - 기존 설정과 저장된 스캔 보고서 유지
            de:
              - Die Bereinigung der Systempartition kann jetzt einen freigegebenen Ordner auf einem ext4-Volume als Ziel verwenden
              - Nach der Bereinigung der Systempartition bleibt im freigegebenen Zielordner kein leerer temporärer Ordner mehr zurück
              - Kontingentdateien im Stammverzeichnis eines ext4-Volumes werden als DSM-Daten angezeigt und vor der Bereinigung geschützt
              - Nach dem Upgrade muss ein Administrator die Systemaufgaben einmal erneut freigeben
              - Bestehende Einstellungen und gespeicherte Scanberichte beibehalten
            fr:
              - Le nettoyage de la partition système peut désormais utiliser un dossier partagé sur un volume ext4 comme destination
              - Le nettoyage de la partition système ne laisse plus de dossier temporaire vide dans le dossier partagé de destination
              - Les fichiers de quota à la racine d’un volume ext4 sont affichés comme données DSM et protégés contre le nettoyage
              - Après la mise à jour, un administrateur doit approuver une nouvelle fois les tâches système
              - Conserver les réglages existants et les rapports d’analyse enregistrés
            es:
              - La limpieza de la partición del sistema ahora puede usar como destino una carpeta compartida en un volumen ext4
              - La limpieza de la partición del sistema ya no deja una carpeta temporal vacía en la carpeta compartida de destino
              - Los archivos de cuota en la raíz de un volumen ext4 se muestran como datos de DSM y quedan protegidos frente a la limpieza
              - Tras actualizar, un administrador debe aprobar de nuevo las tareas del sistema
              - Se conservan los ajustes existentes y los informes de análisis guardados
            it:
              - La pulizia della partizione di sistema ora può usare come destinazione una cartella condivisa su un volume ext4
              - La pulizia della partizione di sistema non lascia più una cartella temporanea vuota nella cartella condivisa di destinazione
              - I file di quota nella radice di un volume ext4 vengono mostrati come dati DSM e protetti dalla pulizia
              - Dopo l'aggiornamento, un amministratore deve approvare di nuovo le attività di sistema
              - Conserva le impostazioni esistenti e i report di analisi salvati
          0.1.1-1640:
            en:
              - If a delete is interrupted, for example by a restart or power cut, Syno Reclaim shows where it stopped and lets you delete the rest or finish the interrupted cleanup
              - After upgrading, an administrator needs to approve the system tasks once more
              - Keep existing settings and saved scan reports
            zh-TW:
              - 刪除中途被中斷（例如重新開機或斷電）時，Syno Reclaim 會顯示停在哪裡，並可繼續刪除剩下的項目或完成上次中斷的清理
              - 升級後，管理員需要再核准一次系統工作
              - 保留現有設定與已儲存的掃描報告
            zh-CN:
              - 删除中途被中断（例如重新启动或断电）时，Syno Reclaim 会显示停在哪里，并可继续删除剩下的项目或完成上次中断的清理
              - 升级后，管理员需要再批准一次系统任务
              - 保留现有设置与已保存的扫描报告
            ja:
              - 再起動や停電などで削除が中断された場合、Syno Reclaim が停止した位置を表示し、残りの削除や中断したクリーンアップの完了が可能に
              - アップグレード後、管理者がシステムタスクをもう一度承認する必要があります
              - 既存の設定と保存済みスキャンレポートを保持
            ko:
              - 재시작이나 정전 등으로 삭제가 중단되면 Syno Reclaim이 멈춘 위치를 보여 주고, 남은 항목을 삭제하거나 중단된 정리를 완료할 수 있음
              - 업그레이드 후 관리자가 시스템 작업을 한 번 더 승인해야 함
              - 기존 설정과 저장된 스캔 보고서 유지
            de:
              - Wird ein Löschvorgang unterbrochen, etwa durch einen Neustart oder Stromausfall, zeigt Syno Reclaim, wo er stehen blieb, und Sie können den Rest löschen oder die unterbrochene Bereinigung abschließen
              - Nach dem Upgrade muss ein Administrator die Systemaufgaben einmal erneut freigeben
              - Bestehende Einstellungen und gespeicherte Scanberichte beibehalten
            fr:
              - Si une suppression est interrompue, par exemple par un redémarrage ou une coupure de courant, Syno Reclaim indique où elle s’est arrêtée et vous permet de supprimer le reste ou de terminer le nettoyage interrompu
              - Après la mise à jour, un administrateur doit approuver une nouvelle fois les tâches système
              - Conserver les réglages existants et les rapports d’analyse enregistrés
            es:
              - Si una eliminación se interrumpe, por ejemplo por un reinicio o un corte de luz, Syno Reclaim muestra dónde se detuvo y permite eliminar el resto o terminar la limpieza interrumpida
              - Tras actualizar, un administrador debe aprobar de nuevo las tareas del sistema
              - Se conservan los ajustes existentes y los informes de análisis guardados
            it:
              - Se un'eliminazione viene interrotta, ad esempio da un riavvio o da un'interruzione di corrente, Syno Reclaim mostra dove si è fermata e permette di eliminare il resto o completare la pulizia interrotta
              - Dopo l'aggiornamento, un amministratore deve approvare di nuovo le attività di sistema
              - Conserva le impostazioni esistenti e i report di analisi salvati
          0.1.1-1639:
            en:
              - Deleting now shows shorter, clearer text, and every confirmation is still there
            zh-TW:
              - 刪除流程的文字更精簡，該確認的仍保留
            zh-CN:
              - 删除流程的文字更精简，该确认的仍保留
            ja:
              - 削除時の文言を簡潔にし、必要な確認はそのまま残しました
            ko:
              - 삭제 과정의 문구를 간결하게 다듬었고, 필요한 확인은 그대로 유지됩니다
            de:
              - Beim Löschen ist der Text kürzer und klarer, alle Bestätigungen bleiben erhalten
            fr:
              - Les textes de suppression sont plus courts et plus clairs, toutes les confirmations restent
            es:
              - Los textos al eliminar son más breves y claros, y se mantienen todas las confirmaciones
            it:
              - I testi dell'eliminazione sono più brevi e chiari, e tutte le conferme restano
          0.1.1-1638:
            en:
              - The scan status now sits behind the info button at the start of the page bar, so on a phone it no longer covers the list
              - When a cleanup cannot delete an item, Review says why and what to do next, and lets you remove that item to clean up the rest
              - The "Temporary folder during cleanup" note is gone; Syno Reclaim creates and removes its hidden folders automatically
              - Keep existing settings and saved scan reports
            zh-TW:
              - 掃描狀態改放在頁面列開頭的資訊按鈕中，手機上不再蓋住清單
              - 清理無法刪除某個項目時，檢閱畫面會說明原因與下一步，並可移除該項目、繼續清理其餘項目
              - 不再顯示「清理時的暫存資料夾」提示；Syno Reclaim 會自動建立並移除隱藏資料夾
              - 保留現有設定與已儲存的掃描報告
            zh-CN:
              - 扫描状态改放在页面栏开头的信息按钮中，手机上不再遮住列表
              - 清理无法删除某个项目时，检查界面会说明原因与下一步，并可移除该项目、继续清理其余项目
              - 不再显示“清理时的临时文件夹”提示；Syno Reclaim 会自动创建并移除隐藏文件夹
              - 保留现有设置与已保存的扫描报告
            de:
              - Der Scanstatus liegt jetzt hinter der Infotaste am Anfang der Seitenleiste und verdeckt auf dem Smartphone nicht mehr die Liste
              - Kann eine Bereinigung ein Element nicht löschen, nennt die Überprüfung Grund und nächsten Schritt, und Sie können das Element entfernen, um den Rest zu bereinigen
              - Der Hinweis „Temporärer Ordner während der Bereinigung“ entfällt; Syno Reclaim erstellt und entfernt seine versteckten Ordner automatisch
              - Bestehende Einstellungen und gespeicherte Scanberichte beibehalten
            fr:
              - L’état de l’analyse se trouve désormais derrière le bouton d’information au début de la barre de page et ne recouvre plus la liste sur un téléphone
              - Lorsqu’un nettoyage ne peut pas supprimer un élément, la vérification indique pourquoi et quoi faire, et vous pouvez retirer cet élément pour nettoyer le reste
              - La note « Dossier temporaire pendant le nettoyage » disparaît ; Syno Reclaim crée et supprime ses dossiers masqués automatiquement
              - Conserver les réglages existants et les rapports d’analyse enregistrés
            ja:
              - スキャン状態をページバー先頭の情報ボタンに移し、スマートフォンで一覧を覆わないように変更
              - クリーンアップで項目を削除できない場合、確認画面に理由と次の手順を表示し、その項目を外して残りをクリーンアップ可能に
              - 「クリーンアップ中の一時フォルダ」の説明を削除。Syno Reclaim が非表示フォルダを自動で作成・削除します
              - 既存の設定と保存済みスキャンレポートを保持
            ko:
              - 스캔 상태가 페이지 표시줄 시작 부분의 정보 버튼으로 옮겨져 휴대폰에서 더 이상 목록을 가리지 않음
              - 정리 중 항목을 삭제할 수 없으면 검토 화면에 이유와 다음 단계가 표시되고, 해당 항목을 제거해 나머지를 정리할 수 있음
              - 정리 중 임시 폴더에 대한 안내 삭제. Syno Reclaim이 숨겨진 폴더를 자동으로 만들고 제거함
              - 기존 설정과 저장된 스캔 보고서 유지
            es:
              - El estado del análisis está ahora tras el botón de información al inicio de la barra de página y ya no tapa la lista en un teléfono
              - Cuando una limpieza no puede eliminar un elemento, la revisión indica el motivo y el siguiente paso, y puede quitar ese elemento para limpiar el resto
              - Desaparece la nota «Carpeta temporal durante la limpieza»; Syno Reclaim crea y elimina sus carpetas ocultas automáticamente
              - Conservar los ajustes existentes y los informes de análisis guardados
            it:
              - Lo stato della scansione si trova ora dietro il pulsante informazioni all’inizio della barra di pagina e su un telefono non copre più l’elenco
              - Quando una pulizia non può eliminare un elemento, la revisione indica il motivo e il passo successivo, e puoi rimuovere l’elemento per pulire il resto
              - Scompare la nota «Cartella temporanea durante la pulizia»; Syno Reclaim crea e rimuove automaticamente le sue cartelle nascoste
              - Mantenere le impostazioni esistenti e i rapporti di scansione salvati
          0.1.1-1636:
            en:
              - Fix installs that ended with "The operation failed" and an app that would not open until DSM was reloaded
              - Keep existing settings and saved scan reports
            zh-TW:
              - 修正安裝結束時顯示「操作失敗」、且需重新整理 DSM 才能開啟 App 的問題
              - 保留現有設定與已儲存的掃描報告
            zh-CN:
              - 修复安装结束时显示“操作失败”、且需刷新 DSM 才能打开应用的问题
              - 保留现有设置与已保存的扫描报告
            de:
              - Behebt Installationen, die mit „Der Vorgang ist fehlgeschlagen“ endeten und deren App sich erst nach dem Neuladen von DSM öffnete
              - Bestehende Einstellungen und gespeicherte Scanberichte beibehalten
            fr:
              - Corrige les installations qui se terminaient par « L’opération a échoué » et une app qui ne s’ouvrait qu’après avoir rechargé DSM
              - Conserver les réglages existants et les rapports d’analyse enregistrés
            ja:
              - インストールが「操作に失敗しました」で終わり、DSM を再読み込みするまでアプリが開かない問題を修正
              - 既存の設定と保存済みスキャンレポートを保持
            ko:
