          Atom、分類整理訂閱項目、搜尋文章，並將喜歡的內容收藏以便稍後閱讀。每位讀者各自保有訂閱與閱讀進度；需 DSM 管理員登入及
          Container Manager
        zh-CN: 将喜爱网站的新闻与更新集中到同一个阅读器。订阅 RSS 与 Atom、分类整理订阅项目、搜索文章，并将喜欢的内容收藏以便稍后阅读。每位读者各自保有订阅与阅读进度；需 DSM 管理员登录及 Container Manager
        de: Hol dir Neuigkeiten und Updates deiner Lieblingsseiten in einen Reader. Abonniere RSS- und Atom-Feeds, ordne Abos in Kategorien, durchsuche Artikel und merke dir Favoriten für später. Jeder Leser hat eigene Abos und einen eigenen Lesestand; DSM-Anmeldung als Administrator und Container Manager sind erforderlich
        fr: Rassemblez les actualités de vos sites préférés dans un seul lecteur. Abonnez-vous à des flux RSS et Atom, rangez vos abonnements par catégories, recherchez des articles et gardez vos favoris pour plus tard. Chaque lecteur a ses propres abonnements et sa progression de lecture ; connexion DSM en tant qu'administrateur et Container Manager requis
        ja: お気に入りのサイトのニュースや更新をひとつのリーダーにまとめます。RSS や Atom フィードを購読し、カテゴリーで整理し、記事を検索し、お気に入りを保存できます。購読と既読状況は読者ごとに分かれます。DSM の管理者サインインと Container Manager が必要です
        ko: 좋아하는 사이트의 소식과 업데이트를 리더 하나로 모아요. RSS와 Atom 피드를 구독하고, 카테고리로 정리하고, 글을 검색하고, 즐겨찾기로 저장해 둘 수 있어요. 구독과 읽은 상태는 사용자마다 따로예요. DSM 관리자 로그인과 Container Manager가 필요해요
