        de: "Beim Öffnen über HTTP eine HTTPS-Hinweisseite mit direktem HTTPS-Link anzeigen"
        fr: "Afficher une page d’aide HTTPS avec un lien HTTPS direct lors d’une ouverture via HTTP"
