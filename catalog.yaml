        en: >-
          Select a dedicated existing Shared Folder for consume during
          installation, then grant the package account Read/Write in Control
          Panel > Shared Folder > Permissions > System internal user. Selection
          alone does not grant access. Consumed files are removed from the
          inbox; keep backups. Export stays in the private App volume.


          Open Paperless from the DSM main menu using DSM OIDC. Authorized
          ordinary DSM users receive their own Paperless account; administrators
          receive the native administrator role on OIDC login. Document
          ownership and sharing follow Paperless permissions. Native API tokens
          remain available through My Profile.


          DSM logout, account deletion and role changes do not immediately
          revoke existing Paperless sessions or API tokens. Deleting a DSM
          account does not automatically delete its Paperless account. First
          start downloads and verifies the pinned Chinese OCR models over HTTPS.
          Physical mobile clients, Tika and Gotenberg are outside the verified
          scope.


          Requires DSM 7.2.1 or later, x86_64 and Container Manager. Built with
          published CLI/templates/SDK/App 0.22.0, executor/v0.20.0 and template
          UI 0.12.5; official upstream images and UI remain unchanged.


