      description:
        en: Organize and stream your movies, TV shows and music
        zh-TW: 整理與串流播放你的電影、影集和音樂
        zh-CN: 整理与串流播放你的电影、影集和音乐
        de: Filme, Serien und Musik ordnen und streamen
        fr: Organisez et diffusez vos films, séries et musique
        ja: 映画、テレビ番組、音楽を整理してストリーミング
        ko: 영화, TV 프로그램, 음악을 정리하고 스트리밍
        es: Organiza y reproduce tus películas, series y música en streaming
        it: Organizza e riproduci in streaming film, serie TV e musica
      long_description:
        en: Turn your media collection into a personal streaming library. Browse movies and TV shows with
          artwork, organize music and play your collection in a browser. TV/mobile native clients
          cannot use this entry, and DLNA is disabled. The selected media folder is read-only and
          needs package-account read permission; App data remains after uninstall. DSM sign-in and
          Container Manager are required
        zh-TW: 將媒體收藏變成個人串流媒體庫。透過封面瀏覽電影與影集、整理音樂，並在瀏覽器播放。TV／手機原生用戶端不支援此入口，DLNA 未啟用。所選媒體資料夾為唯讀，須授予套件帳號讀取權限，卸載後
          App 資料仍會保留。需 DSM 登入及 Container Manager
        zh-CN: 将媒体收藏变成个人串流媒体库。通过封面浏览电影与影集、整理音乐，并在浏览器播放。TV／手机原生用户端不支持此入口，DLNA 未激活。所选媒体文件夹为唯读，须授予套件帐号读取权限，卸载后
          App 数据仍会保留。需 DSM 登录及 Container Manager
        de: Mach aus deiner Mediensammlung eine eigene Streaming-Bibliothek. Stöbere in Filmen und Serien
          mit Covern, ordne Musik und spiel deine Sammlung im Browser ab. Native TV- und
          Mobil-Clients können diesen Zugang nicht nutzen, DLNA ist deaktiviert. Der gewählte
          Medienordner ist schreibgeschützt und braucht Lesezugriff für das Paketkonto; App-Daten
          bleiben nach der Deinstallation erhalten. DSM-Anmeldung und Container Manager sind
          erforderlich
        fr: Transformez votre collection multimédia en bibliothèque de streaming personnelle. Parcourez
          films et séries avec leurs visuels, organisez votre musique et lisez votre collection dans
          un navigateur. Les clients natifs TV et mobiles ne peuvent pas utiliser cet accès, et le
          DLNA est désactivé. Le dossier multimédia choisi est en lecture seule et doit accorder la
          lecture au compte du paquet ; les données de l'App restent après la désinstallation.
          Connexion DSM et Container Manager requis
        ja: メディア コレクションを自分専用のストリーミング ライブラリにします。アートワーク付きで映画やテレビ番組を見て回り、音楽を整理し、ブラウザーで再生できます。TV やモバイルのネイティブ
          クライアントはこの入口を使えず、DLNA は無効です。選択したメディア フォルダーは読み取り専用で、パッケージ
          アカウントの読み取り権限が必要です。アプリのデータはアンインストール後も残ります。DSM サインインと Container Manager が必要です
        ko: 미디어 컬렉션을 나만의 스트리밍 서재로 만들어요. 아트워크와 함께 영화와 TV 프로그램을 둘러보고, 음악을 정리하고, 브라우저에서 재생해요. TV·모바일 네이티브
          클라이언트는 이 입구를 쓸 수 없고 DLNA는 꺼져 있어요. 선택한 미디어 폴더는 읽기 전용이며 패키지 계정의 읽기 권한이 필요하고, 앱 데이터는 제거 후에도
          남아요. DSM 로그인과 Container Manager가 필요해요
        es: Convierte tu colección multimedia en una biblioteca personal de streaming. Explora películas y
          series con sus carátulas, organiza música y reproduce la colección en un navegador. Los
          clientes nativos de TV y móviles no pueden usar este acceso, y DLNA está desactivado. La
          carpeta multimedia seleccionada es de solo lectura y requiere permiso de lectura para la
          cuenta del paquete; los datos de la aplicación se conservan tras desinstalarla. Requiere
          iniciar sesión en DSM y disponer de Container Manager
        it: Trasforma la tua raccolta multimediale in una libreria personale in streaming. Sfoglia film e
          serie TV con le copertine, organizza la musica e riproduci la raccolta nel browser. I
          client nativi per TV e dispositivi mobili non possono usare questo accesso e DLNA è
          disattivato. La cartella multimediale selezionata è in sola lettura e richiede il permesso
          di lettura per l'account del pacchetto; i dati dell'app restano dopo la disinstallazione.
          Richiede l'accesso a DSM e Container Manager
