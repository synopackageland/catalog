      long_description:
        en: Bring compatible smart home devices together, control them from dashboards and create
          automations for everyday routines. Keep control of your home on your own server. This
          package supports mDNS discovery, but not SSDP, USB/Bluetooth, Supervisor or add-ons;
          mobile app sign-in and upgrades are unverified. Settings remain in Container Manager
          volumes after uninstall; DSM administrator sign-in and Container Manager are required
        zh-TW: 整合相容的智慧家庭裝置，透過儀表板集中控制，並建立日常生活的自動化流程，將家庭控制權留在自己的伺服器上。本套件支援 mDNS 探索，不支援
          SSDP、USB／Bluetooth、Supervisor 與 add-ons；手機 App 登入及升級尚未驗證。卸載後設定仍保留於 Container Manager
          儲存空間；需 DSM 管理員登入及 Container Manager
        zh-CN: 集成兼容的智能家庭设备，通过仪表板集中控制，并创建日常生活的自动化流程，将家庭控制权留在自己的服务器上。本套件支持 mDNS 探索，不支持
          SSDP、USB／Bluetooth、Supervisor 与 add-ons；手机 App 登录及升级尚未验证。卸载后设置仍保留于 Container Manager
          存储空间；需 DSM 管理员登录及 Container Manager
        de: Bring kompatible Smart-Home-Geräte zusammen, steuere sie über Dashboards und erstelle
          Automationen für den Alltag. Dein Zuhause bleibt unter deiner Kontrolle auf deinem eigenen
          Server. Dieses Paket unterstützt mDNS-Erkennung, aber weder SSDP, USB/Bluetooth,
          Supervisor noch Add-ons; Anmeldung in der Mobil-App und Upgrades sind ungeprüft.
          Einstellungen bleiben nach der Deinstallation in Volumes von Container Manager;
          DSM-Anmeldung als Administrator und Container Manager sind erforderlich
        fr: Réunissez vos appareils domotiques compatibles, pilotez-les depuis des tableaux de bord et créez
          des automatisations pour le quotidien. Gardez le contrôle de votre maison sur votre propre
          serveur. Ce paquet prend en charge la découverte mDNS, mais pas SSDP, USB/Bluetooth,
          Supervisor ni les modules complémentaires ; la connexion depuis l'application mobile et
          les mises à niveau ne sont pas vérifiées. Les paramètres restent dans les volumes de
          Container Manager après la désinstallation ; connexion DSM en tant qu'administrateur et
          Container Manager requis
        ja: 対応するスマートホーム機器をまとめ、ダッシュボードから操作し、毎日の自動化を作れます。家のコントロールを自分のサーバーに置いておけます。このパッケージは mDNS
          による検出に対応していますが、SSDP、USB/Bluetooth、Supervisor、アドオンには対応していません。モバイル
          アプリからのサインインとアップグレードは未検証です。設定はアンインストール後も Container Manager のボリュームに残ります。DSM の管理者サインインと
          Container Manager が必要です
        ko: 호환되는 스마트홈 기기를 한데 모아 대시보드로 제어하고, 일상을 위한 자동화를 만들어요. 집의 제어권을 내 서버에 둘 수 있어요. 이 패키지는 mDNS 검색을 지원하지만
          SSDP, USB/Bluetooth, Supervisor, 애드온은 지원하지 않고, 모바일 앱 로그인과 업그레이드는 검증되지 않았어요. 설정은 제거 후에도
          Container Manager 볼륨에 남아요. DSM 관리자 로그인과 Container Manager가 필요해요
        es: Reúne dispositivos domésticos inteligentes compatibles, contrólalos desde paneles y crea
          automatizaciones para las rutinas diarias. Mantén el control de tu hogar en tu propio
          servidor. Este paquete admite la detección por mDNS, pero no SSDP, USB/Bluetooth,
          Supervisor ni complementos; no se han verificado el inicio de sesión en la aplicación
          móvil ni las actualizaciones. La configuración se conserva en los volúmenes de Container
          Manager tras desinstalarlo; requiere iniciar sesión como administrador de DSM y disponer
          de Container Manager
        it: Riunisci i dispositivi compatibili della casa intelligente, controllali dalle dashboard e crea
          automazioni per le attività quotidiane. Mantieni il controllo della casa sul tuo server.
          Questo pacchetto supporta il rilevamento mDNS, ma non SSDP, USB/Bluetooth, Supervisor o
          componenti aggiuntivi; l'accesso dall'app mobile e gli aggiornamenti non sono stati
          verificati. Le impostazioni restano nei volumi di Container Manager dopo la
          disinstallazione; richiede l'accesso come amministratore DSM e Container Manager
