      long_description:
        en: >-
          Select an existing music Shared Folder during installation and grant
          the package account Read access through the native permission guide.
          Grant the App privilege to the intended DSM users, then open Navidrome
          from the DSM main menu. Each DSM user receives an App identity;
          administrators receive Navidrome administration, and an ordinary first
          login does not become administrator.


          Set a separate Navidrome password in personal settings before
          configuring a Subsonic client. Use the displayed Navidrome username
          and App HTTPS URL; never enter the DSM password in that client. Role
          changes require signing in again. Public share links are anonymous
          until removed.


          Requires DSM 7.2.1 or later, x86_64 and Container Manager. Built with
          published CLI/templates/SDK/App 0.22.0, executor/v0.20.0 and template
          UI 0.12.5; official upstream images and UI remain unchanged.


          Data retention: Container Manager named volumes survive uninstall even
          when delete-data is selected. Back up App data and manage retained
          volumes separately.


          Preview; not recommended. Corresponding source and integration
          documentation are available from the linked release tag.
        zh-TW: |-
          安裝時選擇既有音樂共用資料夾，並依權限指引授予套件帳號讀取權限；選擇資料夾不等於授權。所有獲授權使用者共用該音樂庫，使用套件帳號存取檔案，不是登入者個別的檔案 ACL。授予預定使用者 App 使用權限後，從 DSM 主選單開啟。各 DSM 使用者取得個別 App 身分，管理員取得 Navidrome 管理權；第一個登入的一般使用者不會自動升為管理員。Subsonic 客戶端須先在個人設定設立另一組 Navidrome 密碼，使用顯示的 Navidrome 使用者名稱與 App HTTPS URL，不可填入 DSM 密碼。DSM 角色變更須重新登入或等待 session 到期；公開分享連結在移除前可匿名存取。

          需 x86_64、DSM 7.2.1 或以上與 Container Manager。使用正式 CLI/templates/SDK/App 0.22.0、executor/v0.20.0 與 UI 0.12.5，沿用官方映像與介面。卸載即使勾選刪除資料，仍會保留 Container Manager named volumes；請備份並另行管理保留資料。本版為預覽版，不列為推薦套件；對應原始碼與整合文件見 Release tag。
