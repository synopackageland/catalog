      homepage: https://www.varvis.me
      long_description:
        en: Find what really frees space on a Btrfs volume, and free it safely.
        zh-TW: 找出 Btrfs 儲存空間的可回收項目，並安全釋放空間。
      changelog: |-
        0.1.1-1528
        - Live Btrfs scans now complete with clearly marked approximate figures instead of failing when the volume changes during the scan; real I/O and permission errors still fail.
        - Cleanup refuses a plan when a file was appended in place after planning, and keeps the file.
        - Security: unauthenticated requests are refused before their body is parsed, JSON size and nesting are bounded, and administrator rights are re-checked with DSM on every request.
        - DSM window and dialog fixes; app-scoped modals.
        - Upgrading requires confirming your DSM password again.

        - 即時 Btrfs 掃描在掃描期間磁碟區有變動時，會以標示為近似的結果完成，不再整體失敗；真正的 I/O 與權限錯誤仍會失敗。
        - 規劃後檔案被原地追加內容時，清理會拒絕該計畫並保留檔案。
        - 安全性：未認證請求在解析內容前即被拒絕，JSON 大小與巢狀深度設有上限，每次請求都向 DSM 重新確認管理員身分。
        - DSM 視窗與對話框修正；改用 app 範圍的 modal。
        - 升級後需要重新確認 DSM 密碼。
