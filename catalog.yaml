          - No NAS tests were performed for this release.

          - Administrator reapproval of system access is required after
          upgrading.

          - Includes New scan system-partition refresh and loading overlay
          fixes; build 1582 was unpublished.
        zh-TW: >-
          0.1.1-1583

          - 使用已發佈 SDK/App/CLI/templates 0.24.0、UI 0.14.3 安全重建；自有 Go binaries 使用
          go1.26.10。

          - 使用官方圖示並保留來源、授權及既有顯示名稱。

          - 本輪未執行 NAS 測試。

          - 升級後須由管理員重新核准系統存取。

          - 包含 New scan 系統磁區重新檢查及 Loading 遮罩修正；1582 為未上架開發版。
